# Sveltia CMS — admin panel at /admin/
# Docs: https://sveltiacms.app/en/docs  ·  Guide for this site: docs/GUIDE-ADMIN.md
# Every save = one commit on GitHub = automatic rebuild of the site (≈2 min).

backend:
  name: github
  repo: Dimogdor/Evergreen
  branch: main
  # Login helper (worker/README.md). Without it, sign in with “Sign in using access token”.
  # base_url: https://evergreen-api.YOUR-ACCOUNT.workers.dev

app_title: Evergreen — Admin
logo:
  src: logo.png
site_url: https://dimogdor.github.io/Evergreen/
display_url: https://dimogdor.github.io/Evergreen/

# Uploaded photos are converted to WebP (max 2000 px) in the browser before upload,
# then resized again per screen size when the site is built.
media_folder: src/assets/uploads
public_folder: /src/assets/uploads
media_libraries:
  default:
    config:
      max_file_size: 52428800
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 80
          width: 2000
          height: 2000

slug:
  encoding: ascii
  clean_accents: true

i18n:
  structure: single_file
  locales: [el, en, fr, es, it, ru, de, pt]
  default_locale: el

editor:
  preview: false

output:
  omit_empty_optional_fields: true

collections:
  # ───────────────────────── Calendar ─────────────────────────
  - name: events
    label: Ημερολόγιο · Calendar
    label_singular: Εκδήλωση · Event
    description: Retreats, workshops, ESC projects, gatherings. Past events disappear from the site automatically.
    icon: calendar_month
    folder: src/content/events
    extension: yml
    format: yaml
    create: true
    i18n: true
    identifier_field: title
    slug:
      template: "{{fields.start}}-{{uuid_short}}"
      editable: false
    summary: "{{start}} · {{title}}"
    thumbnail: image
    sortable_fields:
      fields: [start, title]
      default:
        field: start
        direction: descending
    view_groups:
      - label: Year
        field: start
        pattern: \d{4}
    fields:
      - { name: title, label: Τίτλος · Title, widget: string, i18n: true }
      - { name: start, label: Έναρξη · Start date, widget: datetime, type: date, format: YYYY-MM-DD }
      - { name: end, label: Λήξη · End date, widget: datetime, type: date, format: YYYY-MM-DD, required: false, hint: Leave empty for a one-day event. }
      - { name: startTime, label: Ώρα έναρξης · Start time, widget: string, required: false, pattern: ['^([01]?\d|2[0-3]):[0-5]\d$', 'Write the time like 18:00'], hint: "Greek time, e.g. 18:00. Leave empty for all-day events — visitors see it converted in their own calendar." }
      - { name: endTime, label: Ώρα λήξης · End time, widget: string, required: false, pattern: ['^([01]?\d|2[0-3]):[0-5]\d$', 'Write the time like 20:00'] }
      - name: category
        label: Κατηγορία · Category
        widget: select
        default: other
        options:
          - { label: ESC, value: esc }
          - { label: Retreat, value: retreat }
          - { label: Yoga, value: yoga }
          - { label: Workshop, value: workshop }
          - { label: Community, value: community }
          - { label: Other, value: other }
      - { name: summary, label: Περιγραφή · Short description, widget: text, i18n: true, required: false }
      - { name: price, label: Τιμή · Price, widget: string, i18n: true, required: false, hint: "e.g. €380 early bird · €450 — leave empty if free or not relevant." }
      - { name: location, label: Τοποθεσία · Place, widget: string, i18n: true, required: false, hint: Leave empty if it happens at the Evergreen Project. }
      - { name: image, label: Φωτογραφία · Photo, widget: image, required: false }
      - name: program
        label: Δραστηριότητα · Related activity
        widget: relation
        collection: programs
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        required: false
        hint: Adds a “Read more” link to this activity.
      - { name: link, label: Σύνδεσμος · Booking / info link, widget: string, required: false, hint: "Full address starting with https://" }
      - { name: linkLabel, label: Κείμενο συνδέσμου · Link text, widget: string, i18n: true, required: false, hint: "e.g. Book now" }
      - { name: draft, label: Κρυφό · Hidden, widget: boolean, default: false, required: false, hint: Hidden events are not shown on the site. }

  # ───────────────────────── Activities ─────────────────────────
  - name: programs
    label: Δραστηριότητες · Activities
    label_singular: Δραστηριότητα · Activity
    description: Each activity has its own page. Drag to reorder.
    icon: diversity_3
    folder: src/content/programs
    extension: yml
    format: yaml
    create: true
    i18n: true
    identifier_field: title
    slug:
      template: "{{slug}}"
      editable: [create]
    thumbnail: image
    reorder: true
    fields:
      - { name: title, label: Τίτλος · Title, widget: string, i18n: true }
      - { name: summary, label: Σύνοψη · Summary, widget: text, i18n: true, hint: One or two sentences shown on cards. }
      - { name: image, label: Κύρια φωτογραφία · Main photo, widget: image }
      - { name: featured, label: Στην αρχική · Show on home page, widget: boolean, default: false, required: false }
      - { name: body, label: Κείμενο · Full text, widget: markdown, i18n: true, required: false }
      - &facts
        name: facts
        label: Με μια ματιά · Key facts
        widget: list
        i18n: true
        required: false
        summary: "{{label}}: {{value}}"
        fields:
          - { name: label, label: Ετικέτα · Label, widget: string, i18n: true }
          - { name: value, label: Τιμή · Value, widget: string, i18n: true }
      - &faq
        name: faq
        label: Ερωτήσεις · FAQ
        widget: list
        i18n: true
        required: false
        summary: "{{q}}"
        fields:
          - { name: q, label: Ερώτηση · Question, widget: string, i18n: true }
          - { name: a, label: Απάντηση · Answer, widget: markdown, i18n: true, buttons: [bold, italic, link, bulleted-list] }
      - { name: gallery, label: Φωτογραφίες · Photos, widget: image, multiple: true, required: false }
      - { name: link, label: Σύνδεσμος · External link, widget: string, required: false, hint: "Optional button, e.g. a booking page (https://…)" }
      - { name: linkLabel, label: Κείμενο συνδέσμου · Link text, widget: string, i18n: true, required: false }
      - { name: order, label: Σειρά · Order, widget: number, value_type: int, required: false, hint: Set automatically when you drag entries. }

  # ───────────────────────── Inhabitants ─────────────────────────
  - name: inhabitants
    label: Κάτοικοι · Inhabitants
    label_singular: Κάτοικος · Inhabitant
    description: People, animals and plants of the place. Drag to reorder.
    icon: pets
    folder: src/content/inhabitants
    extension: yml
    format: yaml
    create: true
    i18n: true
    identifier_field: name
    slug:
      template: "{{slug}}"
      editable: [create]
    thumbnail: photo
    reorder: true
    view_groups:
      - label: Kind
        field: kind
    fields:
      - { name: name, label: Όνομα · Name, widget: string, i18n: true }
      - name: kind
        label: Είδος · Kind
        widget: select
        default: human
        options:
          - { label: Άνθρωπος · Person, value: human }
          - { label: Ζώο · Animal, value: animal }
          - { label: Φυτό · Plant, value: plant }
      - { name: role, label: Ρόλος · Role, widget: string, i18n: true, required: false }
      - { name: bio, label: Λίγα λόγια · Short bio, widget: text, i18n: true, required: false }
      - { name: photo, label: Φωτογραφία · Photo, widget: image, required: false, hint: "A square photo looks best. Without a photo, initials are shown." }
      - { name: order, label: Σειρά · Order, widget: number, value_type: int, required: false }

  # ───────────────────────── Gallery ─────────────────────────
  - name: albums
    label: Γκαλερί · Gallery
    label_singular: Άλμπουμ · Album
    description: Photo and video albums. Select many photos at once; they are compressed automatically.
    icon: photo_library
    folder: src/content/albums
    extension: yml
    format: yaml
    create: true
    i18n: true
    identifier_field: title
    slug:
      template: "{{slug}}"
      editable: [create]
    reorder: true
    fields:
      - { name: title, label: Τίτλος · Title, widget: string, i18n: true }
      - { name: description, label: Περιγραφή · Description, widget: text, i18n: true, required: false }
      - { name: photos, label: Φωτογραφίες · Photos, widget: image, multiple: true, required: false, hint: "The first photos are shown first — drag to reorder." }
      - name: videos
        label: Βίντεο · Videos
        widget: list
        required: false
        hint: "Best: upload the video to YouTube (can be “unlisted”) and paste the link. Short clips can also be uploaded directly."
        summary: "{{title}}"
        fields:
          - { name: title, label: Τίτλος · Title, widget: string, required: false }
          - { name: url, label: Σύνδεσμος YouTube/Vimeo · YouTube/Vimeo link, widget: string, required: false }
          - name: file
            label: Ή αρχείο βίντεο · Or a video file (MP4)
            widget: file
            required: false
            media_folder: /public/uploads/videos
            public_folder: /uploads/videos
            accept: video/*
            hint: Short clips only (under ~40 MB). Videos are compressed automatically when the site is published.
      - { name: order, label: Σειρά · Order, widget: number, value_type: int, required: false }

  # ───────────────────────── Stories (testimonials) ─────────────────────────
  - name: testimonials
    label: Ιστορίες · Stories
    label_singular: Ιστορία · Story
    description: Stories sent by visitors arrive here unpublished (you also get an email). Read them, tick “Published” to show them — or delete them. You can also add stories and photos yourself.
    icon: format_quote
    folder: src/content/testimonials
    extension: yml
    format: yaml
    create: true
    identifier_field: name
    slug:
      template: "{{year}}-{{month}}-{{day}}-{{slug}}"
      editable: false
    summary: "{{published | ternary('✅', '⏳')}} {{name}} · {{project}}"
    thumbnail: photo
    sortable_fields:
      fields: [date, name]
      default:
        field: date
        direction: descending
    view_filters:
      - { label: ⏳ Waiting for approval, field: published, pattern: false }
      - { label: ✅ Published, field: published, pattern: true }
    fields:
      - { name: published, label: Δημοσιευμένο · Published, widget: boolean, default: false, hint: Only published stories appear on the site. }
      - { name: name, label: Όνομα · Name, widget: string }
      - { name: country, label: Χώρα · Country, widget: string, required: false }
      - { name: project, label: Πρόγραμμα & χρονιά · Programme & year, widget: string, required: false, hint: "e.g. ESC 2025" }
      - { name: quote, label: Ιστορία · Story, widget: text }
      - { name: photo, label: Φωτογραφία · Photo, widget: image, required: false }
      - { name: video, label: Βίντεο YouTube/Vimeo · Video link, widget: string, required: false }
      - { name: date, label: Ημερομηνία · Date, widget: datetime, type: date, format: YYYY-MM-DD }

  # ───────────────────────── Pages ─────────────────────────
  - name: pages
    label: Σελίδες · Pages
    label_singular: Σελίδα · Page
    description: Texts and photos of every page.
    icon: article
    i18n: true
    files:
      - name: home
        label: Αρχική · Home
        file: src/content/pages/home.yml
        format: yaml
        i18n: true
        fields:
          - { name: image, label: Μεγάλη φωτογραφία · Hero photo, widget: image }
          - { name: imageAlt, label: Περιγραφή φωτογραφίας · Photo description (for the blind & Google), widget: string, i18n: true, required: false }
          - { name: title, label: Μεγάλος τίτλος · Headline, widget: text, i18n: true }
          - { name: subtitle, label: Υπότιτλος · Subtitle, widget: text, i18n: true }
          - { name: manifesto, label: Μανιφέστο · Manifesto, widget: text, i18n: true }
          - { name: intro, label: Εισαγωγή · Intro, widget: markdown, i18n: true }
          - name: facts
            label: Αριθμοί · Key numbers
            widget: list
            i18n: true
            summary: "{{value}} — {{label}}"
            fields:
              - { name: value, label: Αριθμός · Number, widget: string, i18n: true }
              - { name: label, label: Ετικέτα · Label, widget: string, i18n: true }
          - { name: showEsc, label: Εμφάνιση ενότητας ESC · Show the ESC block, widget: boolean, default: true, required: false }
          - { name: escTitle, label: ESC — τίτλος · ESC title, widget: string, i18n: true }
          - { name: escText, label: ESC — κείμενο · ESC text, widget: markdown, i18n: true }
          - { name: escImage, label: ESC — φωτογραφία · ESC photo, widget: image }
          - { name: showEvents, label: Εμφάνιση επόμενων εκδηλώσεων · Show upcoming events, widget: boolean, default: true, required: false }
          - { name: showStories, label: Εμφάνιση ιστοριών · Show stories, widget: boolean, default: true, required: false }
          - { name: showYoga, label: Εμφάνιση ενότητας γιόγκα · Show the yoga block, widget: boolean, default: true, required: false }
          - { name: yogaKicker, label: Γιόγκα — μικρός τίτλος · Yoga small title, widget: string, i18n: true, required: false }
          - { name: yogaTitle, label: Γιόγκα — τίτλος · Yoga title, widget: string, i18n: true }
          - { name: yogaText, label: Γιόγκα — κείμενο · Yoga text, widget: markdown, i18n: true }
          - { name: yogaImage, label: Γιόγκα — φωτογραφία · Yoga photo, widget: image }
          - { name: showGallery, label: Εμφάνιση φωτογραφιών · Show photos, widget: boolean, default: true, required: false }
          - { name: galleryPhotos, label: Φωτογραφίες αρχικής · Home page photos, widget: image, multiple: true, required: false, hint: "Optional. Empty = the first photos of each album." }
          - { name: contactTitle, label: Τελική φράση · Closing sentence, widget: string, i18n: true }
      - name: about
        label: Το πρότζεκτ · The project
        file: src/content/pages/about.yml
        format: yaml
        i18n: true
        fields: &pageFields
          - &title { name: title, label: Τίτλος · Title, widget: string, i18n: true }
          - &intro { name: intro, label: Εισαγωγή · Intro, widget: text, i18n: true, required: false }
          - &cover { name: image, label: Μεγάλη φωτογραφία · Cover photo, widget: image, required: false }
          - &sections
            name: sections
            label: Ενότητες · Sections
            label_singular: Ενότητα · Section
            widget: list
            i18n: true
            required: false
            summary: "{{heading}}"
            fields:
              - { name: heading, label: Επικεφαλίδα · Heading, widget: string, i18n: true }
              - { name: text, label: Κείμενο · Text, widget: markdown, i18n: true }
              - { name: image, label: Φωτογραφία · Photo, widget: image, i18n: duplicate, required: false }
          - *facts
          - &lists
            name: lists
            label: Λίστες · Lists (facilities, wishlist…)
            widget: list
            i18n: true
            required: false
            summary: "{{title}}"
            fields:
              - { name: title, label: Τίτλος λίστας · List title, widget: string, i18n: true }
              - { name: intro, label: Εισαγωγή · Intro, widget: text, i18n: true, required: false }
              - name: items
                label: Στοιχεία · Items
                widget: list
                i18n: true
                summary: "{{title}}"
                fields:
                  - { name: title, label: Τίτλος · Title, widget: string, i18n: true }
                  - { name: text, label: Κείμενο · Text, widget: text, i18n: true, required: false }
          - *faq
      - { name: place, label: Ο τόπος · The place, file: src/content/pages/place.yml, format: yaml, i18n: true, fields: *pageFields }
      - { name: life, label: Τρόπος ζωής · Way of life, file: src/content/pages/life.yml, format: yaml, i18n: true, fields: *pageFields }
      - { name: inhabitants, label: Οι κάτοικοι · Inhabitants page, file: src/content/pages/inhabitants.yml, format: yaml, i18n: true, fields: *pageFields }
      - { name: support, label: Στήριξη · Support us (bank details in Settings), file: src/content/pages/support.yml, format: yaml, i18n: true, fields: *pageFields }
      - { name: contact, label: Επικοινωνία · Contact page (contacts in Settings), file: src/content/pages/contact.yml, format: yaml, i18n: true, fields: *pageFields }
      - { name: activities, label: Δραστηριότητες (εισαγωγή) · Activities intro, file: src/content/pages/activities.yml, format: yaml, i18n: true, fields: &shortFields [*title, *intro] }
      - { name: calendar, label: Ημερολόγιο (εισαγωγή) · Calendar intro, file: src/content/pages/calendar.yml, format: yaml, i18n: true, fields: *shortFields }
      - { name: gallery, label: Γκαλερί (εισαγωγή) · Gallery intro, file: src/content/pages/gallery.yml, format: yaml, i18n: true, fields: *shortFields }
      - { name: stories, label: Ιστορίες (εισαγωγή) · Stories intro, file: src/content/pages/stories.yml, format: yaml, i18n: true, fields: *shortFields }

  # ───────────────────────── Extra pages ─────────────────────────
  - name: extra
    label: Νέες σελίδες · New pages
    label_singular: Σελίδα · Page
    description: Create your own pages (e.g. a festival, a partner, a project). Tick “Show in menu” to add them to the menu. The privacy page lives here too.
    icon: note_add
    folder: src/content/extra
    extension: yml
    format: yaml
    create: true
    i18n: true
    identifier_field: title
    slug:
      template: "{{slug}}"
      editable: [create]
    reorder: true
    fields:
      - *title
      - { name: inMenu, label: Στο μενού · Show in menu, widget: boolean, default: true, required: false }
      - *intro
      - *cover
      - *sections
      - *facts
      - *lists
      - *faq
      - { name: order, label: Σειρά · Order, widget: number, value_type: int, required: false }

  # ───────────────────────── Settings ─────────────────────────
  - name: settings
    label: Ρυθμίσεις · Settings
    description: Contact details, bank details, colours, links and every small text of the website.
    icon: settings
    i18n: true
    files:
      - name: site
        label: Στοιχεία & επικοινωνία · Site, contact & bank
        file: src/content/settings/site.yml
        format: yaml
        i18n: true
        fields:
          - { name: name, label: Όνομα · Name, widget: string }
          - { name: logo, label: Λογότυπο · Logo, widget: image, required: false }
          - { name: tagline, label: Σλόγκαν · Tagline, widget: string, i18n: true }
          - { name: description, label: Περιγραφή για Google · Google description, widget: text, i18n: true, hint: About 150 characters. }
          - { name: shareImage, label: "Φωτογραφία κοινοποίησης · Photo shown when the site is shared (Facebook, WhatsApp…)", widget: image, required: false }
          - { name: announcement, label: Ανακοίνωση · Top banner, widget: text, i18n: true, required: false, hint: "Optional message shown at the top of every page, e.g. “ESC call open until 30 March!”. Leave empty to hide." }
          - { name: email, label: Email, widget: string }
          - { name: phone, label: Τηλέφωνο · Phone, widget: string, hint: "With country code, e.g. +30 694 755 8519" }
          - { name: address, label: Διεύθυνση · Address, widget: string, i18n: true }
          - { name: lat, label: Χάρτης — γεωγρ. πλάτος · Map latitude, widget: number, value_type: float, required: false }
          - { name: lng, label: Χάρτης — γεωγρ. μήκος · Map longitude, widget: number, value_type: float, required: false }
          - { name: instagram, label: Instagram, widget: string, required: false }
          - { name: facebook, label: Facebook, widget: string, required: false }
          - { name: messenger, label: Messenger, widget: string, required: false }
          - name: otherContacts
            label: Άλλες επαφές · Other contacts (yoga studios, retreats…)
            widget: list
            i18n: true
            required: false
            summary: "{{label}}"
            fields:
              - { name: label, label: Τι είναι · What it is, widget: string, i18n: true }
              - { name: phone, label: Τηλέφωνο · Phone, widget: string, required: false }
              - { name: email, label: Email, widget: string, required: false }
              - { name: url, label: Ιστοσελίδα · Website, widget: string, required: false }
          - { name: yogaStudiosUrl, label: Ιστοσελίδα στούντιο γιόγκα · Yoga studios website, widget: string, required: false }
          - { name: yogaRetreatsUrl, label: Ιστοσελίδα ρητρίτ · Yoga retreats website, widget: string, required: false }
          - { name: yogaTrainingsUrl, label: Ιστοσελίδα εκπαιδεύσεων · Yoga trainings website, widget: string, required: false }
          - { name: taxId, label: ΑΦΜ · Tax ID, widget: string, required: false }
          - { name: iban, label: IBAN (δωρεές · donations), widget: string, required: false, hint: Shown on the Support page with a “Copy” button. Empty = no bank block. }
          - { name: bic, label: BIC / SWIFT, widget: string, required: false }
          - { name: accountHolder, label: Δικαιούχος · Account holder, widget: string, required: false }
          - { name: bank, label: Τράπεζα · Bank, widget: string, i18n: true, required: false }
          - { name: formKey, label: Κλειδί φόρμας · Contact form key (Web3Forms), widget: string, required: false, hint: "Free key from web3forms.com — messages then arrive by email. Empty = no form, just the email button." }
          - { name: apiUrl, label: Διεύθυνση API · Website API address (stories form & login), widget: string, required: false, hint: "The Cloudflare Worker address, e.g. https://evergreen-api.xxx.workers.dev — see worker/README.md. Empty = stories are sent by email." }
          - { name: turnstileKey, label: Κλειδί Turnstile · Anti-spam site key (optional), widget: string, required: false }
          - name: theme
            label: Χρώματα · Colours
            widget: object
            required: false
            collapsed: true
            fields:
              - { name: background, label: Φόντο · Background, widget: color, required: false }
              - { name: background2, label: Δεύτερο φόντο · Second background, widget: color, required: false }
              - { name: text, label: Κείμενο · Text, widget: color, required: false }
              - { name: green, label: Πράσινο · Green, widget: color, required: false }
              - { name: darkGreen, label: Σκούρο πράσινο · Dark green, widget: color, required: false }
              - { name: accent, label: Χρώμα έμφασης · Accent, widget: color, required: false }
      - name: ui
        label: Μικρά κείμενα · Interface texts (menu, buttons, labels)
        file: src/content/settings/ui.yml
        format: yaml
        i18n: true
        fields:
          - { name: skip, label: "Skip to content", widget: string, i18n: true }
          - { name: menu, label: "Menu", widget: string, i18n: true }
          - { name: close, label: "Close", widget: string, i18n: true }
          - { name: language, label: "Language", widget: string, i18n: true }
          - { name: nav_home, label: "Home", widget: string, i18n: true }
          - { name: nav_about, label: "The project", widget: string, i18n: true }
          - { name: nav_place, label: "The place", widget: string, i18n: true }
          - { name: nav_life, label: "Way of life", widget: string, i18n: true }
