# Videos uploaded from /admin land in public/uploads/videos.
# This re-encodes them for the web (H.264, max 1280 px wide, fast start) and commits the result.
name: Compress uploaded videos
on:
  push:
    branches: [main]
    paths: ['public/uploads/videos/**']
permissions:
  contents: write
  actions: write # to start the deploy: pushes made by this workflow don't trigger it
jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Re-encode videos not yet compressed
        run: |
          shopt -s nullglob nocaseglob
          for f in public/uploads/videos/*.{mp4,mov,m4v,webm}; do
            [ "$(ffprobe -v error -show_entries format_tags=comment -of csv=p=0 "$f")" = "evergreen-web" ] && continue
            out="${f%.*}.mp4"; tmp="$(mktemp --suffix .mp4)"
            ffmpeg -nostdin -y -i "$f" -vf "scale='min(1280,iw)':-2" -c:v libx264 -crf 27 -preset slow \
              -c:a aac -b:a 96k -movflags +faststart -metadata comment=evergreen-web "$tmp"
            rm "$f"; mv "$tmp" "$out"
            # keep the album entries pointing at the new file name (e.g. .mov → .mp4)
            sed -i "s#/uploads/videos/$(basename "$f")#/uploads/videos/$(basename "$out")#g" src/content/albums/*.yml
          done
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/uploads/videos src/content/albums
          if ! git diff --cached --quiet; then git commit -m "Compress uploaded videos" && git push && gh workflow run deploy.yml; fi
