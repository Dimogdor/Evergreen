# Builds the site and publishes it on GitHub Pages at every push to main.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Every night, so that finished events move to "Past events" by themselves.
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Photos already optimised by an earlier build are reused, so publishing stays quick as the gallery grows.
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-${{ github.sha }}
          restore-keys: astro-
      - run: npm run build
        env:
          # Own domain: set the repository variables SITE_URL (https://evergreenproject.gr) and BASE_PATH (/) — see README.
          SITE_URL: ${{ vars.SITE_URL || 'https://dimogdor.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/Evergreen' }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
