# Deploy: npx wrangler deploy   (from this folder, after `npm install` at the root — see README.md).
name = "evergreen-api"
main = "index.js"
compatibility_date = "2026-10-01"
# Own address for the worker once the domain is on Cloudflare (then "Website API address" = https://api.evergreenproject.gr):
# routes = [{ pattern = "api.evergreenproject.gr", custom_domain = true }]

# Nightly site rebuild (see "scheduled" in index.js).
[triggers]
crons = ["17 3 * * *"]

[vars]
REPO = "Dimogdor/Evergreen"
BRANCH = "main"
SITE_URL = "https://dimogdor.github.io/Evergreen"
ALLOWED_ORIGINS = "https://dimogdor.github.io"

# Max 3 stories per minute per visitor IP (free Workers rate-limiting binding).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

# E-mail notifications for new stories (once the site's domain is on Cloudflare with Email Routing on,
# and MAIL_TO verified there as a destination address). Uncomment and set:
# [[send_email]]
# name = "MAIL"
# [vars]  → add MAIL_FROM = "website@evergreenproject.gr", MAIL_TO = "evergreenecovillage@gmail.com"
