el:
  image: /src/assets/uploads/tent-sea-view.webp
  title: Ο τόπος
  intro: Ένα δάσος ακακιών στους πρόποδες του Καλλιδρόμου, ανάμεσα στο βουνό και τη θάλασσα.
  sections:
  - heading: Ένα δάσος για να ζεις
    image: /src/assets/uploads/tent-forest-2.webp
    text: |-
      Το Evergreen Project βρίσκεται σε μια δασωμένη έκταση κοντά στο χωριό Ανάβρα της Φθιώτιδας, στην Κεντρική Ελλάδα. Ακακίες, βελανιδιές και πεύκα σκιάζουν τις σκηνές, την κουζίνα και τη σάλα πρακτικής· μονοπάτια περνούν ανάμεσά τους και οι ήχοι του δάσους αλλάζουν κάθε ώρα της μέρας.

      Μακριά από τον θόρυβο και τη βιασύνη της πόλης, ο τόπος προσφέρει ένα απλό — καμιά φορά λιτό — περιβάλλον, ιδανικό για αυτομελέτη και για να επιβραδύνεις.
  - heading: Το Καλλίδρομο
    image: /src/assets/uploads/kallidromo-peak.webp
    text: |-
      Πάνω από εμάς υψώνεται το Καλλίδρομο, ένα βουνό με ελατοδάση, λιβάδια και οροπέδια όπου βόσκουν ελεύθερα άλογα και αγελάδες. Στο οροπέδιο βρίσκεται η λίμνη της Νευρόπολης, ένα ήσυχο μέρος για περιπάτους. Από τα ψηλότερα μονοπάτια η θέα ανοίγει προς τον Μαλιακό κόλπο και την Εύβοια.

      Λίγα χιλιόμετρα μακριά βρίσκονται οι ιστορικές Θερμοπύλες με τις ιαματικές πηγές τους, καθώς και τα παραθαλάσσια Καμένα Βούρλα και ο Άγιος Κωνσταντίνος.
  - heading: Εκτός δικτύου, με ήπιο τρόπο
    image: /src/assets/uploads/cob-house-rudi.webp
    text: |-
      Το ρεύμα μας έρχεται από τον ήλιο, οι τουαλέτες μας είναι ξηρές τουαλέτες κομποστοποίησης και το νερό το διαχειριζόμαστε με φροντίδα. Ακολουθούμε τη φιλοσοφία μηδενικών αποβλήτων, κομποστοποιούμε τα υπολείμματα της κουζίνας και χτίζουμε με φυσικά, τοπικά υλικά όπου μπορούμε.

      Οι εγκαταστάσεις είναι απλές και λιτές, στο πνεύμα της παραδοσιακής ζωής σε άσραμ. Δεν είναι πολυτέλεια: η άνεση εδώ έρχεται από την απλότητα, την κοινότητα και τη σύνδεση με τη φύση.
  - heading: Μέσα στις εποχές
    image: /src/assets/uploads/shala-snow.webp
    text: 'Από τον Μάιο έως τις αρχές Νοεμβρίου η ζωή μεταφέρεται έξω: στήνουμε μαζί τις σκηνές, εξασκούμαστε κάτω από τη στέγη της σάλας και τρώμε σε μεγάλα τραπέζια στη σκιά. Στις αρχές Νοεμβρίου μαζεύουμε τις σκηνές στη συνάντηση κλεισίματος της σεζόν και η κοινότητα μετακομίζει σε ένα ζεστό σπίτι με τζάκι στο χωριό της Ανάβρας, 15 λεπτά με τα πόδια. Τον χειμώνα το χιόνι σκεπάζει κάποιες φορές τη σάλα — η γη ξεκουράζεται, κι εμείς μαζί της, μέχρι να μας ξανακαλέσει η εαρινή ισημερία.'
  lists:
  - title: Στον χώρο
    items:
    - title: Σκηνές bell tent
      text: Μεγάλες υφασμάτινες σκηνές με άνετα στρώματα, που τις στήνουμε μαζί κάθε άνοιξη κάτω από τα δέντρα.
    - title: Το σπιτάκι του χορού
      text: Ένα μικρό ξύλινο σπίτι χτισμένο από πολλά χέρια — και πολλά πόδια που χόρευαν — για κίνηση, μουσική και ιστορίες.
    - title: Η αιωρούμενη εξέδρα
      text: Μια ξύλινη πλατφόρμα πάνω σε ζωντανά δέντρα, για γιόγκα και ξεκούραση ανάμεσα στα φύλλα.
    - title: Οι κότες
      text: Οι φτερωτές θεές μας, που μας χαρίζουν μικρά αλλά ολόφρεσκα αυγά.
    - title: Σπίτια από πηλό
      text: Μικρά σπίτια χτισμένα με πηλό και άχυρο (cob) και άλλα φυσικά υλικά, για τις πιο κρύες εποχές.
    - title: Η σάλα (shala)
      text: Μια στρογγυλή ξύλινη εξέδρα κάτω από ψηλή στέγη, ανοιχτή στο δάσος. Φιλοξενεί κάθε πρακτική — γιόγκα, διαλογισμό, κίνηση, κύκλους.
    - title: Υπαίθρια κουζίνα
      text: Μια πλήρως εξοπλισμένη κουζίνα χτισμένη με βιώσιμο τρόπο, όπου μαγειρεύουμε όλοι μαζί.
    - title: Τουαλέτες κομποστοποίησης
      text: Ξηρές τουαλέτες που μετατρέπουν τα απόβλητα σε γόνιμο χώμα.
    - title: Υπαίθρια ντους
      text: Ντους με ζεστό νερό κάτω από τα δέντρα.
    - title: Ήσυχες γωνιές
      text: Αιώρες και χώροι συγκέντρωσης για διάβασμα, μελέτη και ξεκούραση.
    - title: Ηλιακή ενέργεια & Wi-Fi
      text: Ρεύμα από τον ήλιο και Wi-Fi — αρκετό για να μένετε σε επαφή, όχι για να χαθείτε στις οθόνες.
  - title: Γύρω μας
    items:
    - title: Λίμνη Νευρόπολης
      text: Μια γαλήνια ορεινή λίμνη στο οροπέδιο του Καλλιδρόμου.
    - title: Μονοπάτια
      text: Δασικά μονοπάτια, λιβάδια και κορυφές ξεκινούν από την πόρτα μας.
    - title: Λιχαδονήσια
      text: Μια σύντομη βαρκάδα από τα Καμένα Βούρλα σε μικρά τιρκουάζ νησιά.
    - title: Θερμοπύλες
      text: Το θρυλικό πέρασμα και οι φυσικές θερμές πηγές του, λίγα χιλιόμετρα μακριά.
    - title: Μώλος & θάλασσα
      text: Ο κοντινός Μώλος έχει καταστήματα, καφέ και στάση λεωφορείου· η θάλασσα είναι λίγα λεπτά με το αυτοκίνητο.
en:
  title: The place
  intro: An acacia forest at the foot of Mount Kallidromo, between the mountain and the sea.
  sections:
  - heading: A forest to live in
    text: |-
      The Evergreen Project lives on a piece of forested land near the village of Anavra in Fthiotida, Central Greece. Acacias, oaks and pines shade our tents, our kitchen and our shala; paths wind between them, and the sounds of the forest change with every hour of the day.

      Away from the noise and hurry of the city, the land offers a simple — sometimes austere — environment, ideal for self-study and for slowing down.
    image: /src/assets/uploads/tent-forest-2.webp
  - heading: Mount Kallidromo
    text: |-
      Above us rises Mount Kallidromo, a mountain of fir forests, meadows and plateaus where horses and cows graze freely. On the plateau lies Lake Nevropolis, a peaceful place for walks. From the higher paths the view opens over the Malian Gulf and the island of Evia.

      Just a few kilometres away are historic Thermopylae and its hot springs, and the seaside towns of Kamena Vourla and Agios Konstantinos.
    image: /src/assets/uploads/kallidromo-peak.webp
  - heading: Off-grid, gently
    text: |-
      Our electricity comes from the sun, our toilets are dry compost toilets, and water is managed with care. We follow a zero-waste philosophy, compost our kitchen scraps and build with natural, local materials wherever we can.

      The facilities are simple and rustic, in the spirit of traditional ashram life. This is not luxury: here, comfort comes from simplicity, community and connection with nature.
    image: /src/assets/uploads/cob-house-rudi.webp
  - heading: Through the seasons
    text: 'From May to early November life moves outdoors: we pitch the bell tents together, practise under the shala roof and eat at long tables in the shade. In early November we take the tents down at our season-closing gathering, and the community moves to a cosy house with a fireplace in the village of Anavra, a 15-minute walk away. In winter snow sometimes covers the shala — the land rests, and so do we, until the spring equinox calls us back.'
    image: /src/assets/uploads/shala-snow.webp
  lists:
  - title: On the land
    items:
    - title: Bell tents
      text: Large canvas tents with comfortable mattresses, pitched together every spring under the trees.
    - title: The dance house
      text: A small wooden house built by many hands — and many dancing feet — for movement, music and stories.
    - title: The floating deck
      text: A wooden platform held by living trees, for yoga and rest among the leaves.
    - title: The hens
      text: Our feathery goddesses, who give us small but very fresh eggs.
    - title: Cob houses
      text: Small houses built with cob and natural materials, for the colder seasons.
    - title: The shala
      text: A round wooden deck under a high roof, open to the forest. It hosts every practice — yoga, meditation, movement, circles.
    - title: Outdoor kitchen
      text: A sustainably built, fully equipped kitchen where we cook together.
    - title: Compost toilets
      text: Dry toilets that turn waste into fertile soil.
    - title: Outdoor showers
      text: Warm-water showers under the trees.
    - title: Quiet corners
      text: Hammocks and concentration spaces for reading, study and rest.
    - title: Solar power & Wi-Fi
      text: Electricity from the sun and Wi-Fi — enough to stay in touch, not enough to get lost in screens.
  - title: Around us
    items:
    - title: Lake Nevropolis
      text: A serene mountain lake on the Kallidromo plateau.
    - title: Hiking trails
      text: Forest paths, meadows and peaks start right from our door.
    - title: Lichadonisia
      text: A short boat trip from Kamena Vourla to small turquoise islands.
    - title: Thermopylae
      text: The legendary pass and its natural hot springs, a few kilometres away.
    - title: Molos & the sea
      text: Nearby Molos has shops, cafés and a bus stop; the sea is a few minutes away by car.
  image: /src/assets/uploads/tent-sea-view.webp
fr:
  title: Le lieu
  intro: Une forêt d’acacias au pied du mont Kallidromo, entre la montagne et la mer.
  sections:
  - heading: Une forêt où vivre
    text: |-
      The Evergreen Project s’étend sur un terrain boisé près du village d’Anavra, en Phthiotide, en Grèce centrale. Acacias, chênes et pins ombragent nos tentes, notre cuisine et notre shala ; des sentiers serpentent entre eux et les sons de la forêt changent à chaque heure de la journée.

      Loin du bruit et de l’agitation de la ville, le lieu offre un environnement simple — parfois austère — idéal pour l’introspection et pour ralentir.
    image: /src/assets/uploads/tent-forest-2.webp
  - heading: Le mont Kallidromo
    text: |-
      Au-dessus de nous s’élève le mont Kallidromo, une montagne de forêts de sapins, de prairies et de plateaux où chevaux et vaches paissent en liberté. Sur le plateau se trouve le lac de Nevropolis, un endroit paisible pour se promener. Depuis les sentiers les plus hauts, la vue s’ouvre sur le golfe Maliaque et l’île d’Eubée.

      À quelques kilomètres se trouvent les Thermopyles historiques et leurs sources chaudes, ainsi que les villes balnéaires de Kamena Vourla et d’Agios Konstantinos.
    image: /src/assets/uploads/kallidromo-peak.webp
  - heading: Hors réseau, en douceur
    text: |-
      Notre électricité vient du soleil, nos toilettes sont des toilettes sèches à compost et l’eau est gérée avec soin. Nous suivons une philosophie zéro déchet, compostons les restes de cuisine et construisons avec des matériaux naturels et locaux dès que possible.

      Les installations sont simples et rustiques, dans l’esprit de la vie traditionnelle en ashram. Ce n’est pas un lieu de luxe : ici, le confort vient de la simplicité, de la communauté et du lien avec la nature.
    image: /src/assets/uploads/cob-house-rudi.webp
  - heading: Au fil des saisons
    text: 'De mai à début novembre, la vie se passe dehors : nous montons ensemble les tentes cloches, pratiquons sous le toit de la shala et mangeons à de longues tables à l’ombre. Début novembre, nous démontons les tentes lors du rassemblement de clôture, et la communauté s’installe dans une maison chaleureuse avec cheminée au village d’Anavra, à 15 minutes à pied. L’hiver, la neige recouvre parfois la shala — la terre se repose, et nous aussi, jusqu’à ce que l’équinoxe de printemps nous rappelle.'
    image: /src/assets/uploads/shala-snow.webp
  lists:
  - title: Sur le terrain
    items:
    - title: Tentes cloches
      text: De grandes tentes en toile avec de bons matelas, montées ensemble chaque printemps sous les arbres.
    - title: La maison de la danse
      text: Une petite maison en bois construite par beaucoup de mains — et de pieds dansants — pour le mouvement, la musique et les histoires.
    - title: La plateforme suspendue
      text: Une plateforme en bois portée par des arbres vivants, pour le yoga et le repos au milieu des feuilles.
    - title: Les poules
      text: Nos déesses à plumes, qui nous offrent des œufs petits mais très frais.
    - title: Maisons en bauge
      text: Petites maisons construites en bauge (cob) et en matériaux naturels, pour les saisons plus froides.
    - title: La shala
      text: Une plateforme ronde en bois sous un grand toit, ouverte sur la forêt. Elle accueille toutes les pratiques — yoga, méditation, mouvement, cercles.
    - title: Cuisine en plein air
      text: Une cuisine entièrement équipée, construite de manière durable, où nous cuisinons ensemble.
    - title: Toilettes sèches
      text: Des toilettes sèches qui transforment les déchets en terre fertile.
    - title: Douches extérieures
      text: Des douches à eau chaude sous les arbres.
    - title: Coins calmes
      text: Hamacs et espaces de concentration pour lire, étudier et se reposer.
    - title: Énergie solaire & Wi-Fi
      text: De l’électricité solaire et du Wi-Fi — assez pour garder le contact, pas assez pour se perdre dans les écrans.
  - title: Autour de nous
    items:
    - title: Lac de Nevropolis
      text: Un paisible lac de montagne sur le plateau du Kallidromo.
    - title: Sentiers de randonnée
      text: Chemins forestiers, prairies et sommets partent de notre porte.
    - title: Lichadonisia
      text: Une courte sortie en bateau depuis Kamena Vourla vers de petites îles turquoise.
    - title: Les Thermopyles
      text: Le défilé légendaire et ses sources chaudes naturelles, à quelques kilomètres.
    - title: Molos & la mer
      text: Le bourg voisin de Molos a des commerces, des cafés et un arrêt de bus ; la mer est à quelques minutes en voiture.
  image: /src/assets/uploads/tent-sea-view.webp
es:
  title: El lugar
  intro: Un bosque de acacias al pie del monte Kallidromo, entre la montaña y el mar.
  sections:
  - heading: Un bosque para vivir
    text: |-
      The Evergreen Project ocupa un terreno boscoso cerca del pueblo de Anavra, en Ftiótide, Grecia central. Acacias, robles y pinos dan sombra a nuestras tiendas, a la cocina y a la shala; los senderos serpentean entre ellos y los sonidos del bosque cambian a cada hora del día.

      Lejos del ruido y las prisas de la ciudad, el lugar ofrece un entorno sencillo — a veces austero —, ideal para el autoconocimiento y para bajar el ritmo.
    image: /src/assets/uploads/tent-forest-2.webp
  - heading: El monte Kallidromo
    text: |-
      Sobre nosotros se alza el monte Kallidromo, una montaña de bosques de abetos, praderas y mesetas donde caballos y vacas pastan en libertad. En la meseta está el lago Nevropolis, un lugar tranquilo para pasear. Desde los senderos más altos, la vista se abre sobre el golfo Maliaco y la isla de Eubea.

      A pocos kilómetros están las históricas Termópilas con sus aguas termales, y las localidades costeras de Kamena Vourla y Agios Konstantinos.
    image: /src/assets/uploads/kallidromo-peak.webp
  - heading: Fuera de la red, con suavidad
    text: |-
      Nuestra electricidad viene del sol, nuestros baños son secos de compostaje y el agua se gestiona con cuidado. Seguimos una filosofía de residuo cero, compostamos los restos de la cocina y construimos con materiales naturales y locales siempre que podemos.

      Las instalaciones son sencillas y rústicas, en el espíritu de la vida tradicional de un ashram. No es un lugar de lujo: aquí la comodidad nace de la sencillez, la comunidad y la conexión con la naturaleza.
    image: /src/assets/uploads/cob-house-rudi.webp
  - heading: Al ritmo de las estaciones
    text: 'De mayo a principios de noviembre la vida se traslada al exterior: montamos juntos las tiendas campana, practicamos bajo el techo de la shala y comemos en mesas largas a la sombra. A principios de noviembre desmontamos las tiendas en el encuentro de cierre y la comunidad se muda a una casa acogedora con chimenea en el pueblo de Anavra, a 15 minutos a pie. En invierno la nieve cubre a veces la shala — la tierra descansa, y nosotros también, hasta que el equinoccio de primavera nos vuelve a llamar.'
    image: /src/assets/uploads/shala-snow.webp
  lists:
  - title: En el terreno
    items:
    - title: Tiendas campana
      text: Grandes tiendas de lona con colchones cómodos, que montamos juntos cada primavera bajo los árboles.
    - title: La casa del baile
      text: Una casita de madera construida por muchas manos — y muchos pies bailando — para el movimiento, la música y las historias.
    - title: La plataforma flotante
      text: Una plataforma de madera sostenida por árboles vivos, para yoga y descanso entre las hojas.
    - title: Las gallinas
      text: Nuestras diosas emplumadas, que nos regalan huevos pequeños pero fresquísimos.
    - title: Casas de cob
      text: Pequeñas casas construidas con cob y materiales naturales, para las estaciones más frías.
    - title: La shala
      text: Una plataforma redonda de madera bajo un techo alto, abierta al bosque. Acoge todas las prácticas — yoga, meditación, movimiento, círculos.
    - title: Cocina al aire libre
      text: Una cocina totalmente equipada y construida de forma sostenible, donde cocinamos juntos.
    - title: Baños secos
      text: Baños secos que convierten los residuos en tierra fértil.
    - title: Duchas exteriores
      text: Duchas de agua caliente bajo los árboles.
    - title: Rincones tranquilos
      text: Hamacas y espacios de concentración para leer, estudiar y descansar.
    - title: Energía solar y wifi
      text: Electricidad del sol y wifi — suficiente para estar en contacto, no tanto como para perderse en las pantallas.
  - title: A nuestro alrededor
    items:
    - title: Lago Nevropolis
      text: Un sereno lago de montaña en la meseta del Kallidromo.
    - title: Senderos
      text: Caminos forestales, praderas y cumbres empiezan en nuestra puerta.
    - title: Lichadonisia
      text: Una breve excursión en barco desde Kamena Vourla a pequeñas islas turquesa.
    - title: Termópilas
      text: El legendario paso y sus aguas termales naturales, a pocos kilómetros.
    - title: Molos y el mar
      text: El cercano pueblo de Molos tiene tiendas, cafés y parada de autobús; el mar está a pocos minutos en coche.
  image: /src/assets/uploads/tent-sea-view.webp
it:
  title: Il luogo
  intro: Un bosco di acacie ai piedi del monte Kallidromo, tra la montagna e il mare.
  sections:
  - heading: Un bosco in cui vivere
    text: |-
      The Evergreen Project si estende su un terreno boscoso vicino al villaggio di Anavra, in Ftiotide, nella Grecia centrale. Acacie, querce e pini fanno ombra alle nostre tende, alla cucina e alla shala; i sentieri si snodano tra gli alberi e i suoni del bosco cambiano a ogni ora del giorno.

      Lontano dal rumore e dalla fretta della città, il luogo offre un ambiente semplice — a volte essenziale — ideale per l’introspezione e per rallentare.
    image: /src/assets/uploads/tent-forest-2.webp
  - heading: Il monte Kallidromo
    text: |-
      Sopra di noi si innalza il monte Kallidromo, una montagna di foreste di abeti, prati e altopiani dove cavalli e mucche pascolano liberi. Sull’altopiano si trova il lago di Nevropolis, un posto tranquillo per passeggiare. Dai sentieri più alti la vista si apre sul golfo Maliaco e sull’isola di Eubea.

      A pochi chilometri ci sono le storiche Termopili con le loro sorgenti termali e le località di mare di Kamena Vourla e Agios Konstantinos.
    image: /src/assets/uploads/kallidromo-peak.webp
  - heading: Fuori rete, con delicatezza
    text: |-
      La nostra elettricità viene dal sole, i nostri bagni sono compost toilet a secco e l’acqua è gestita con cura. Seguiamo una filosofia rifiuti zero, compostiamo gli scarti della cucina e costruiamo con materiali naturali e locali ogni volta che possiamo.

      Le strutture sono semplici e rustiche, nello spirito della vita tradizionale in ashram. Non è un luogo di lusso: qui il comfort nasce dalla semplicità, dalla comunità e dal legame con la natura.
    image: /src/assets/uploads/cob-house-rudi.webp
  - heading: Lungo le stagioni
    text: 'Da maggio all’inizio di novembre la vita si sposta all’aperto: montiamo insieme le tende a campana, pratichiamo sotto il tetto della shala e mangiamo a lunghe tavolate all’ombra. A inizio novembre smontiamo le tende durante l’incontro di chiusura e la comunità si trasferisce in una casa accogliente con camino nel villaggio di Anavra, a 15 minuti a piedi. D’inverno la neve a volte ricopre la shala — la terra riposa, e noi con lei, finché l’equinozio di primavera non ci richiama.'
    image: /src/assets/uploads/shala-snow.webp
  lists:
  - title: Sul terreno
    items:
    - title: Tende a campana
      text: Grandi tende di tela con materassi comodi, montate insieme ogni primavera sotto gli alberi.
    - title: La casa della danza
      text: Una casetta di legno costruita da tante mani — e tanti piedi danzanti — per movimento, musica e storie.
    - title: La piattaforma sospesa
      text: Una piattaforma in legno sorretta da alberi vivi, per yoga e riposo tra le foglie.
    - title: Le galline
      text: Le nostre dee piumate, che ci regalano uova piccole ma freschissime.
    - title: Case in cob
      text: Piccole case costruite in cob e materiali naturali, per le stagioni più fredde.
    - title: La shala
      text: Una piattaforma rotonda in legno sotto un alto tetto, aperta sul bosco. Ospita ogni pratica — yoga, meditazione, movimento, cerchi.
    - title: Cucina all’aperto
      text: Una cucina completamente attrezzata e costruita in modo sostenibile, dove cuciniamo insieme.
    - title: Compost toilet
      text: Bagni a secco che trasformano i rifiuti in terra fertile.
    - title: Docce all’aperto
      text: Docce con acqua calda sotto gli alberi.
    - title: Angoli tranquilli
      text: Amache e spazi di concentrazione per leggere, studiare e riposare.
    - title: Energia solare e Wi-Fi
      text: Elettricità dal sole e Wi-Fi — abbastanza per restare in contatto, non abbastanza per perdersi negli schermi.
  - title: Intorno a noi
    items:
    - title: Lago di Nevropolis
      text: Un sereno lago di montagna sull’altopiano del Kallidromo.
    - title: Sentieri
      text: Sentieri nel bosco, prati e vette partono dalla nostra porta.
    - title: Lichadonisia
      text: Una breve gita in barca da Kamena Vourla verso piccole isole turchesi.
    - title: Termopili
      text: Il leggendario passo e le sue sorgenti termali naturali, a pochi chilometri.
    - title: Molos e il mare
      text: La vicina Molos ha negozi, caffè e una fermata dell’autobus; il mare è a pochi minuti in auto.
  image: /src/assets/uploads/tent-sea-view.webp
ru:
  title: Место
  intro: Акациевый лес у подножия горы Каллидромо, между горами и морем.
  sections:
  - heading: Лес, в котором живут
    text: |-
      The Evergreen Project расположен на лесном участке рядом с деревней Анавра во Фтиотиде, в Центральной Греции. Акации, дубы и сосны дают тень нашим шатрам, кухне и шале; между ними вьются тропинки, а звуки леса меняются каждый час.

      Вдали от шума и спешки города это место предлагает простую — порой аскетичную — среду, идеальную для самопознания и замедления.
    image: /src/assets/uploads/tent-forest-2.webp
  - heading: Гора Каллидромо
    text: |-
      Над нами возвышается гора Каллидромо — пихтовые леса, луга и плато, где свободно пасутся лошади и коровы. На плато лежит озеро Неврополис, тихое место для прогулок. С верхних троп открывается вид на Малийский залив и остров Эвбея.

      В нескольких километрах — исторические Фермопилы с горячими источниками и приморские городки Камена-Вурла и Агиос-Константинос.
    image: /src/assets/uploads/kallidromo-peak.webp
  - heading: Автономно и бережно
    text: |-
      Электричество нам дарит солнце, туалеты у нас сухие компостные, а воду мы расходуем бережно. Мы следуем философии «ноль отходов», компостируем кухонные остатки и, где только можем, строим из природных местных материалов.

      Условия простые и деревенские, в духе традиционной жизни в ашраме. Это не роскошь: комфорт здесь рождается из простоты, общности и связи с природой.
    image: /src/assets/uploads/cob-house-rudi.webp
  - heading: Сквозь времена года
    text: 'С мая до начала ноября жизнь переходит под открытое небо: мы вместе ставим шатры, практикуем под крышей шалы и едим за длинными столами в тени. В начале ноября на встрече закрытия сезона мы снимаем шатры, и сообщество переезжает в уютный дом с камином в деревне Анавра, в 15 минутах ходьбы. Зимой снег порой укрывает шалу — земля отдыхает, и мы вместе с ней, пока весеннее равноденствие не позовёт нас обратно.'
    image: /src/assets/uploads/shala-snow.webp
  lists:
  - title: На участке
    items:
    - title: Шатры-колокола
      text: Большие брезентовые шатры с удобными матрасами — каждую весну мы ставим их вместе под деревьями.
    - title: Дом для танцев
      text: Маленький деревянный дом, построенный многими руками — и танцующими ногами — для движения, музыки и историй.
    - title: Парящий настил
      text: Деревянная платформа на живых деревьях — для йоги и отдыха среди листвы.
    - title: Куры
      text: Наши пернатые богини, которые дарят нам маленькие, но очень свежие яйца.
    - title: Глинобитные дома
      text: Небольшие дома из глины (cob) и природных материалов для холодного времени года.
    - title: Шала
      text: Круглый деревянный настил под высокой крышей, открытый лесу. Здесь проходят все практики — йога, медитация, движение, круги.
    - title: Летняя кухня
      text: Полностью оборудованная кухня, построенная экологично, где мы готовим вместе.
    - title: Компостные туалеты
      text: Сухие туалеты, превращающие отходы в плодородную почву.
    - title: Уличный душ
      text: Душ с горячей водой под деревьями.
    - title: Тихие уголки
      text: Гамаки и пространства для чтения, учёбы и отдыха.
    - title: Солнечная энергия и Wi-Fi
      text: Электричество от солнца и Wi-Fi — достаточно, чтобы оставаться на связи, но не чтобы потеряться в экранах.
  - title: Вокруг нас
    items:
    - title: Озеро Неврополис
      text: Безмятежное горное озеро на плато Каллидромо.
    - title: Тропы
      text: Лесные тропинки, луга и вершины начинаются прямо у нашей двери.
    - title: Лихадонисия
      text: Короткая морская прогулка из Камена-Вурла к маленьким бирюзовым островам.
    - title: Фермопилы
      text: Легендарный проход и его природные горячие источники в нескольких километрах.
    - title: Молос и море
      text: В соседнем Молосе есть магазины, кафе и автобусная остановка; до моря — несколько минут на машине.
  image: /src/assets/uploads/tent-sea-view.webp
de:
  title: Der Ort
  intro: Ein Akazienwald am Fuß des Kallidromo-Gebirges, zwischen Bergen und Meer.
  sections:
  - heading: Ein Wald zum Leben
    text: |-
      The Evergreen Project liegt auf einem bewaldeten Stück Land nahe dem Dorf Anavra in Fthiotida, Mittelgriechenland. Akazien, Eichen und Kiefern spenden unseren Zelten, der Küche und der Shala Schatten; Wege schlängeln sich dazwischen, und die Geräusche des Waldes ändern sich mit jeder Stunde des Tages.

      Fern vom Lärm und der Hektik der Stadt bietet der Ort eine einfache — manchmal karge — Umgebung, ideal zur Selbsterforschung und zum Langsamerwerden.
    image: /src/assets/uploads/tent-forest-2.webp
  - heading: Das Kallidromo-Gebirge
    text: |-
      Über uns erhebt sich das Kallidromo-Gebirge mit Tannenwäldern, Wiesen und Hochebenen, auf denen Pferde und Kühe frei weiden. Auf der Hochebene liegt der Nevropolis-See, ein friedlicher Ort für Spaziergänge. Von den höheren Pfaden öffnet sich der Blick über den Malischen Golf und die Insel Euböa.

      Nur wenige Kilometer entfernt liegen das historische Thermopylen mit seinen heißen Quellen und die Küstenorte Kamena Vourla und Agios Konstantinos.
    image: /src/assets/uploads/kallidromo-peak.webp
  - heading: Netzunabhängig, mit leichter Hand
    text: |-
      Unser Strom kommt von der Sonne, unsere Toiletten sind Trockentrenntoiletten mit Kompost, und mit Wasser gehen wir sorgsam um. Wir folgen einer Zero-Waste-Philosophie, kompostieren Küchenreste und bauen, wo immer möglich, mit natürlichen, lokalen Materialien.

      Die Einrichtungen sind einfach und rustikal, im Geist des traditionellen Ashram-Lebens. Das ist kein Luxus: Komfort entsteht hier aus Einfachheit, Gemeinschaft und Verbundenheit mit der Natur.
    image: /src/assets/uploads/cob-house-rudi.webp
  - heading: Im Lauf der Jahreszeiten
    text: 'Von Mai bis Anfang November findet das Leben draußen statt: Wir bauen gemeinsam die Glockenzelte auf, praktizieren unter dem Dach der Shala und essen an langen Tischen im Schatten. Anfang November bauen wir beim Saisonabschluss die Zelte ab, und die Gemeinschaft zieht in ein gemütliches Haus mit Kamin im Dorf Anavra, 15 Gehminuten entfernt. Im Winter bedeckt manchmal Schnee die Shala — das Land ruht, und wir mit ihm, bis uns die Frühlings-Tagundnachtgleiche zurückruft.'
    image: /src/assets/uploads/shala-snow.webp
  lists:
  - title: Auf dem Gelände
    items:
    - title: Glockenzelte
      text: Große Leinenzelte mit bequemen Matratzen, die wir jeden Frühling gemeinsam unter den Bäumen aufbauen.
    - title: Das Tanzhaus
      text: Ein kleines Holzhaus, gebaut von vielen Händen — und tanzenden Füßen — für Bewegung, Musik und Geschichten.
    - title: Das schwebende Deck
      text: Eine Holzplattform, getragen von lebenden Bäumen, für Yoga und Ruhe zwischen den Blättern.
    - title: Die Hühner
      text: Unsere gefiederten Göttinnen, die uns kleine, aber ganz frische Eier schenken.
    - title: Lehmhäuser
      text: Kleine Häuser aus Strohlehm (Cob) und natürlichen Materialien für die kälteren Jahreszeiten.
    - title: Die Shala
      text: Eine runde Holzplattform unter einem hohen Dach, offen zum Wald. Hier finden alle Praktiken statt — Yoga, Meditation, Bewegung, Kreise.
    - title: Outdoor-Küche
      text: Eine nachhaltig gebaute, voll ausgestattete Küche, in der wir gemeinsam kochen.
    - title: Komposttoiletten
      text: Trockentoiletten, die Abfall in fruchtbare Erde verwandeln.
    - title: Außenduschen
      text: Warmwasserduschen unter den Bäumen.
    - title: Ruhige Ecken
      text: Hängematten und Rückzugsräume zum Lesen, Lernen und Ausruhen.
    - title: Solarstrom & WLAN
      text: Strom von der Sonne und WLAN — genug, um in Kontakt zu bleiben, zu wenig, um sich in Bildschirmen zu verlieren.
  - title: Rund um uns
    items:
    - title: Nevropolis-See
      text: Ein stiller Bergsee auf der Hochebene des Kallidromo.
    - title: Wanderwege
      text: Waldpfade, Wiesen und Gipfel beginnen direkt vor unserer Tür.
    - title: Lichadonisia
      text: Ein kurzer Bootsausflug von Kamena Vourla zu kleinen türkisfarbenen Inseln.
    - title: Thermopylen
      text: Der legendäre Pass und seine natürlichen heißen Quellen, wenige Kilometer entfernt.
    - title: Molos & das Meer
      text: Im nahen Molos gibt es Läden, Cafés und eine Bushaltestelle; das Meer ist mit dem Auto in wenigen Minuten erreicht.
  image: /src/assets/uploads/tent-sea-view.webp
pt:
  title: O lugar
  intro: Uma floresta de acácias no sopé do monte Kallidromo, entre a montanha e o mar.
  sections:
  - heading: Uma floresta para viver
    text: |-
      The Evergreen Project ocupa um terreno florestal perto da aldeia de Anavra, na Ftiótida, Grécia Central. Acácias, carvalhos e pinheiros dão sombra às nossas tendas, à cozinha e à shala; os caminhos serpenteiam entre eles e os sons da floresta mudam a cada hora do dia.

      Longe do ruído e da pressa da cidade, o lugar oferece um ambiente simples — por vezes austero — ideal para o autoconhecimento e para abrandar.
    image: /src/assets/uploads/tent-forest-2.webp
  - heading: O monte Kallidromo
    text: |-
      Acima de nós ergue-se o monte Kallidromo, uma montanha de florestas de abetos, prados e planaltos onde cavalos e vacas pastam em liberdade. No planalto fica o lago Nevropolis, um lugar tranquilo para passear. Dos caminhos mais altos, a vista abre-se sobre o golfo Maliaco e a ilha de Eubeia.

      A poucos quilómetros ficam as históricas Termópilas com as suas termas, e as vilas costeiras de Kamena Vourla e Agios Konstantinos.
    image: /src/assets/uploads/kallidromo-peak.webp
  - heading: Fora da rede, com suavidade
    text: |-
      A nossa eletricidade vem do sol, as nossas casas de banho são secas, de compostagem, e a água é gerida com cuidado. Seguimos uma filosofia de desperdício zero, compostamos os restos da cozinha e construímos com materiais naturais e locais sempre que possível.

      As instalações são simples e rústicas, no espírito da vida tradicional de um ashram. Não é um lugar de luxo: aqui o conforto vem da simplicidade, da comunidade e da ligação à natureza.
    image: /src/assets/uploads/cob-house-rudi.webp
  - heading: Ao ritmo das estações
    text: 'De maio ao início de novembro a vida passa-se lá fora: montamos juntos as tendas sino, praticamos sob o telhado da shala e comemos em mesas compridas à sombra. No início de novembro desmontamos as tendas no encontro de encerramento e a comunidade muda-se para uma casa acolhedora com lareira na aldeia de Anavra, a 15 minutos a pé. No inverno a neve cobre por vezes a shala — a terra descansa, e nós também, até o equinócio da primavera nos chamar de volta.'
    image: /src/assets/uploads/shala-snow.webp
  lists:
  - title: No terreno
    items:
    - title: Tendas sino
      text: Grandes tendas de lona com colchões confortáveis, montadas em conjunto todas as primaveras debaixo das árvores.
    - title: A casa da dança
      text: Uma casinha de madeira construída por muitas mãos — e muitos pés a dançar — para movimento, música e histórias.
    - title: A plataforma suspensa
      text: Uma plataforma de madeira sustentada por árvores vivas, para yoga e descanso entre as folhas.
    - title: As galinhas
      text: As nossas deusas de penas, que nos dão ovos pequenos mas fresquíssimos.
    - title: Casas de cob
      text: Pequenas casas construídas com cob e materiais naturais, para as estações mais frias.
    - title: A shala
      text: Uma plataforma redonda de madeira sob um telhado alto, aberta para a floresta. Acolhe todas as práticas — yoga, meditação, movimento, círculos.
    - title: Cozinha ao ar livre
      text: Uma cozinha totalmente equipada e construída de forma sustentável, onde cozinhamos juntos.
    - title: Casas de banho secas
      text: Casas de banho secas que transformam resíduos em terra fértil.
    - title: Duches exteriores
      text: Duches de água quente debaixo das árvores.
    - title: Recantos tranquilos
      text: Redes e espaços de concentração para ler, estudar e descansar.
    - title: Energia solar e Wi-Fi
      text: Eletricidade do sol e Wi-Fi — o suficiente para manter o contacto, não para se perder nos ecrãs.
  - title: À nossa volta
    items:
    - title: Lago Nevropolis
      text: Um sereno lago de montanha no planalto do Kallidromo.
    - title: Trilhos
      text: Caminhos florestais, prados e cumes começam à nossa porta.
    - title: Lichadonisia
      text: Um curto passeio de barco desde Kamena Vourla até pequenas ilhas turquesa.
    - title: Termópilas
      text: O lendário desfiladeiro e as suas termas naturais, a poucos quilómetros.
    - title: Molos e o mar
      text: A vizinha Molos tem lojas, cafés e paragem de autocarro; o mar fica a poucos minutos de carro.
  image: /src/assets/uploads/tent-sea-view.webp
