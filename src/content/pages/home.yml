de:
  title: Wir bringen Stadtmenschen in die Natur — und die Natur zu den Stadtmenschen.
  subtitle: Lebe, lerne und praktiziere mit uns in einem Akazienwald am Fuß des Kallidromo-Gebirges — als Freiwillige·r, Gast oder Retreat-Teilnehmer·in.
  manifesto: Wir sind ein Projekt für ganzheitliches Leben und Wandel. Unser Anliegen ist es, Menschen zu heilen und zu stärken — ohne jede Diskriminierung — durch Wohlbefinden, Natur und ökologisches Leben.
  intro: The Evergreen Project entstand 2020 als gemeinsame Initiative von Freund·innen, Lehrenden und Schüler·innen der Evergreen Yoga Studios und wurde Anfang 2021 eine gemeinnützige Zivilgesellschaft. Auf einem Stück Land am Fuß des Kallidromo, wenige Gehminuten vom Dorf Anavra entfernt, bauen Menschen aus Griechenland und ganz Europa Lebensmittel an, bauen mit natürlichen Materialien, praktizieren Yoga und lernen, einfacher — und fröhlicher — miteinander und mit der Erde zu leben.
  facts:
  - value: '2021'
    label: Gemeinnützig seit
  - value: ESK
    label: Qualitätssiegel bis 2027
  - value: 18 €
    label: pro Tag für einen Aufenthalt
  - value: 2 Std.
    label: von Athen
  escTitle: Freiwilligendienst im Europäischen Solidaritätskorps
  escText: Wir sind eine akkreditierte Aufnahmeorganisation des Europäischen Solidaritätskorps (ESK). Junge Menschen zwischen 18 und 30 kommen für einige Wochen oder mehrere Monate zu uns, um zu bauen, anzubauen, zu lernen und in Gemeinschaft zu leben — Verpflegung, Unterkunft, Reise und Taschengeld übernimmt das Programm.
  yogaTitle: Evergreen Yoga Studios, unsere Wurzeln in Athen
  yogaText: The Evergreen Project ist aus der Gemeinschaft der Evergreen Yoga Studios entstanden, die Panos Katsandris 2012 in Athen gegründet hat. Tägliche Kurse, Lehrerausbildungen und Workshops finden in den beiden Athener Studios (Exarchia und Nea Ionia) statt, Evergreen Yoga Retreats veranstaltet Retreats in ganz Griechenland — und der Ashram im Wald ist der Ort, an dem die Praxis der Natur begegnet. Stundenplan, Preise und Buchungen findest du auf ihren eigenen Websites.
  contactTitle: Komm uns besuchen — der Wald wartet auf dich.
  imageAlt: Schlussentspannung in der Shala des Evergreen Project
  yogaKicker: Yoga in der Stadt
  yogaImage: /src/assets/uploads/shala-roof.webp
  escImage: /src/assets/uploads/winter-shala-posts-2026.webp
  image: /src/assets/uploads/shala-savasana-wide.webp
pt:
  title: Levar as pessoas da cidade à natureza — e a natureza às pessoas da cidade.
  subtitle: Viva, aprenda e pratique connosco numa floresta de acácias no sopé do monte Kallidromo — como voluntário, hóspede ou participante de um retiro.
  manifesto: Somos um projeto de vida holística e de transição. O nosso trabalho é curar e capacitar as pessoas — sem qualquer discriminação — através do bem-estar, da natureza e da vida ecológica.
  intro: The Evergreen Project nasceu em 2020 como iniciativa coletiva de amigos, professores e alunos dos Evergreen Yoga Studios e tornou-se uma sociedade civil sem fins lucrativos no início de 2021. Num terreno no sopé do monte Kallidromo, a poucos minutos a pé da aldeia de Anavra, pessoas da Grécia e de toda a Europa cultivam, constroem com materiais naturais, praticam yoga e aprendem a viver de forma mais simples — e mais alegre — umas com as outras e com a Terra.
  facts:
  - value: '2021'
    label: Sem fins lucrativos desde
