  title: Φέρνουμε τους ανθρώπους της πόλης στη φύση — και τη φύση στους ανθρώπους της πόλης.
  subtitle: Ζήστε, μάθετε και εξασκηθείτε μαζί μας σε ένα δάσος ακακιών στους πρόποδες του Καλλιδρόμου — ως εθελοντές, φιλοξενούμενοι ή συμμετέχοντες σε ρητρίτ.
  manifesto: Είμαστε ένα πρότζεκτ ολιστικής διαβίωσης και μετάβασης. Στόχος μας είναι να θεραπεύουμε και να ενδυναμώνουμε τους ανθρώπους — χωρίς καμία διάκριση — μέσα από την ευεξία, τη φύση και την οικολογική ζωή.
  intro: Το Evergreen Project γεννήθηκε το 2020 ως συλλογική πρωτοβουλία φίλων, δασκάλων και μαθητών των Evergreen Yoga Studios και έγινε αστική μη κερδοσκοπική εταιρεία στις αρχές του 2021. Σε μια έκταση στους πρόποδες του Καλλιδρόμου, λίγα λεπτά με τα πόδια από το χωριό Ανάβρα, άνθρωποι από την Ελλάδα και όλη την Ευρώπη καλλιεργούν, χτίζουν με φυσικά υλικά, κάνουν γιόγκα και μαθαίνουν να ζουν πιο απλά — και πιο χαρούμενα — μεταξύ τους και με τη Γη.
  facts:
  - value: '2021'
    label: Μη κερδοσκοπική εταιρεία από το
  - value: ESC
    label: Σήμα Ποιότητας έως το 2027
  - value: 18 €
    label: την ημέρα για να μείνετε μαζί μας
  - value: 2 ώρες
    label: από την Αθήνα
  escTitle: Εθελοντισμός με το Ευρωπαϊκό Σώμα Αλληλεγγύης
  escText: Είμαστε διαπιστευμένος φορέας υποδοχής του Ευρωπαϊκού Σώματος Αλληλεγγύης (ESC). Νέοι και νέες 18–30 ετών έρχονται για λίγες εβδομάδες ή για αρκετούς μήνες για να χτίσουν, να καλλιεργήσουν, να μάθουν και να ζήσουν σε κοινότητα — με διατροφή, διαμονή, ταξίδι και χαρτζιλίκι καλυμμένα από το πρόγραμμα.
  yogaTitle: Evergreen Yoga Studios, οι ρίζες μας στην Αθήνα
  yogaText: Το Evergreen Project γεννήθηκε μέσα από την κοινότητα των Evergreen Yoga Studios, που ίδρυσε ο Panos Katsandris στην Αθήνα το 2012. Τα καθημερινά μαθήματα, οι εκπαιδεύσεις δασκάλων και τα σεμινάρια γίνονται στα δύο στούντιο της Αθήνας (Εξάρχεια και Νέα Ιωνία), ενώ τα Evergreen Yoga Retreats οργανώνουν ρητρίτ σε όλη την Ελλάδα — το άσραμ στο δάσος είναι εκεί όπου η πρακτική συναντά τη φύση. Προγράμματα, τιμές και κρατήσεις θα βρείτε στις δικές τους ιστοσελίδες.
  contactTitle: Ελάτε να μας γνωρίσετε — το δάσος σας περιμένει.
  imageAlt: Χαλάρωση στο τέλος της πρακτικής, στη σάλα του Evergreen Project
  yogaKicker: Γιόγκα στην πόλη
en:
  title: Bringing city people into nature — and nature to city people.
  subtitle: Live, learn and practise with us in an acacia forest at the foot of Mount Kallidromo — as a volunteer, a guest or a retreat participant.
  manifesto: We are a holistic living and transition project. Our work is to heal and empower people — without any discrimination — through wellbeing, nature and eco-living.
  intro: The Evergreen Project was born in 2020 as a collective initiative of friends, teachers and students of Evergreen Yoga Studios, and became a civil non-profit company in early 2021. On a piece of land at the foot of Mount Kallidromo, a short walk from the village of Anavra, people from Greece and all over Europe grow food, build with natural materials, practise yoga and learn to live more simply — and more joyfully — with each other and with the Earth.
  facts:
  - value: '2021'
    label: Non-profit company since
  - value: ESC
    label: Quality Label until 2027
  - value: €18
    label: a day to stay with us
  - value: 2 h
    label: from Athens
  escTitle: Volunteer with the European Solidarity Corps
  escText: We are an accredited host organisation of the European Solidarity Corps (ESC). Young people aged 18–30 join us for a few weeks or several months to build, grow, learn and live in community — with food, accommodation, travel and pocket money covered by the programme.
  yogaTitle: Evergreen Yoga Studios, our roots in Athens
  yogaText: The Evergreen Project was born from the community of Evergreen Yoga Studios, founded in Athens in 2012 by Panos Katsandris. Daily classes, teacher trainings and workshops take place in the two Athens studios (Exarchia and Nea Ionia), and Evergreen Yoga Retreats runs retreats all over Greece — the ashram in the forest is where the practice meets nature. Schedules, prices and bookings are on their own websites.
  contactTitle: Come and meet us — the forest is waiting.
  imageAlt: Final relaxation in the shala of the Evergreen Project
  yogaKicker: Yoga in the city
  yogaImage: /src/assets/uploads/shala-roof.webp
  escImage: /src/assets/uploads/winter-shala-posts-2026.webp
  image: /src/assets/uploads/shala-savasana-wide.webp
fr:
  title: Amener les citadins vers la nature — et la nature vers les citadins.
  subtitle: Vivez, apprenez et pratiquez avec nous dans une forêt d’acacias au pied du mont Kallidromo — comme volontaire, invité ou participant à une retraite.
  manifesto: Nous sommes un projet de vie holistique et de transition. Notre mission est de soigner et de renforcer les personnes — sans aucune discrimination — par le bien-être, la nature et la vie écologique.
  intro: The Evergreen Project est né en 2020, initiative collective d’amis, d’enseignants et d’élèves d’Evergreen Yoga Studios, et il est devenu une société civile à but non lucratif début 2021. Sur un terrain au pied du mont Kallidromo, à quelques minutes à pied du village d’Anavra, des personnes venues de Grèce et de toute l’Europe cultivent, construisent avec des matériaux naturels, pratiquent le yoga et apprennent à vivre plus simplement — et plus joyeusement — ensemble et avec la Terre.
  facts:
  - value: '2021'
    label: Association à but non lucratif depuis
  - value: CES
    label: Label de qualité jusqu’en 2027
  - value: 18 €
    label: par jour pour séjourner chez nous
  - value: 2 h
    label: d’Athènes
  escTitle: Devenez volontaire avec le Corps européen de solidarité
  escText: Nous sommes une organisation d’accueil accréditée du Corps européen de solidarité (CES). Des jeunes de 18 à 30 ans nous rejoignent pour quelques semaines ou plusieurs mois pour construire, cultiver, apprendre et vivre en communauté — nourriture, logement, voyage et argent de poche étant pris en charge par le programme.
  yogaTitle: Evergreen Yoga Studios, nos racines à Athènes
  yogaText: The Evergreen Project est né de la communauté d’Evergreen Yoga Studios, fondé à Athènes en 2012 par Panos Katsandris. Les cours quotidiens, les formations de professeurs et les ateliers ont lieu dans les deux studios d’Athènes (Exarchia et Nea Ionia), et Evergreen Yoga Retreats organise des retraites partout en Grèce — l’ashram dans la forêt est l’endroit où la pratique rencontre la nature. Horaires, tarifs et réservations sont sur leurs propres sites.
  contactTitle: Venez nous rencontrer — la forêt vous attend.
  imageAlt: Relaxation finale dans la shala de l’Evergreen Project
  yogaKicker: Le yoga en ville
  yogaImage: /src/assets/uploads/shala-roof.webp
  escImage: /src/assets/uploads/winter-shala-posts-2026.webp
  image: /src/assets/uploads/shala-savasana-wide.webp
es:
  title: Llevar a la gente de la ciudad a la naturaleza — y la naturaleza a la gente de la ciudad.
  subtitle: Vive, aprende y practica con nosotros en un bosque de acacias al pie del monte Kallidromo — como voluntario, huésped o participante de un retiro.
  manifesto: Somos un proyecto de vida holística y de transición. Nuestra labor es sanar y empoderar a las personas — sin ninguna discriminación — a través del bienestar, la naturaleza y la vida ecológica.
  intro: The Evergreen Project nació en 2020 como iniciativa colectiva de amigos, profesores y alumnos de Evergreen Yoga Studios, y se convirtió en sociedad civil sin ánimo de lucro a principios de 2021. En un terreno al pie del monte Kallidromo, a pocos minutos a pie del pueblo de Anavra, personas de Grecia y de toda Europa cultivan, construyen con materiales naturales, practican yoga y aprenden a vivir de forma más sencilla — y más alegre — entre sí y con la Tierra.
  facts:
  - value: '2021'
    label: Entidad sin ánimo de lucro desde
  - value: CES
    label: Sello de Calidad hasta 2027
  - value: 18 €
    label: al día para quedarte con nosotros
  - value: 2 h
    label: desde Atenas
  escTitle: Voluntariado con el Cuerpo Europeo de Solidaridad
  escText: Somos una organización de acogida acreditada del Cuerpo Europeo de Solidaridad (CES). Jóvenes de 18 a 30 años se unen a nosotros durante unas semanas o varios meses para construir, cultivar, aprender y vivir en comunidad — con comida, alojamiento, viaje y dinero de bolsillo cubiertos por el programa.
  yogaTitle: Evergreen Yoga Studios, nuestras raíces en Atenas
  yogaText: The Evergreen Project nació de la comunidad de Evergreen Yoga Studios, fundado en Atenas en 2012 por Panos Katsandris. Las clases diarias, las formaciones de profesores y los talleres tienen lugar en los dos estudios de Atenas (Exarchia y Nea Ionia), y Evergreen Yoga Retreats organiza retiros por toda Grecia — el ashram del bosque es donde la práctica se encuentra con la naturaleza. Horarios, precios y reservas están en sus propias webs.
  contactTitle: Ven a conocernos — el bosque te espera.
  imageAlt: Relajación final en la shala del Evergreen Project
  yogaKicker: Yoga en la ciudad
  yogaImage: /src/assets/uploads/shala-roof.webp
  escImage: /src/assets/uploads/winter-shala-posts-2026.webp
