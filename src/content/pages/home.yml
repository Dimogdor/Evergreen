it:
  title: Portare le persone di città nella natura — e la natura alle persone di città.
  subtitle: Vivi, impara e pratica con noi in un bosco di acacie ai piedi del monte Kallidromo — come volontario, ospite o partecipante a un ritiro.
  manifesto: Siamo un progetto di vita olistica e di transizione. Il nostro lavoro è guarire e rafforzare le persone — senza alcuna discriminazione — attraverso il benessere, la natura e la vita ecologica.
  intro: The Evergreen Project è nato nel 2020 come iniziativa collettiva di amici, insegnanti e allievi di Evergreen Yoga Studios ed è diventato una società civile senza scopo di lucro all’inizio del 2021. Su un terreno ai piedi del monte Kallidromo, a pochi minuti a piedi dal villaggio di Anavra, persone dalla Grecia e da tutta Europa coltivano, costruiscono con materiali naturali, praticano yoga e imparano a vivere in modo più semplice — e più gioioso — tra loro e con la Terra.
