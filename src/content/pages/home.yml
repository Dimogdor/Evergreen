ru:
  title: Приводим горожан к природе — и природу к горожанам.
  subtitle: Живите, учитесь и практикуйте вместе с нами в акациевом лесу у подножия горы Каллидромо — как волонтёр, гость или участник ретрита.
  manifesto: Мы — проект целостной жизни и перехода к устойчивому образу жизни. Наша цель — исцелять и поддерживать людей, без какой-либо дискриминации, через благополучие, природу и экологичную жизнь.
  intro: The Evergreen Project родился в 2020 году как совместная инициатива друзей, преподавателей и учеников Evergreen Yoga Studios, а в начале 2021 года стал некоммерческой гражданской компанией. На участке у подножия горы Каллидромо, в нескольких минутах ходьбы от деревни Анавра, люди из Греции и со всей Европы выращивают еду, строят из природных материалов, занимаются йогой и учатся жить проще — и радостнее — друг с другом и с Землёй.
  facts:
  - value: '2021'
    label: Некоммерческая организация с
  - value: ESC
    label: Знак качества до 2027 года
  - value: 18 €
    label: в день за проживание у нас
  - value: 2 часа
    label: от Афин
  escTitle: Волонтёрство с Европейским корпусом солидарности
  escText: Мы — аккредитованная принимающая организация Европейского корпуса солидарности (ESC). Молодые люди 18–30 лет приезжают к нам на несколько недель или месяцев, чтобы строить, выращивать, учиться и жить в сообществе. Питание, проживание, дорогу и карманные деньги оплачивает программа.
  yogaTitle: Evergreen Yoga Studios — наши корни в Афинах
  yogaText: The Evergreen Project вырос из сообщества Evergreen Yoga Studios, основанного Паносом Кацандрисом в Афинах в 2012 году. Ежедневные занятия, обучение преподавателей и семинары проходят в двух афинских студиях (Экзархия и Неа-Иония), а Evergreen Yoga Retreats проводит ретриты по всей Греции; ашрам в лесу — место, где практика встречается с природой. Расписание, цены и бронирование — на их сайтах.
  contactTitle: Приезжайте познакомиться — лес ждёт вас.
  imageAlt: Шавасана в шале Evergreen Project
  yogaKicker: Йога в городе
