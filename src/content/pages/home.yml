  yogaText: The Evergreen Project è nato dalla comunità di Evergreen Yoga Studios, fondato ad Atene nel 2012 da Panos Katsandris. Lezioni quotidiane, formazioni insegnanti e workshop si svolgono nei due studi di Atene (Exarchia e Nea Ionia), mentre Evergreen Yoga Retreats organizza ritiri in tutta la Grecia — l’ashram nel bosco è il luogo dove la pratica incontra la natura. Orari, prezzi e prenotazioni sono sui loro siti.
