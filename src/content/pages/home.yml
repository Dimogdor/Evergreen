  escTitle: Voluntariado com o Corpo Europeu de Solidariedade
  escText: Somos uma organização de acolhimento acreditada do Corpo Europeu de Solidariedade (CES). Jovens dos 18 aos 30 anos juntam-se a nós durante algumas semanas ou vários meses para construir, cultivar, aprender e viver em comunidade — com alimentação, alojamento, viagem e dinheiro de bolso cobertos pelo programa.
  yogaTitle: Evergreen Yoga Studios, as nossas raízes em Atenas
  yogaText: The Evergreen Project nasceu da comunidade dos Evergreen Yoga Studios, fundados em Atenas em 2012 por Panos Katsandris. As aulas diárias, as formações de professores e os workshops decorrem nos dois estúdios de Atenas (Exarchia e Nea Ionia), e os Evergreen Yoga Retreats organizam retiros por toda a Grécia — o ashram na floresta é onde a prática encontra a natureza. Horários, preços e reservas estão nos sites deles.
  contactTitle: Venha conhecer-nos — a floresta está à sua espera.
