el:
  title: Ιστορίες
  intro: Πρώην εθελοντές του Ευρωπαϊκού Σώματος Αλληλεγγύης, φιλοξενούμενοι και συμμετέχοντες μοιράζονται πώς έζησαν τον χρόνο τους στο δάσος.
en:
  title: Stories
  intro: Former European Solidarity Corps volunteers, guests and participants share what their time in the forest meant to them.
