de:
  title: Das Projekt
  intro: Ein Projekt für ganzheitliches Leben und Wandel am Fuß des Kallidromo-Gebirges.
  sections:
    - heading: Wer wir sind
      text: |-
        The Evergreen Project ist eine gemeinnützige Zivilgesellschaft, die Anfang 2021 in Anavra (Fthiotida) gegründet wurde — auf einem bewaldeten Grundstück am Fuß des Kallidromo-Gebirges in Mittelgriechenland. Wir beschreiben uns ganz einfach: ein Ökodorf, eine Gemeinschaft und ein Ashram.

        Wir sind Menschen, die sich entschieden haben, langsamer zu werden, näher an der Natur zu leben und diese Erfahrung zu teilen — mit jungen Menschen aus ganz Europa, mit Yoga-Praktizierenden, mit Familien und mit allen, die neugierig auf eine andere Lebensweise sind.
    - heading: Unsere Mission
      text: |-
        Unser Hauptanliegen ist es, **Menschen ohne jede Diskriminierung zu heilen und zu stärken**: ihnen zu helfen, mit ihren Gefühlen in Kontakt zu kommen und sich selbst besser kennenzulernen — durch Aktivitäten an der Schnittstelle von **Wohlbefinden, Natur und ökologischem Leben**.

        Wir glauben, dass die Klima-, Wirtschafts- und Energiekrisen unserer Zeit auch einen inneren Wandel verlangen — und dass ein Wald, eine gemeinsame Küche und ein Kreis von Menschen wertvolle Lehrer sein können.
    - heading: Was wir tun
      text: |-
        Manche dieser Bereiche sind schon gut entwickelt, andere wachsen jeden Tag ein Stück weiter.

        - Gemeinschaftsbildung, Teambuilding und Moderation
        - Gruppenprozess-Psychotherapie, Dramatherapie und Ökotherapie
        - Yoga, Meditation und achtsames Leben
        - Gesunde, vegetarische Ernährung
        - Permakultur und biologischer Gartenbau
        - Naturbau und Holzarbeit
        - Forstwirtschaft, Agroforst und Brandschutz
        - Nachhaltiger Umgang mit Energie, Wasser und Abfall
        - Menschenrechte und Inklusion
    - heading: Für wen
      text: |-
        Unsere Angebote richten sich an Menschen aus der Region, aus Athen und ganz Griechenland, aus Europa und der ganzen Welt — **mit besonderem Fokus auf jungen Menschen**. Wir öffnen unsere Türen auch allen, die von den jüngsten Wirtschafts-, Umwelt- und Energiekrisen betroffen sind und einen Wandel hin zu einer alternativen Lebensweise suchen.
    - heading: Unsere Vision
      text: |-
        Wir träumen von einem **ganzjährigen Bildungsort**, dauerhaft verwurzelt im Kallidromo-Gebirge: einem selbstversorgenden Ökodorf, in das Menschen kommen, um zu lernen, zu heilen und zu gestalten. Schon heute inspirieren und begleiten wir andere, die eigene Transition-Projekte oder kleine ökologische Unternehmen starten — oder einfach wieder mit der Natur in Verbindung kommen möchten.
    - heading: Entstanden aus Evergreen Yoga
      text: |-
        Das Projekt ist die natürliche Fortsetzung der **Evergreen Yoga Studios**, einer Yogaschule, die Panos Katsandris 2012 in Athen gegründet hat. Tausende Schüler·innen haben in den beiden Athener Studios praktiziert; der Ashram im Wald ist der Ort, an dem diese Praxis der Natur, der Einfachheit und der Gemeinschaft begegnet.

        [Evergreen Yoga Studios besuchen ↗](https://www.evergreenyogastudios.com)
