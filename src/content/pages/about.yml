el:
  image: /src/assets/uploads/winter-shala-posts-2026.webp
  title: Το πρότζεκτ
  intro: Ένα πρότζεκτ ολιστικής διαβίωσης και μετάβασης στους πρόποδες του Καλλιδρόμου.
  sections:
  - heading: Ποιοι είμαστε
    image: /src/assets/uploads/building-together-2026.webp
    text: |-
      Το Evergreen Project γεννήθηκε το 2020 — μέσα στην καραντίνα, με το αίσθημα «τώρα ή ποτέ» — ως συλλογική πρωτοβουλία εργαζομένων, δασκάλων, μαθητών και φίλων. Στις αρχές του 2021 έγινε αστική μη κερδοσκοπική εταιρεία, και το ίδιο καλοκαίρι η ομάδα έμεινε για πρώτη φορά στο χωράφι, στους πρόποδες του Καλλιδρόμου κοντά στην Ανάβρα Φθιώτιδας.

      Στην καρδιά του βρίσκονται η **Κατερίνα Ζέρβα**, ο σύντροφός της **Κώστας (Κωνσταντίνος) Τριγάζης** και ο δάσκαλός της στη γιόγκα **Panos Katsandris**, που είχε από χρόνια το όραμα μιας κοινότητας που ζει αρμονικά κοντά στη φύση. Το πρότζεκτ είναι οργανωμένο κοινοτικά, χωρίς ατομική ιδιοκτησία, και λειτουργεί με την προσφορά, τη συνεργασία, την αλληλοϋποστήριξη — και κυρίως με δωρεές.
  - heading: Η αποστολή μας
    image: /src/assets/uploads/meadow-freedom.webp
    text: |-
      Βασικός μας στόχος είναι να **θεραπεύουμε και να ενδυναμώνουμε τους ανθρώπους χωρίς καμία διάκριση**: να τους βοηθάμε να συνδεθούν με τα συναισθήματά τους και να εμβαθύνουν στην αυτογνωσία τους, μέσα από δραστηριότητες που αναπτύσσονται στη συνάντηση της **ευεξίας, της φύσης και της οικολογικής ζωής**.

      Πιστεύουμε ότι οι κλιματικές, οικονομικές και ενεργειακές κρίσεις που ζούμε ζητούν και μια εσωτερική αλλαγή — και ότι ένα δάσος, μια κοινή κουζίνα και ένας κύκλος ανθρώπων μπορούν να γίνουν πολύτιμοι δάσκαλοι.
  - heading: Τι κάνουμε
    text: |-
      Μερικοί από αυτούς τους τομείς είναι ήδη καλά ανεπτυγμένοι· άλλοι μεγαλώνουν λίγο περισσότερο κάθε μέρα.

      - Δημιουργία κοινότητας, ομαδική συνεργασία και διευκόλυνση ομάδων
      - Ψυχοθεραπεία ομαδικής διαδικασίας, δραματοθεραπεία και οικοθεραπεία
      - Γιόγκα, διαλογισμός και ενσυνείδητη ζωή
      - Υγιεινή, χορτοφαγική διατροφή
      - Περμακουλτούρα και βιολογική καλλιέργεια
      - Φυσική δόμηση και ξυλουργική
      - Δασοκομία, αγροδασοπονία και πυροπροστασία
      - Βιώσιμη διαχείριση ενέργειας, νερού και απορριμμάτων
      - Ανθρώπινα δικαιώματα και συμπερίληψη
  - heading: Για ποιους
    image: /src/assets/uploads/group-play.webp
    text: Οι δραστηριότητές μας απευθύνονται σε ανθρώπους από την τοπική κοινωνία, την Αθήνα και την υπόλοιπη Ελλάδα, την Ευρώπη και όλο τον κόσμο — **με ιδιαίτερη έμφαση στους νέους**. Ανοίγουμε επίσης την πόρτα μας σε όσους επηρεάστηκαν από τις πρόσφατες οικονομικές, περιβαλλοντικές και ενεργειακές κρίσεις και θέλουν να κάνουν μια αλλαγή προς έναν εναλλακτικό τρόπο ζωής.
  - heading: Το όραμά μας
    image: /src/assets/uploads/tents-fairy-lights.webp
    text: |-
      Ονειρευόμαστε ένα **κέντρο εκπαίδευσης που λειτουργεί όλο τον χρόνο**, ριζωμένο μόνιμα στο Καλλίδρομο: ένα αυτάρκες οικοχωριό όπου οι άνθρωποι έρχονται να μάθουν, να θεραπευτούν και να δημιουργήσουν. Ήδη εμπνέουμε και καθοδηγούμε άλλους που θέλουν να ξεκινήσουν τα δικά τους πρότζεκτ μετάβασης ή μικρές οικολογικές επιχειρήσεις — ή απλώς να ξανασυνδεθούν με τη φύση.

      Ελπίζουμε σύντομα να χτίσουμε τα πρώτα μικρά σπίτια (tiny houses) στον χώρο, να οργανώσουμε φεστιβάλ στη φύση και να δώσουμε ξανά ζωή στο χωριό της Ανάβρας.
  - heading: Γεννημένο από το Evergreen Yoga
    image: /src/assets/uploads/shala-roof.webp
    text: |-
      Το πρότζεκτ είναι η φυσική συνέχεια των **Evergreen Yoga Studios**, μιας σχολής γιόγκα που ίδρυσε ο Panos Katsandris στην Αθήνα το 2012. Χιλιάδες μαθητές έχουν περάσει από τα δύο στούντιο της Αθήνας· το άσραμ στο δάσος είναι το σημείο όπου αυτή η πρακτική συναντά τη φύση, την απλότητα και την κοινότητα.

      [Επισκεφθείτε τα Evergreen Yoga Studios ↗](https://www.evergreenyogastudios.com)
