it:
  title: Il progetto
  intro: Un progetto di vita olistica e di transizione ai piedi del monte Kallidromo.
  sections:
    - heading: Chi siamo
      text: |-
        The Evergreen Project è una società civile senza scopo di lucro fondata all’inizio del 2021 ad Anavra, in Ftiotide, su un terreno boscoso ai piedi del monte Kallidromo, nella Grecia centrale. Ci descriviamo in modo semplice: un ecovillaggio, una comunità e un ashram.

        Siamo persone che hanno scelto di rallentare, vivere più vicino alla natura e condividere questa esperienza — con giovani da tutta Europa, con chi pratica yoga, con famiglie e con chiunque sia curioso di un altro modo di vivere.
    - heading: La nostra missione
      text: |-
        Il nostro obiettivo principale è **guarire e rafforzare le persone senza alcuna discriminazione**: aiutarle a entrare in contatto con le proprie emozioni e ad approfondire la conoscenza di sé, attraverso attività che nascono all’incrocio tra **benessere, natura e vita ecologica**.

        Crediamo che le crisi climatica, economica ed energetica che stiamo vivendo richiedano anche un cambiamento interiore — e che un bosco, una cucina condivisa e un cerchio di persone possano essere maestri preziosi.
    - heading: Cosa facciamo
      text: |-
        Alcuni di questi ambiti sono già ben sviluppati; altri crescono un po’ ogni giorno.

        - Costruzione di comunità, team building e facilitazione
        - Psicoterapia di processo di gruppo, drammaterapia ed ecoterapia
        - Yoga, meditazione e vita consapevole
        - Alimentazione sana e vegetariana
        - Permacultura e orto biologico
        - Bioedilizia e lavorazione del legno
        - Selvicoltura, agroforestazione e prevenzione degli incendi
        - Gestione sostenibile di energia, acqua e rifiuti
        - Diritti umani e inclusione
    - heading: Per chi
      text: |-
        Le nostre attività accolgono persone della comunità locale, di Atene e del resto della Grecia, dell’Europa e di tutto il mondo — **con un’attenzione particolare ai giovani**. Apriamo le porte anche a chi è stato colpito dalle recenti crisi economica, ambientale ed energetica e desidera cambiare verso uno stile di vita alternativo.
    - heading: La nostra visione
      text: |-
        Sogniamo un **centro educativo aperto tutto l’anno**, radicato stabilmente sul monte Kallidromo: un ecovillaggio autosufficiente dove le persone vengono a imparare, guarire e creare. Già oggi ispiriamo e accompagniamo chi vuole avviare un proprio progetto di transizione o una piccola attività ecologica — o semplicemente ritrovare il contatto con la natura.
    - heading: Nato da Evergreen Yoga
      text: |-
        Il progetto è la naturale estensione di **Evergreen Yoga Studios**, una scuola di yoga fondata ad Atene nel 2012 da Panos Katsandris. Migliaia di allievi hanno praticato nei suoi due studi ateniesi; l’ashram nel bosco è il luogo in cui questa pratica incontra la natura, la semplicità e la comunità.

        [Visita Evergreen Yoga Studios ↗](https://www.evergreenyogastudios.com)
  facts:
