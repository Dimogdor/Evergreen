ru:
  title: О проекте
  intro: Проект целостной жизни и перехода к устойчивому образу жизни у подножия горы Каллидромо.
  sections:
  - heading: Кто мы
    text: |-
      The Evergreen Project родился в 2020 году — во время локдаунов, с сильным ощущением «сейчас или никогда» — как совместная инициатива работающих людей, преподавателей, учеников и друзей. В начале 2021 года он стал некоммерческой гражданской компанией, и тем же летом команда впервые поселилась на участке у подножия горы Каллидромо возле Анавры (Фтиотида).

      В его сердце — **Катерина Зерва**, её спутник **Костас (Константинос) Тригазис** и её учитель йоги **Панос Кацандрис**, давно мечтавший о сообществе, живущем в гармонии с природой. Проект организован как сообщество, без индивидуальной собственности, и держится на отдаче, сотрудничестве, взаимной поддержке — и прежде всего на пожертвованиях.
  - heading: Наша миссия
    text: |-
      Главное направление нашей работы — **исцелять и поддерживать людей без какой-либо дискриминации**: помогать им соединиться со своими эмоциями и глубже познать себя через занятия, которые рождаются на пересечении **благополучия, природы и экологичной жизни**.

      Мы верим, что климатический, экономический и энергетический кризисы, которые мы переживаем, требуют и внутренних перемен — и что лес, общая кухня и круг людей могут стать бесценными учителями.
  - heading: Чем мы занимаемся
    text: |-
      Некоторые направления уже хорошо развиты, другие растут понемногу каждый день.

      - Построение сообщества, командная работа и фасилитация
      - Групповая процессуальная психотерапия, драматерапия и экотерапия
      - Йога, медитация и осознанная жизнь
      - Здоровое вегетарианское питание
      - Пермакультура и органическое садоводство
      - Природное строительство и работа с деревом
      - Лесоводство, агролесоводство и защита от пожаров
      - Устойчивое управление энергией, водой и отходами
      - Права человека и инклюзия
  - heading: Для кого
    text: Наши программы открыты для людей из местного сообщества, из Афин и всей Греции, из Европы и со всего мира — **с особым вниманием к молодёжи**. Мы также рады всем, кого затронули недавние экономический, экологический и энергетический кризисы и кто хочет перейти к альтернативному образу жизни.
  - heading: Наше видение
    text: |-
      Мы мечтаем о **круглогодичном образовательном центре**, навсегда укоренённом на горе Каллидромо: самодостаточной экодеревне, куда люди приезжают учиться, исцеляться и творить. Уже сегодня мы вдохновляем и поддерживаем тех, кто хочет начать собственный проект перехода или небольшое экологичное дело — или просто вновь соединиться с природой.

      Мы надеемся вскоре построить на участке первые маленькие дома (tiny houses), проводить фестивали на природе и помочь деревне Анавра снова ожить.
  - heading: Родом из Evergreen Yoga
    text: |-
      Проект — естественное продолжение **Evergreen Yoga Studios**, школы йоги, которую Панос Кацандрис основал в Афинах в 2012 году. В двух афинских студиях занимались тысячи учеников, а ашрам в лесу — то место, где эта практика встречается с природой, простотой и сообществом.

      [Посетить Evergreen Yoga Studios ↗](https://www.evergreenyogastudios.com)
