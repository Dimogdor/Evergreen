en:
  title: The project
  intro: A holistic living and transition project at the foot of Mount Kallidromo.
  sections:
  - heading: Who we are
    text: |-
      The Evergreen Project was born in 2020 — during the lockdowns, with a strong feeling of “now or never” — as a collective initiative of workers, teachers, students and friends. In early 2021 it became a civil non-profit company, and that same summer the team stayed on the land for the first time, at the foot of Mount Kallidromo near Anavra, Fthiotida.

      At its heart are **Katerina Zerva**, her partner **Kostas (Konstantinos) Trigazis** and her yoga teacher **Panos Katsandris**, who had long held the vision of a community living in harmony close to nature. The project is community-organised, without individual ownership, and runs on offering, cooperation, mutual support — and mostly on donations.
  - heading: Our mission
    text: |-
      Our main line of work is to **heal and empower people without any discrimination**: to help them connect with their emotions and deepen their self-knowledge, through activities that grow at the intersection of **wellbeing, nature and eco-living**.

      We believe that the climate, economic and energy crises we are living through also call for an inner change — and that a forest, a shared kitchen and a circle of people can be precious teachers.
  - heading: What we do
    text: |-
      Some of these fields are already well developed; others grow a little more every day.

      - Community building, team building and facilitation
      - Group-process psychotherapy, dramatherapy and eco-therapy
      - Yoga, meditation and mindful living
      - Healthy, vegetarian nutrition
      - Permaculture and organic gardening
      - Natural building and woodworking
      - Forestry, agroforestry and fire protection
      - Sustainable energy, water and waste management
      - Human rights and inclusion
  - heading: Who it is for
    text: Our activities welcome people from the local community, from Athens and the rest of Greece, from Europe and from the whole world — **with a special focus on young people**. We also open our doors to everyone affected by the recent economic, environmental and energy crises who wants to make a change towards an alternative way of living.
  - heading: Our vision
    text: |-
      We dream of an **education hub open all year round**, permanently rooted on Mount Kallidromo: a self-sufficient eco-village where people come to learn, heal and create. We already inspire and guide others who want to start their own transition projects or small eco-businesses — or who simply want to reconnect with nature.

      We hope soon to build the first tiny houses on the land, to organise festivals in nature and to help bring the village of Anavra back to life.
  - heading: Born from Evergreen Yoga
    text: |-
      The project is the natural extension of **Evergreen Yoga Studios**, a yoga school founded in Athens in 2012 by Panos Katsandris. Thousands of students have practised in its two Athens studios; the ashram in the forest is where that practice meets nature, simplicity and community.

      [Visit Evergreen Yoga Studios ↗](https://www.evergreenyogastudios.com)
