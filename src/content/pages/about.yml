pt:
  title: O projeto
  intro: Um projeto de vida holística e de transição no sopé do monte Kallidromo.
  sections:
    - heading: Quem somos
      text: |-
        The Evergreen Project é uma sociedade civil sem fins lucrativos fundada no início de 2021 em Anavra, na Ftiótida, num terreno florestal no sopé do monte Kallidromo, na Grécia Central. Descrevemo-nos de forma simples: uma ecoaldeia, uma comunidade e um ashram.

        Somos pessoas que escolheram abrandar, viver mais perto da natureza e partilhar essa experiência — com jovens de toda a Europa, com praticantes de yoga, com famílias e com quem tenha curiosidade por outra forma de viver.
    - heading: A nossa missão
      text: |-
        A nossa principal linha de trabalho é **curar e capacitar as pessoas sem qualquer discriminação**: ajudá-las a ligar-se às suas emoções e a aprofundar o autoconhecimento, através de atividades que nascem no cruzamento entre **bem-estar, natureza e vida ecológica**.

        Acreditamos que as crises climática, económica e energética que vivemos pedem também uma mudança interior — e que uma floresta, uma cozinha partilhada e um círculo de pessoas podem ser mestres preciosos.
    - heading: O que fazemos
      text: |-
        Algumas destas áreas já estão bem desenvolvidas; outras crescem um pouco mais todos os dias.

        - Construção de comunidade, trabalho de equipa e facilitação
        - Psicoterapia de processo de grupo, dramaterapia e ecoterapia
        - Yoga, meditação e vida consciente
        - Alimentação saudável e vegetariana
        - Permacultura e horta biológica
        - Bioconstrução e carpintaria
        - Silvicultura, agrofloresta e proteção contra incêndios
        - Gestão sustentável de energia, água e resíduos
        - Direitos humanos e inclusão
    - heading: Para quem
      text: |-
        As nossas atividades acolhem pessoas da comunidade local, de Atenas e do resto da Grécia, da Europa e de todo o mundo — **com especial atenção aos jovens**. Abrimos também as portas a quem foi afetado pelas recentes crises económica, ambiental e energética e quer mudar para um modo de vida alternativo.
    - heading: A nossa visão
      text: |-
        Sonhamos com um **centro educativo aberto todo o ano**, enraizado de forma permanente no monte Kallidromo: uma ecoaldeia autossuficiente onde as pessoas vêm aprender, curar-se e criar. Já hoje inspiramos e orientamos quem quer iniciar os seus próprios projetos de transição ou pequenos negócios ecológicos — ou simplesmente reencontrar a natureza.
    - heading: Nascido do Evergreen Yoga
      text: |-
        O projeto é a extensão natural dos **Evergreen Yoga Studios**, uma escola de yoga fundada em Atenas em 2012 por Panos Katsandris. Milhares de alunos praticaram nos seus dois estúdios de Atenas; o ashram na floresta é onde essa prática encontra a natureza, a simplicidade e a comunidade.

        [Visitar os Evergreen Yoga Studios ↗](https://www.evergreenyogastudios.com)
