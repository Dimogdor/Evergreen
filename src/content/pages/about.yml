fr:
  title: Le projet
  intro: Un projet de vie holistique et de transition au pied du mont Kallidromo.
  sections:
    - heading: Qui sommes-nous
      text: |-
        The Evergreen Project est une société civile à but non lucratif fondée début 2021 à Anavra, en Phthiotide, sur un terrain boisé au pied du mont Kallidromo, en Grèce centrale. Nous nous décrivons simplement : un écovillage, une communauté et un ashram.

        Nous sommes des personnes qui ont choisi de ralentir, de vivre plus près de la nature et de partager cette expérience — avec des jeunes de toute l’Europe, des pratiquants de yoga, des familles et toute personne curieuse d’une autre manière de vivre.
    - heading: Notre mission
      text: |-
        Notre axe principal est de **soigner et renforcer les personnes, sans aucune discrimination** : les aider à se connecter à leurs émotions et à approfondir la connaissance d’elles-mêmes, grâce à des activités qui naissent à la croisée du **bien-être, de la nature et de la vie écologique**.

        Nous croyons que les crises climatique, économique et énergétique que nous traversons appellent aussi un changement intérieur — et qu’une forêt, une cuisine partagée et un cercle de personnes peuvent être de précieux enseignants.
    - heading: Ce que nous faisons
      text: |-
        Certains de ces domaines sont déjà bien développés ; d’autres grandissent un peu plus chaque jour.

        - Création de communauté, cohésion d’équipe et facilitation
        - Psychothérapie de processus de groupe, dramathérapie et écothérapie
        - Yoga, méditation et pleine conscience
        - Alimentation saine et végétarienne
        - Permaculture et jardinage biologique
        - Construction naturelle et travail du bois
        - Sylviculture, agroforesterie et protection contre les incendies
        - Gestion durable de l’énergie, de l’eau et des déchets
        - Droits humains et inclusion
    - heading: Pour qui
      text: |-
        Nos activités accueillent des personnes de la communauté locale, d’Athènes et du reste de la Grèce, d’Europe et du monde entier — **avec une attention particulière pour les jeunes**. Nous ouvrons aussi nos portes à toutes celles et ceux touchés par les récentes crises économique, environnementale et énergétique qui souhaitent changer pour un mode de vie alternatif.
    - heading: Notre vision
      text: |-
        Nous rêvons d’un **lieu d’apprentissage ouvert toute l’année**, enraciné durablement sur le mont Kallidromo : un écovillage autonome où l’on vient apprendre, guérir et créer. Nous inspirons et accompagnons déjà d’autres personnes qui veulent lancer leurs propres projets de transition ou de petites entreprises écologiques — ou simplement renouer avec la nature.
    - heading: Né d’Evergreen Yoga
      text: |-
        Le projet est le prolongement naturel d’**Evergreen Yoga Studios**, une école de yoga fondée à Athènes en 2012 par Panos Katsandris. Des milliers d’élèves ont pratiqué dans ses deux studios athéniens ; l’ashram dans la forêt est l’endroit où cette pratique rencontre la nature, la simplicité et la communauté.

        [Découvrir Evergreen Yoga Studios ↗](https://www.evergreenyogastudios.com)
