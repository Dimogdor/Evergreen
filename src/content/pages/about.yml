es:
  title: El proyecto
  intro: Un proyecto de vida holística y de transición al pie del monte Kallidromo.
  sections:
    - heading: Quiénes somos
      text: |-
        The Evergreen Project es una sociedad civil sin ánimo de lucro fundada a principios de 2021 en Anavra, Ftiótide, en un terreno boscoso al pie del monte Kallidromo, en Grecia central. Nos describimos de forma sencilla: una ecoaldea, una comunidad y un ashram.

        Somos personas que eligieron bajar el ritmo, vivir más cerca de la naturaleza y compartir esa experiencia — con jóvenes de toda Europa, con practicantes de yoga, con familias y con cualquiera que sienta curiosidad por otra forma de vivir.
    - heading: Nuestra misión
      text: |-
        Nuestra línea principal de trabajo es **sanar y empoderar a las personas sin ninguna discriminación**: ayudarlas a conectar con sus emociones y profundizar en el conocimiento de sí mismas, mediante actividades que nacen en la intersección entre **bienestar, naturaleza y vida ecológica**.

        Creemos que las crisis climática, económica y energética que vivimos piden también un cambio interior — y que un bosque, una cocina compartida y un círculo de personas pueden ser maestros valiosos.
    - heading: Qué hacemos
      text: |-
        Algunos de estos campos ya están bien desarrollados; otros crecen un poco más cada día.

        - Construcción de comunidad, trabajo en equipo y facilitación
        - Psicoterapia de proceso grupal, dramaterapia y ecoterapia
        - Yoga, meditación y vida consciente
        - Alimentación sana y vegetariana
        - Permacultura y huerta ecológica
        - Bioconstrucción y carpintería
        - Silvicultura, agroforestería y prevención de incendios
        - Gestión sostenible de la energía, el agua y los residuos
        - Derechos humanos e inclusión
    - heading: Para quién
      text: |-
        Nuestras actividades acogen a personas de la comunidad local, de Atenas y del resto de Grecia, de Europa y de todo el mundo — **con especial atención a la gente joven**. También abrimos nuestras puertas a quienes se han visto afectados por las recientes crisis económica, ambiental y energética y quieren cambiar hacia una forma de vida alternativa.
    - heading: Nuestra visión
      text: |-
        Soñamos con un **centro educativo abierto todo el año**, arraigado de forma permanente en el monte Kallidromo: una ecoaldea autosuficiente adonde la gente venga a aprender, sanar y crear. Ya inspiramos y acompañamos a otras personas que quieren iniciar sus propios proyectos de transición o pequeños negocios ecológicos — o simplemente reconectar con la naturaleza.
    - heading: Nacido de Evergreen Yoga
      text: |-
        El proyecto es la extensión natural de **Evergreen Yoga Studios**, una escuela de yoga fundada en Atenas en 2012 por Panos Katsandris. Miles de alumnos han practicado en sus dos estudios de Atenas; el ashram del bosque es donde esa práctica se encuentra con la naturaleza, la sencillez y la comunidad.

        [Visita Evergreen Yoga Studios ↗](https://www.evergreenyogastudios.com)
