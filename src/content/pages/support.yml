el:
  image: /src/assets/uploads/building-frame-2026.webp
  title: Στηρίξτε μας
  intro: Το Evergreen μεγαλώνει χάρη σε πολλά χέρια — δείτε πώς μπορούν να βοηθήσουν και τα δικά σας.
  sections:
  - heading: Ευχαριστούμε
    text: 'Την άνοιξη του 2025 η γη στην οποία έχουμε δώσει την καρδιά μας κινδύνευε: χρειαζόμασταν 13.000 € μέσα σε λίγες εβδομάδες για να κρατήσουμε το σπίτι μας στο δάσος. Η στήριξή σας ήταν τόσο συγκινητική που ο έρανος εξασφάλισε **το Χωράφι** και μας άνοιξε τον δρόμο. Σας ευχαριστούμε από καρδιάς — κάθε χέρι, κάθε κοινοποίηση και κάθε ευρώ κρατούν ζωντανό αυτό το καταφύγιο.'
    image: /src/assets/uploads/group-hug.webp
  - heading: Δωρίστε υλικά & εργαλεία
    text: Χτίζουμε ένα οικοχωριό με πολύ περιορισμένα μέσα. Καλά εργαλεία και μεταχειρισμένα υλικά κάνουν τεράστια διαφορά — δείτε τη λίστα παρακάτω. Αν μπορείτε να δώσετε, να δανείσετε ή να μεταφέρετε κάτι, [επικοινωνήστε μαζί μας](/el/contact/).
  - heading: Γίνετε εθελοντής
    text: Ελάτε μέσω του [Ευρωπαϊκού Σώματος Αλληλεγγύης](/el/activities/esc-volunteering/) αν είστε 18–30 ετών, ή [μείνετε μαζί μας](/el/activities/stay-with-us/). Κάθε ζευγάρι χέρια βοηθά τον κήπο, τα κτίρια και την κοινότητα να μεγαλώσουν.
  - heading: Βοήθεια από μακριά
    text: Δεν είστε κοντά; Πάντα υπάρχουν δουλειές που γίνονται εξ αποστάσεως — σχεδιασμός, μεταφράσεις, επικοινωνία, εύρεση υλικών. Μπορείτε επίσης να γίνετε **πρεσβευτής του Evergreen**, βοηθώντας την κοινότητα να μεγαλώσει και να συναντήσει ανθρώπους με την ίδια καρδιά.
  - heading: Συμμετέχετε σε ένα πρόγραμμα
    text: 'Τα ρητρίτ, τα εργαστήρια και οι γιορτές στηρίζουν το πρότζεκτ: η συμμετοχή σας είναι ήδη ένας τρόπος να το στηρίξετε. Δείτε το [ημερολόγιο](/el/calendar/).'
  - heading: Διαδώστε το
    text: Ακολουθήστε μας στο Instagram και στο Facebook, μοιραστείτε τα καλέσματά μας για εθελοντές και μιλήστε για το Evergreen στους φίλους σας.
  lists:
  - title: Τι χρειαζόμαστε
    intro: Πράγματα που θα μας βοηθούσαν αυτή τη στιγμή — τα μεταχειρισμένα είναι τέλεια!
    items:
    - title: Ποιοτικά εργαλεία
      text: Ειδικά ένα αλυσοπρίονο για δέντρα, καλά δραπανοκατσάβιδα, βίδες και καρφιά.
    - title: Ένα μικρό τρακτέρ
      text: Για τη μεταφορά υλικών μέσα στον χώρο.
    - title: Πόρτες & παράθυρα
      text: Για τα κτίρια φυσικής δόμησης.
    - title: Ξυλεία
      text: Δοκάρια, σανίδες και τάβλες για χτίσιμο.
    - title: Σωλήνες Ø20
      text: Για τις εγκαταστάσεις νερού.
    - title: Ξυλόσομπα
      text: Για να ζεσταίνουμε ένα κτίριο τον χειμώνα.
    - title: Ασφαλτόπανα
      text: Για να προστατεύουμε τις στέγες από τη βροχή.
    - title: Φούρνος υγραερίου
      text: Για την κοινή κουζίνα.
    - title: Θερμοσίφωνας
      text: Ηλιακός ή με ξύλα, για ζεστό νερό.
    - title: Ένα αγροτικό αυτοκίνητο (pick-up)
      text: Κάτι σαν Mitsubishi L200 — και 20 χρονών είναι μια χαρά!
en:
  title: Support us
  intro: Evergreen grows thanks to many hands — here is how yours can help.
  sections:
  - heading: Thank you
    text: 'In spring 2025 the land we had poured our hearts into was at risk: we needed €13,000 in a few weeks to keep our forest home. Your support was so moving that the fundraiser secured **the Field** and gave us a way forward. Thank you, from the bottom of our hearts — every hand, every share and every euro keeps this refuge alive.'
    image: /src/assets/uploads/group-hug.webp
  - heading: Donate materials & tools
    text: We are building an eco-village with very limited means. Good tools and second-hand materials make a huge difference — see the wishlist below. If you can give, lend or transport something, please [contact us](/en/contact/).
  - heading: Volunteer
    text: Join us through the [European Solidarity Corps](/en/activities/esc-volunteering/) if you are 18–30, or [stay with us](/en/activities/stay-with-us/). Every pair of hands helps the garden, the buildings and the community grow.
  - heading: Help from afar
    text: Not nearby? There are always tasks to be done remotely — design, translation, communication, finding materials. You can also become an **Evergreen ambassador**, helping us grow our community and connect with like-hearted people.
  - heading: Join a programme
    text: 'Retreats, workshops and gatherings sustain the project: taking part is already a way of supporting it. See the [calendar](/en/calendar/).'
  - heading: Spread the word
    text: Follow us on Instagram and Facebook, share our calls for volunteers and tell your friends about Evergreen.
  lists:
  - title: Our wishlist
    intro: Things that would help us right now — second-hand is perfect!
    items:
    - title: Quality tools
      text: Especially a chainsaw for trees, good cordless screwdrivers, screws and nails.
    - title: A small tractor
      text: To move materials around the land.
    - title: Doors & windows
      text: For our natural buildings.
    - title: Building timber
      text: Beams, planks and boards.
    - title: Ø20 pipes
      text: For water installations.
    - title: A wood stove
      text: To keep a building warm in winter.
    - title: Roofing felt
      text: Asphalt sheets to protect roofs from the rain.
    - title: A gas oven
      text: For the community kitchen.
    - title: A water boiler
      text: Solar or wood-fired, for hot water.
    - title: A pick-up truck
      text: Something like a Mitsubishi L200 — 20 years old is perfectly fine!
  image: /src/assets/uploads/building-frame-2026.webp
fr:
  title: Nous soutenir
  intro: Evergreen grandit grâce à de nombreuses mains — voici comment les vôtres peuvent aider.
  sections:
  - heading: Merci
    text: 'Au printemps 2025, la terre dans laquelle nous avions mis tout notre cœur était menacée : il nous fallait 13 000 € en quelques semaines pour garder notre maison dans la forêt. Votre soutien a été si émouvant que la collecte a permis de sécuriser **le Champ** et nous a ouvert un chemin. Merci du fond du cœur — chaque main, chaque partage et chaque euro font vivre ce refuge.'
    image: /src/assets/uploads/group-hug.webp
  - heading: Donner du matériel & des outils
    text: Nous construisons un écovillage avec des moyens très limités. De bons outils et des matériaux de seconde main font une énorme différence — voir la liste ci-dessous. Si vous pouvez donner, prêter ou transporter quelque chose, [contactez-nous](/fr/contact/).
  - heading: Devenir volontaire
    text: Rejoignez-nous via le [Corps européen de solidarité](/fr/activities/esc-volunteering/) si vous avez 18 à 30 ans, ou [séjournez chez nous](/fr/activities/stay-with-us/). Chaque paire de mains aide le jardin, les bâtiments et la communauté à grandir.
  - heading: Aider à distance
    text: Pas à côté ? Il y a toujours des tâches à faire à distance — graphisme, traduction, communication, recherche de matériaux. Vous pouvez aussi devenir **ambassadeur d’Evergreen** et nous aider à faire grandir la communauté.
  - heading: Participer à un programme
    text: 'Retraites, ateliers et rassemblements font vivre le projet : y participer, c’est déjà le soutenir. Consultez le [calendrier](/fr/calendar/).'
  - heading: Faire passer le mot
    text: Suivez-nous sur Instagram et Facebook, partagez nos appels à volontaires et parlez d’Evergreen autour de vous.
  lists:
  - title: Notre liste de souhaits
    intro: Ce qui nous aiderait en ce moment — l’occasion, c’est parfait !
    items:
    - title: Des outils de qualité
      text: Surtout une tronçonneuse pour les arbres, de bonnes visseuses sans fil, des vis et des clous.
    - title: Un petit tracteur
      text: Pour déplacer les matériaux sur le terrain.
    - title: Portes & fenêtres
      text: Pour nos constructions naturelles.
    - title: Bois de construction
      text: Poutres, planches et voliges.
    - title: Tuyaux Ø20
      text: Pour les installations d’eau.
    - title: Un poêle à bois
      text: Pour chauffer un bâtiment en hiver.
    - title: Bardeaux bitumés
      text: Pour protéger les toits de la pluie.
    - title: Un four à gaz
      text: Pour la cuisine commune.
    - title: Un chauffe-eau
      text: Solaire ou au bois, pour l’eau chaude.
    - title: Un pick-up
      text: Du genre Mitsubishi L200 — même vieux de 20 ans, c’est parfait !
  image: /src/assets/uploads/building-frame-2026.webp
es:
  title: Apóyanos
  intro: Evergreen crece gracias a muchas manos — así es como las tuyas pueden ayudar.
  sections:
  - heading: Gracias
    text: 'En la primavera de 2025 la tierra en la que habíamos puesto el corazón estaba en peligro: necesitábamos 13.000 € en pocas semanas para conservar nuestro hogar en el bosque. Vuestro apoyo fue tan conmovedor que la campaña aseguró **el Campo** y nos abrió un camino. Gracias de corazón — cada mano, cada difusión y cada euro mantienen vivo este refugio.'
    image: /src/assets/uploads/group-hug.webp
  - heading: Dona materiales y herramientas
    text: Estamos construyendo una ecoaldea con medios muy limitados. Buenas herramientas y materiales de segunda mano marcan una enorme diferencia — mira la lista de abajo. Si puedes dar, prestar o transportar algo, [contáctanos](/es/contact/).
  - heading: Hazte voluntario
    text: Únete a través del [Cuerpo Europeo de Solidaridad](/es/activities/esc-volunteering/) si tienes entre 18 y 30 años, o [quédate con nosotros](/es/activities/stay-with-us/). Cada par de manos ayuda a que la huerta, los edificios y la comunidad crezcan.
  - heading: Ayudar a distancia
    text: ¿No estás cerca? Siempre hay tareas que hacer a distancia — diseño, traducción, comunicación, búsqueda de materiales. También puedes ser **embajador de Evergreen** y ayudarnos a hacer crecer la comunidad.
  - heading: Participa en un programa
    text: 'Los retiros, talleres y encuentros sostienen el proyecto: participar ya es una forma de apoyarlo. Consulta el [calendario](/es/calendar/).'
  - heading: Corre la voz
    text: Síguenos en Instagram y Facebook, comparte nuestras convocatorias de voluntariado y habla de Evergreen a tus amigos.
  lists:
  - title: Lo que necesitamos
    intro: Cosas que nos ayudarían ahora mismo — ¡de segunda mano es perfecto!
    items:
    - title: Herramientas de calidad
      text: Sobre todo una motosierra para árboles, buenos atornilladores inalámbricos, tornillos y clavos.
    - title: Un tractor pequeño
      text: Para mover materiales por el terreno.
    - title: Puertas y ventanas
      text: Para nuestras construcciones naturales.
    - title: Madera de construcción
      text: Vigas, tablones y tablas.
    - title: Tubos de Ø20
      text: Para las instalaciones de agua.
    - title: Una estufa de leña
      text: Para calentar un edificio en invierno.
    - title: Tela asfáltica
      text: Para proteger los tejados de la lluvia.
    - title: Un horno de gas
      text: Para la cocina comunitaria.
    - title: Un calentador de agua
      text: Solar o de leña, para el agua caliente.
    - title: Una camioneta pick-up
      text: Algo como una Mitsubishi L200 — ¡aunque tenga 20 años está perfecto!
  image: /src/assets/uploads/building-frame-2026.webp
it:
  title: Sostienici
  intro: Evergreen cresce grazie a tante mani — ecco come possono aiutare anche le tue.
  sections:
  - heading: Grazie
    text: 'Nella primavera 2025 la terra in cui avevamo messo il cuore era a rischio: servivano 13.000 € in poche settimane per tenere la nostra casa nel bosco. Il vostro sostegno è stato così commovente che la raccolta fondi ha messo al sicuro **il Campo** e ci ha aperto una strada. Grazie di cuore — ogni mano, ogni condivisione e ogni euro tengono vivo questo rifugio.'
    image: /src/assets/uploads/group-hug.webp
  - heading: Dona materiali e attrezzi
    text: Stiamo costruendo un ecovillaggio con mezzi molto limitati. Buoni attrezzi e materiali di seconda mano fanno un’enorme differenza — vedi la lista qui sotto. Se puoi donare, prestare o trasportare qualcosa, [contattaci](/it/contact/).
  - heading: Diventa volontario
    text: Unisciti a noi con il [Corpo europeo di solidarietà](/it/activities/esc-volunteering/) se hai tra i 18 e i 30 anni, oppure [vieni a stare da noi](/it/activities/stay-with-us/). Ogni paio di mani aiuta l’orto, gli edifici e la comunità a crescere.
  - heading: Aiutare a distanza
    text: Non sei vicino? Ci sono sempre compiti da svolgere a distanza — grafica, traduzioni, comunicazione, ricerca di materiali. Puoi anche diventare **ambasciatore di Evergreen** e aiutarci a far crescere la comunità.
  - heading: Partecipa a un programma
    text: 'Ritiri, workshop e incontri sostengono il progetto: partecipare è già un modo per aiutarlo. Guarda il [calendario](/it/calendar/).'
  - heading: Passaparola
    text: Seguici su Instagram e Facebook, condividi le nostre chiamate per volontari e racconta Evergreen ai tuoi amici.
  lists:
  - title: Di cosa abbiamo bisogno
    intro: Cose che ci aiuterebbero adesso — l’usato va benissimo!
    items:
    - title: Attrezzi di qualità
      text: Soprattutto una motosega per gli alberi, buoni avvitatori a batteria, viti e chiodi.
    - title: Un piccolo trattore
      text: Per spostare i materiali sul terreno.
    - title: Porte e finestre
      text: Per le nostre costruzioni naturali.
    - title: Legname da costruzione
      text: Travi, tavole e assi.
    - title: Tubi Ø20
      text: Per gli impianti idrici.
    - title: Una stufa a legna
      text: Per scaldare un edificio d’inverno.
    - title: Guaina bituminosa
      text: Per proteggere i tetti dalla pioggia.
    - title: Un forno a gas
      text: Per la cucina comune.
    - title: Uno scaldabagno
      text: Solare o a legna, per l’acqua calda.
    - title: Un pick-up
      text: Qualcosa come un Mitsubishi L200 — anche di 20 anni va benissimo!
  image: /src/assets/uploads/building-frame-2026.webp
ru:
  title: Поддержать нас
  intro: Evergreen растёт благодаря многим рукам — вот как могут помочь и ваши.
  sections:
  - heading: Спасибо
    text: 'Весной 2025 года земля, в которую мы вложили душу, оказалась под угрозой: за несколько недель нужно было собрать 13 000 €, чтобы сохранить наш лесной дом. Ваша поддержка так тронула нас: сбор позволил сохранить **Поле** и открыл путь вперёд. Спасибо от всего сердца — каждая рука, каждый репост и каждый евро поддерживают жизнь этого убежища.'
    image: /src/assets/uploads/group-hug.webp
  - heading: Подарите материалы и инструменты
    text: Мы строим экодеревню с очень скромными средствами. Хорошие инструменты и б/у материалы очень много значат — посмотрите список ниже. Если вы можете что-то подарить, одолжить или привезти, [свяжитесь с нами](/ru/contact/).
  - heading: Станьте волонтёром
    text: Приезжайте по программе [Европейского корпуса солидарности](/ru/activities/esc-volunteering/), если вам 18–30 лет, или [поживите у нас](/ru/activities/stay-with-us/). Каждая пара рук помогает расти огороду, постройкам и сообществу.
  - heading: Помощь издалека
    text: Вы не рядом? Всегда есть задачи, которые можно делать удалённо, — дизайн, переводы, коммуникация, поиск материалов. Вы также можете стать **амбассадором Evergreen** и помочь сообществу расти.
  - heading: Примите участие в программе
    text: 'Ретриты, мастерские и встречи поддерживают проект: участвуя, вы уже помогаете. Загляните в [календарь](/ru/calendar/).'
  - heading: Расскажите о нас
    text: Подписывайтесь на нас в Instagram и Facebook, делитесь нашими приглашениями для волонтёров и рассказывайте друзьям об Evergreen.
  lists:
  - title: Что нам нужно
    intro: Вещи, которые помогли бы нам прямо сейчас — б/у подойдёт отлично!
    items:
    - title: Качественные инструменты
      text: Особенно бензопила для деревьев, хорошие аккумуляторные шуруповёрты, шурупы и гвозди.
    - title: Небольшой трактор
      text: Чтобы перевозить материалы по участку.
    - title: Двери и окна
      text: Для наших природных построек.
    - title: Строительная древесина
      text: Балки, доски и брус.
    - title: Трубы Ø20
      text: Для водопровода.
    - title: Дровяная печь
      text: Чтобы отапливать дом зимой.
    - title: Рубероид
      text: Чтобы защищать крыши от дождя.
    - title: Газовая духовка
      text: Для общей кухни.
    - title: Водонагреватель
      text: Солнечный или на дровах — для горячей воды.
    - title: Пикап
      text: Что-то вроде Mitsubishi L200 — даже 20-летний вполне подойдёт!
  image: /src/assets/uploads/building-frame-2026.webp
de:
  title: Unterstützen
  intro: Evergreen wächst dank vieler Hände — so können deine helfen.
  sections:
  - heading: Danke
    text: 'Im Frühjahr 2025 war das Land, in das wir unser Herz gesteckt hatten, in Gefahr: Wir brauchten in wenigen Wochen 13.000 €, um unser Zuhause im Wald zu behalten. Eure Unterstützung war so bewegend, dass die Spendenaktion **das Feld** gesichert und uns einen Weg nach vorn eröffnet hat. Danke von Herzen — jede Hand, jedes Teilen und jeder Euro halten diesen Zufluchtsort lebendig.'
    image: /src/assets/uploads/group-hug.webp
  - heading: Material & Werkzeug spenden
    text: Wir bauen ein Ökodorf mit sehr begrenzten Mitteln. Gutes Werkzeug und gebrauchte Materialien machen einen riesigen Unterschied — siehe unsere Wunschliste unten. Wenn du etwas geben, leihen oder transportieren kannst, [melde dich bei uns](/de/contact/).
  - heading: Freiwillig mitmachen
    text: Komm über das [Europäische Solidaritätskorps](/de/activities/esc-volunteering/), wenn du 18–30 bist, oder [bleib eine Weile bei uns](/de/activities/stay-with-us/). Jedes Paar Hände hilft Garten, Gebäuden und Gemeinschaft beim Wachsen.
  - heading: Aus der Ferne helfen
    text: Nicht in der Nähe? Es gibt immer Aufgaben, die man aus der Ferne erledigen kann — Gestaltung, Übersetzung, Kommunikation, Materialsuche. Du kannst auch **Evergreen-Botschafter·in** werden und uns helfen, die Gemeinschaft wachsen zu lassen.
  - heading: An einem Programm teilnehmen
    text: 'Retreats, Workshops und Treffen tragen das Projekt: Wer teilnimmt, unterstützt es schon. Schau in den [Kalender](/de/calendar/).'
  - heading: Weitersagen
    text: Folge uns auf Instagram und Facebook, teile unsere Aufrufe für Freiwillige und erzähl deinen Freund·innen von Evergreen.
  lists:
  - title: Unsere Wunschliste
    intro: Dinge, die uns gerade helfen würden — gebraucht ist perfekt!
    items:
    - title: Gutes Werkzeug
      text: Vor allem eine Motorsäge für Bäume, gute Akkuschrauber, Schrauben und Nägel.
    - title: Ein kleiner Traktor
      text: Um Material über das Gelände zu transportieren.
    - title: Türen & Fenster
      text: Für unsere Naturbauten.
    - title: Bauholz
      text: Balken, Bohlen und Bretter.
    - title: Rohre Ø20
      text: Für die Wasserinstallation.
    - title: Ein Holzofen
      text: Um ein Gebäude im Winter zu heizen.
    - title: Bitumenbahnen
      text: Um Dächer vor Regen zu schützen.
    - title: Ein Gasbackofen
      text: Für die Gemeinschaftsküche.
    - title: Ein Warmwasserboiler
      text: Solar oder holzbefeuert.
    - title: Ein Pick-up
      text: So etwas wie ein Mitsubishi L200 — auch 20 Jahre alt ist völlig in Ordnung!
  image: /src/assets/uploads/building-frame-2026.webp
pt:
  title: Apoie-nos
  intro: O Evergreen cresce graças a muitas mãos — veja como as suas podem ajudar.
  sections:
  - heading: Obrigado
    text: 'Na primavera de 2025 a terra a que dedicámos o coração estava em risco: precisávamos de 13.000 € em poucas semanas para manter a nossa casa na floresta. O vosso apoio foi tão comovente que a campanha garantiu **o Campo** e abriu-nos um caminho. Obrigado do fundo do coração — cada mão, cada partilha e cada euro mantêm vivo este refúgio.'
    image: /src/assets/uploads/group-hug.webp
  - heading: Doe materiais e ferramentas
    text: Estamos a construir uma ecoaldeia com meios muito limitados. Boas ferramentas e materiais em segunda mão fazem uma enorme diferença — veja a lista abaixo. Se puder dar, emprestar ou transportar algo, [contacte-nos](/pt/contact/).
  - heading: Seja voluntário
    text: Junte-se a nós através do [Corpo Europeu de Solidariedade](/pt/activities/esc-volunteering/) se tiver entre 18 e 30 anos, ou [fique connosco](/pt/activities/stay-with-us/). Cada par de mãos ajuda a horta, os edifícios e a comunidade a crescer.
  - heading: Ajudar à distância
    text: Não está perto? Há sempre tarefas para fazer à distância — design, tradução, comunicação, procura de materiais. Também pode tornar-se **embaixador do Evergreen** e ajudar-nos a fazer crescer a comunidade.
  - heading: Participe num programa
    text: 'Retiros, workshops e encontros sustentam o projeto: participar já é uma forma de o apoiar. Veja o [calendário](/pt/calendar/).'
  - heading: Passe a palavra
    text: Siga-nos no Instagram e no Facebook, partilhe as nossas chamadas para voluntários e fale do Evergreen aos seus amigos.
  lists:
  - title: Do que precisamos
    intro: Coisas que nos ajudariam agora — em segunda mão é perfeito!
    items:
