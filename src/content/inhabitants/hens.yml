el:
  kind: animal
  order: 13
  photo: /src/assets/uploads/fresh-eggs.webp
  name: Οι κότες μας
  role: Οι «φτερωτές θεές» μας
  bio: 'Κάθε άνοιξη ξαναρχίζουν να γεννούν: μικρά αλλά ολόφρεσκα αυγά, τα πρώτα δώρα της σεζόν.'
en:
  name: Our hens
  role: Our feathery goddesses
  bio: 'Every spring they start laying again: small but super fresh eggs, the first gifts of the season.'
fr:
  name: Nos poules
  role: Nos déesses à plumes
  bio: 'Chaque printemps, elles se remettent à pondre : des œufs petits mais très frais, premiers cadeaux de la saison.'
es:
  name: Nuestras gallinas
  role: Nuestras diosas emplumadas
  bio: 'Cada primavera vuelven a poner: huevos pequeños pero fresquísimos, los primeros regalos de la temporada.'
it:
  name: Le nostre galline
  role: Le nostre dee piumate
  bio: 'Ogni primavera ricominciano a deporre: uova piccole ma freschissime, i primi doni della stagione.'
ru:
  name: Наши куры
  role: Наши пернатые богини
  bio: 'Каждую весну снова начинают нестись: маленькие, но очень свежие яйца — первые подарки сезона.'
de:
  name: Unsere Hühner
  role: Unsere gefiederten Göttinnen
  bio: 'Jeden Frühling legen sie wieder: kleine, aber ganz frische Eier, die ersten Geschenke der Saison.'
pt:
  name: As nossas galinhas
  role: As nossas deusas de penas
  bio: 'Todas as primaveras voltam a pôr: ovos pequenos mas fresquíssimos, os primeiros presentes da estação.'
