el:
  kind: human
  order: 2
  name: Katerina Zerva
  role: Συνιδρύτρια · δασκάλα γιόγκα
  bio: Δημιούργησε το Evergreen Project μαζί με φίλους της. Διδάσκει στα Evergreen Yoga Studios και στις εκπαιδεύσεις δασκάλων, και μοιράζεται τη γνώση της για τα βότανα και τα φυσικά σαπούνια.
en:
  name: Katerina Zerva
  role: Co-founder · yoga teacher
  bio: She created the Evergreen Project together with friends. She teaches at Evergreen Yoga Studios and in the teacher trainings, and shares her knowledge of wild herbs and natural soap-making.
fr:
  name: Katerina Zerva
  role: Cofondatrice · professeure de yoga
  bio: Elle a créé l’Evergreen Project avec des amis. Elle enseigne à Evergreen Yoga Studios et dans les formations de professeurs, et partage son savoir sur les herbes sauvages et les savons naturels.
es:
  name: Katerina Zerva
  role: Cofundadora · profesora de yoga
  bio: Creó el Evergreen Project junto con unos amigos. Enseña en Evergreen Yoga Studios y en las formaciones de profesores, y comparte su saber sobre hierbas silvestres y jabones naturales.
it:
  name: Katerina Zerva
  role: Cofondatrice · insegnante di yoga
  bio: Ha creato l’Evergreen Project insieme ad alcuni amici. Insegna agli Evergreen Yoga Studios e nelle formazioni insegnanti, e condivide la sua conoscenza delle erbe selvatiche e dei saponi naturali.
ru:
  name: Katerina Zerva
  role: Соосновательница · преподаватель йоги
  bio: Создала Evergreen Project вместе с друзьями. Преподаёт в Evergreen Yoga Studios и на обучении преподавателей, делится знаниями о диких травах и натуральном мыле.
de:
  name: Katerina Zerva
  role: Mitgründerin · Yogalehrerin
  bio: Sie hat das Evergreen Project zusammen mit Freund·innen gegründet. Sie unterrichtet in den Evergreen Yoga Studios und in den Lehrerausbildungen und teilt ihr Wissen über Wildkräuter und Naturseife.
pt:
  name: Katerina Zerva
  role: Cofundadora · professora de yoga
  bio: Criou o Evergreen Project com amigos. Ensina nos Evergreen Yoga Studios e nas formações de professores, e partilha o seu saber sobre ervas silvestres e sabonetes naturais.
