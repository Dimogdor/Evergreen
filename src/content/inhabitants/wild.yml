el:
  kind: animal
  order: 13
  photo: /src/assets/uploads/dusk-gulf.webp
  name: Άγριοι γείτονες
  role: Σπάνια ορατοί, πάντα εδώ
  bio: Αγριογούρουνα, αλεπούδες, πουλιά, έντομα και σαύρες μοιράζονται το δάσος μαζί μας. Πατάμε απαλά για να μπορούν να μένουν.
en:
  name: Wild neighbours
  role: Rarely seen, always there
  bio: Wild boars, foxes, birds, insects and lizards share the forest with us. We tread lightly so that they can stay.
fr:
  name: Voisins sauvages
  role: Rarement vus, toujours là
  bio: Sangliers, renards, oiseaux, insectes et lézards partagent la forêt avec nous. Nous marchons doucement pour qu’ils puissent rester.
es:
  name: Vecinos salvajes
  role: Rara vez vistos, siempre ahí
  bio: Jabalíes, zorros, pájaros, insectos y lagartijas comparten el bosque con nosotros. Pisamos con cuidado para que puedan quedarse.
it:
  name: Vicini selvatici
  role: Raramente visti, sempre presenti
  bio: Cinghiali, volpi, uccelli, insetti e lucertole condividono il bosco con noi. Camminiamo leggeri perché possano restare.
ru:
  name: Дикие соседи
  role: Редко видны, но всегда рядом
  bio: Кабаны, лисы, птицы, насекомые и ящерицы делят с нами лес. Мы ступаем осторожно, чтобы они могли остаться.
de:
  name: Wilde Nachbarn
  role: Selten gesehen, immer da
  bio: Wildschweine, Füchse, Vögel, Insekten und Eidechsen teilen den Wald mit uns. Wir treten leise auf, damit sie bleiben können.
pt:
  name: Vizinhos selvagens
  role: Raramente vistos, sempre presentes
  bio: Javalis, raposas, aves, insetos e lagartixas partilham a floresta connosco. Pisamos com cuidado para que possam ficar.
