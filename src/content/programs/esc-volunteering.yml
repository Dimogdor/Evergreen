  link: https://youth.europa.eu/volunteering/organisation/82546_el
  title: Εθελοντισμός με το Ευρωπαϊκό Σώμα Αλληλεγγύης
  summary: Ζήστε, μάθετε και χτίστε μαζί μας για λίγες εβδομάδες ή αρκετούς μήνες — πλήρως χρηματοδοτούμενα για νέους 18–30 ετών.
  linkLabel: Η σελίδα μας στην Ευρωπαϊκή Πύλη για τη Νεολαία
  facts:
    - label: Για ποιους
      value: Νέοι 18–30 ετών
    - label: Διάρκεια
      value: Από 2 εβδομάδες (ομαδικά προγράμματα) έως αρκετούς μήνες
    - label: Γλώσσα
      value: Αγγλικά (αρκεί βασικό επίπεδο)
    - label: Καλύπτονται
      value: Διατροφή, διαμονή, ταξίδι, χαρτζιλίκι, ασφάλιση
    - label: Πιστοποιητικό
      value: Youthpass
  body: |-
    Το **Ευρωπαϊκό Σώμα Αλληλεγγύης (ESC)** είναι το πρόγραμμα της Ευρωπαϊκής Ένωσης που επιτρέπει σε νέους να συμμετέχουν εθελοντικά σε πρότζεκτ που ωφελούν τις κοινότητες και το περιβάλλον. Το Evergreen Project διαθέτει **Σήμα Ποιότητας ESC** ως φορέας υποδοχής και συντονισμού (έως 31/12/2027), οπότε μπορούμε να φιλοξενούμε εθελοντές από όλη την Ευρώπη.

    ### Τι θα κάνετε
    Οι εθελοντές μας συμμετέχουν στην καθημερινή ζωή και βοηθούν το πρότζεκτ να μεγαλώσει:

    - βιολογική καλλιέργεια με αρχές **περμακουλτούρας**
    - **φυσική δόμηση** με χώμα, πηλό και ξύλο, και ξυλουργική
    - **δασοκομία, αγροδασοπονία και πυροπροστασία** του δάσους
    - βιώσιμη **διαχείριση νερού και απορριμμάτων**
    - μαγείρεμα, φροντίδα των κοινών χώρων και υποδοχή επισκεπτών
    - πρακτικές **γιόγκα και ενσυνείδητης ζωής**, κύκλοι και εργαστήρια

    Δεν χρειάζεται προηγούμενη εμπειρία: το κίνητρο, η περιέργεια και ο σεβασμός για τη φύση και για ανθρώπους από διαφορετικούς πολιτισμούς μετράνε πολύ περισσότερο.

    ### Τι καλύπτει το πρόγραμμα
    - διαμονή στον χώρο — σε σκηνές bell tent τους ζεστούς μήνες, σε σπίτια το υπόλοιπο διάστημα
    - χορτοφαγικά γεύματα, που μαγειρεύουμε μαζί με τοπικά υλικά
    - το ταξίδι σας προς και από την Ελλάδα, με αποζημίωση βάσει των κλιμακίων απόστασης του ESC
    - χαρτζιλίκι, σύμφωνα με τους κανόνες του ESC
    - πλήρη ασφάλιση κατά τη διάρκεια του προγράμματος
    - πιστοποιητικό **Youthpass** που αναγνωρίζει όσα μάθατε

    ### Πώς να κάνετε αίτηση
    1. Δημιουργήστε δωρεάν λογαριασμό στην [Ευρωπαϊκή Πύλη για τη Νεολαία](https://youth.europa.eu/solidarity_el) και εγγραφείτε στο Ευρωπαϊκό Σώμα Αλληλεγγύης.
    2. Βρείτε τα ανοιχτά μας προγράμματα στην πύλη ή στις σελίδες μας στο Instagram και στο Facebook.
    3. Κάντε αίτηση με μια σύντομη συνοδευτική επιστολή στα αγγλικά. Ερωτήσεις; Γράψτε μας όποτε θέλετε.

    ### Προηγούμενα προγράμματα
    - **The Evergreen Project, eco-community kick start** — έξι εθελοντές έζησαν μαζί μας 21 εβδομάδες, από τον Απρίλιο έως τον Σεπτέμβριο του 2024, για να βάλουμε μαζί μπρος την οικοκοινότητα.
    - **Agroforestry and fire protection fundamentals** — ομαδικό εθελοντικό πρόγραμμα δύο εβδομάδων τον Σεπτέμβριο του 2024, για τη φροντίδα του δάσους και την προστασία του από τις πυρκαγιές.
  faq:
    - q: Χρειάζομαι εμπειρία;
      a: Όχι. Μαθαίνουμε κάνοντας, όλοι μαζί. Αυτό που μετράει είναι το κίνητρό σας και ο σεβασμός σας για τη φύση και τους άλλους.
    - q: Πρέπει να μιλάω ελληνικά;
      a: Όχι — τα προγράμματα γίνονται στα αγγλικά και αρκεί βασικό επίπεδο.
    - q: Είμαι πάνω από 30 ή δεν δικαιούμαι ESC. Μπορώ να έρθω;
      a: Ναι! Δείτε το [Μείνετε μαζί μας](/el/activities/stay-with-us/) — μπορείτε να συμμετάσχετε στην κοινοτική ζωή σε οποιαδήποτε ηλικία.
    - q: Πού θα κοιμάμαι;
      a: Σε μεγάλες σκηνές bell tent με κανονικά στρώματα τους ζεστούς μήνες, και σε σπίτια την πιο κρύα περίοδο του χρόνου.
    - q: Πότε είναι τα επόμενα προγράμματα;
      a: Τα προγράμματα ESC έχουν συγκεκριμένες ημερομηνίες. Ανακοινώνουμε κάθε κάλεσμα στο [ημερολόγιό μας](/el/calendar/), στο Instagram και στο Facebook, καθώς και στην Ευρωπαϊκή Πύλη για τη Νεολαία.
en:
  link: https://youth.europa.eu/volunteering/organisation/82546_en
  title: Volunteering with the European Solidarity Corps
  summary: Live, learn and build with us for a few weeks or several months — fully funded for young people aged 18–30.
  linkLabel: Our page on the European Youth Portal
  facts:
    - label: Who
      value: Young people aged 18–30
    - label: Duration
      value: From 2 weeks (team projects) to several months
    - label: Language
      value: English (a basic level is enough)
    - label: Covered
      value: Food, accommodation, travel, pocket money, insurance
    - label: Certificate
      value: Youthpass
  body: |-
    The **European Solidarity Corps (ESC)** is the European Union programme that lets young people volunteer in projects that benefit communities and the environment. The Evergreen Project holds an **ESC Quality Label** as a hosting and lead organisation (valid until 31/12/2027), which means we can welcome volunteers from all over Europe.

    ### What you will do
    Our volunteers take part in daily life and help the project grow:

    - organic gardening following **permaculture** principles
    - **natural building** with earth, cob and wood, and woodworking
    - **forestry, agroforestry and fire protection** of the forest
    - sustainable **water and waste management**
    - cooking, caring for common spaces and welcoming guests
    - **yoga and mindful living** practices, circles and workshops

    No previous experience is needed: motivation, curiosity and respect for nature and for people from different cultures matter much more.

    ### What the programme covers
    - accommodation on the land — in bell tents during the warmer months, in houses the rest of the year
    - vegetarian meals, cooked together with local ingredients
    - your travel to Greece and back, reimbursed according to the ESC distance bands
    - pocket money, according to ESC rules
    - full insurance during the project
    - a **Youthpass** certificate recognising what you have learned

    ### How to apply
    1. Create a free account on the [European Youth Portal](https://youth.europa.eu/solidarity_en) and register for the European Solidarity Corps.
    2. Find our open projects on the portal or on our Instagram and Facebook pages.
    3. Apply with a short motivation letter in English. Questions? Write to us at any time.

    ### Our past projects
    - **The Evergreen Project, eco-community kick start** — six volunteers lived with us for 21 weeks, from April to September 2024, to help launch the eco-community.
    - **Agroforestry and fire protection fundamentals** — a two-week team volunteering project in September 2024 about caring for the forest and protecting it from wildfires.
  faq:
    - q: Do I need experience?
      a: No. We learn by doing, together. What matters is your motivation and your respect for nature and for others.
    - q: Do I need to speak Greek?
      a: No — projects run in English, and a basic level is enough.
    - q: I am over 30 or not eligible for ESC. Can I still come?
      a: Yes! Have a look at [Stay with us](/en/activities/stay-with-us/) — you can join community life at any age.
    - q: Where will I sleep?
      a: In large bell tents with real mattresses during the warmer months, and in houses during the colder part of the year.
    - q: When are the next projects?
      a: ESC projects have fixed dates. We announce every call on our [calendar](/en/calendar/), on Instagram and Facebook, and on the European Youth Portal.
fr:
  link: https://youth.europa.eu/volunteering/organisation/82546_fr
  title: Volontariat avec le Corps européen de solidarité
  summary: Vivez, apprenez et construisez avec nous pendant quelques semaines ou plusieurs mois — entièrement financé pour les 18–30 ans.
  linkLabel: Notre page sur le Portail européen de la jeunesse
  facts:
    - label: Pour qui
      value: Jeunes de 18 à 30 ans
    - label: Durée
      value: De 2 semaines (projets d’équipe) à plusieurs mois
    - label: Langue
      value: Anglais (un niveau de base suffit)
    - label: Pris en charge
      value: Repas, logement, voyage, argent de poche, assurance
    - label: Certificat
      value: Youthpass
  body: |-
    Le **Corps européen de solidarité (CES)** est le programme de l’Union européenne qui permet aux jeunes de s’engager comme volontaires dans des projets utiles aux communautés et à l’environnement. The Evergreen Project détient un **label de qualité CES** en tant qu’organisation d’accueil et coordinatrice (valable jusqu’au 31/12/2027) : nous pouvons donc accueillir des volontaires de toute l’Europe.

    ### Ce que vous ferez
    Nos volontaires participent à la vie quotidienne et aident le projet à grandir :

    - jardinage biologique selon les principes de la **permaculture**
    - **construction naturelle** en terre, bauge et bois, et travail du bois
    - **sylviculture, agroforesterie et protection de la forêt contre les incendies**
    - **gestion durable de l’eau et des déchets**
    - cuisine, entretien des espaces communs et accueil des invités
    - pratiques de **yoga et de pleine conscience**, cercles et ateliers

    Aucune expérience préalable n’est nécessaire : la motivation, la curiosité et le respect de la nature et des personnes d’autres cultures comptent bien davantage.

    ### Ce que couvre le programme
    - le logement sur le terrain — sous tente cloche pendant les mois chauds, en maison le reste de l’année
    - les repas végétariens, cuisinés ensemble avec des produits locaux
    - votre voyage aller-retour vers la Grèce, remboursé selon les tranches de distance du CES
    - l’argent de poche, selon les règles du CES
    - une assurance complète pendant le projet
    - un certificat **Youthpass** qui reconnaît ce que vous avez appris

    ### Comment candidater
    1. Créez un compte gratuit sur le [Portail européen de la jeunesse](https://youth.europa.eu/solidarity_fr) et inscrivez-vous au Corps européen de solidarité.
    2. Trouvez nos projets ouverts sur le portail ou sur nos pages Instagram et Facebook.
    3. Postulez avec une courte lettre de motivation en anglais. Des questions ? Écrivez-nous à tout moment.

    ### Nos projets passés
    - **The Evergreen Project, eco-community kick start** — six volontaires ont vécu avec nous pendant 21 semaines, d’avril à septembre 2024, pour lancer l’écocommunauté.
    - **Agroforestry and fire protection fundamentals** — un projet de volontariat en équipe de deux semaines, en septembre 2024, consacré au soin de la forêt et à sa protection contre les incendies.
  faq:
    - q: Faut-il de l’expérience ?
      a: Non. Nous apprenons en faisant, ensemble. Ce qui compte, c’est votre motivation et votre respect de la nature et des autres.
    - q: Faut-il parler grec ?
      a: Non — les projets se déroulent en anglais, et un niveau de base suffit.
    - q: J’ai plus de 30 ans ou je ne suis pas éligible au CES. Puis-je venir quand même ?
      a: Oui ! Découvrez [Séjourner chez nous](/fr/activities/stay-with-us/) — vous pouvez rejoindre la vie communautaire à tout âge.
    - q: Où vais-je dormir ?
      a: Dans de grandes tentes cloches avec de vrais matelas pendant les mois chauds, et en maison pendant la partie la plus froide de l’année.
    - q: Quand ont lieu les prochains projets ?
      a: Les projets CES ont des dates fixes. Nous annonçons chaque appel dans notre [calendrier](/fr/calendar/), sur Instagram et Facebook, ainsi que sur le Portail européen de la jeunesse.
es:
  link: https://youth.europa.eu/volunteering/organisation/82546_es
  title: Voluntariado con el Cuerpo Europeo de Solidaridad
  summary: Vive, aprende y construye con nosotros durante unas semanas o varios meses — totalmente financiado para jóvenes de 18 a 30 años.
  linkLabel: Nuestra página en el Portal Europeo de la Juventud
  facts:
    - label: Para quién
      value: Jóvenes de 18 a 30 años
    - label: Duración
      value: De 2 semanas (proyectos de equipo) a varios meses
    - label: Idioma
      value: Inglés (basta un nivel básico)
    - label: Cubierto
      value: Comida, alojamiento, viaje, dinero de bolsillo, seguro
    - label: Certificado
      value: Youthpass
  body: |-
    El **Cuerpo Europeo de Solidaridad (CES)** es el programa de la Unión Europea que permite a los jóvenes hacer voluntariado en proyectos que benefician a las comunidades y al medio ambiente. The Evergreen Project cuenta con el **Sello de Calidad del CES** como organización de acogida y coordinadora (válido hasta el 31/12/2027), así que podemos recibir voluntarios de toda Europa.

    ### Qué harás
    Nuestros voluntarios participan en la vida diaria y ayudan a que el proyecto crezca:

    - huerta ecológica con principios de **permacultura**
    - **bioconstrucción** con tierra, cob y madera, y carpintería
    - **silvicultura, agroforestería y prevención de incendios** en el bosque
    - **gestión sostenible del agua y de los residuos**
    - cocina, cuidado de los espacios comunes y acogida de visitantes
    - prácticas de **yoga y vida consciente**, círculos y talleres

    No se necesita experiencia previa: la motivación, la curiosidad y el respeto por la naturaleza y por personas de otras culturas cuentan mucho más.

    ### Qué cubre el programa
    - alojamiento en el terreno — en tiendas campana durante los meses cálidos, en casas el resto del año
    - comidas vegetarianas, cocinadas juntos con ingredientes locales
    - tu viaje de ida y vuelta a Grecia, reembolsado según las franjas de distancia del CES
    - dinero de bolsillo, según las normas del CES
    - seguro completo durante el proyecto
    - un certificado **Youthpass** que reconoce lo que has aprendido

    ### Cómo inscribirte
    1. Crea una cuenta gratuita en el [Portal Europeo de la Juventud](https://youth.europa.eu/solidarity_es) y regístrate en el Cuerpo Europeo de Solidaridad.
    2. Encuentra nuestros proyectos abiertos en el portal o en nuestras páginas de Instagram y Facebook.
    3. Inscríbete con una breve carta de motivación en inglés. ¿Dudas? Escríbenos cuando quieras.

    ### Nuestros proyectos anteriores
    - **The Evergreen Project, eco-community kick start** — seis voluntarios vivieron con nosotros durante 21 semanas, de abril a septiembre de 2024, para poner en marcha la ecocomunidad.
    - **Agroforestry and fire protection fundamentals** — un proyecto de voluntariado en equipo de dos semanas, en septiembre de 2024, sobre el cuidado del bosque y su protección frente a los incendios.
  faq:
    - q: ¿Necesito experiencia?
      a: No. Aprendemos haciendo, juntos. Lo que importa es tu motivación y tu respeto por la naturaleza y por los demás.
    - q: ¿Tengo que hablar griego?
      a: No — los proyectos son en inglés y basta con un nivel básico.
    - q: Tengo más de 30 años o no puedo participar en el CES. ¿Puedo ir igualmente?
      a: ¡Sí! Echa un vistazo a [Quédate con nosotros](/es/activities/stay-with-us/) — puedes unirte a la vida comunitaria a cualquier edad.
    - q: ¿Dónde dormiré?
      a: En grandes tiendas campana con colchones de verdad durante los meses cálidos, y en casas durante la parte más fría del año.
    - q: ¿Cuándo son los próximos proyectos?
      a: Los proyectos del CES tienen fechas fijas. Anunciamos cada convocatoria en nuestro [calendario](/es/calendar/), en Instagram y Facebook, y en el Portal Europeo de la Juventud.
it:
  link: https://youth.europa.eu/volunteering/organisation/82546_it
  title: Volontariato con il Corpo europeo di solidarietà
  summary: Vivi, impara e costruisci con noi per qualche settimana o per diversi mesi — completamente finanziato per i giovani tra i 18 e i 30 anni.
  linkLabel: La nostra pagina sul Portale europeo per i giovani
  facts:
    - label: Per chi
      value: Giovani tra i 18 e i 30 anni
    - label: Durata
      value: Da 2 settimane (progetti di gruppo) a diversi mesi
    - label: Lingua
      value: Inglese (basta un livello di base)
    - label: Coperto
      value: Vitto, alloggio, viaggio, pocket money, assicurazione
    - label: Certificato
      value: Youthpass
  body: |-
    Il **Corpo europeo di solidarietà (CES)** è il programma dell’Unione europea che permette ai giovani di fare volontariato in progetti utili alle comunità e all’ambiente. The Evergreen Project ha il **Marchio di qualità CES** come organizzazione ospitante e capofila (valido fino al 31/12/2027): possiamo quindi accogliere volontari da tutta Europa.

    ### Cosa farai
    I nostri volontari partecipano alla vita quotidiana e aiutano il progetto a crescere:

    - orto biologico secondo i principi della **permacultura**
    - **bioedilizia** con terra, cob e legno, e falegnameria
    - **selvicoltura, agroforestazione e prevenzione degli incendi** nel bosco
    - **gestione sostenibile dell’acqua e dei rifiuti**
    - cucina, cura degli spazi comuni e accoglienza degli ospiti
    - pratiche di **yoga e vita consapevole**, cerchi e workshop

    Non serve esperienza: motivazione, curiosità e rispetto per la natura e per persone di culture diverse contano molto di più.

    ### Cosa copre il programma
    - alloggio sul terreno — in tende a campana nei mesi caldi, in casa nel resto dell’anno
    - pasti vegetariani, cucinati insieme con ingredienti locali
    - il viaggio di andata e ritorno in Grecia, rimborsato secondo le fasce di distanza del CES
    - pocket money, secondo le regole del CES
    - assicurazione completa durante il progetto
    - un certificato **Youthpass** che riconosce ciò che hai imparato

    ### Come candidarsi
    1. Crea un account gratuito sul [Portale europeo per i giovani](https://youth.europa.eu/solidarity_it) e registrati al Corpo europeo di solidarietà.
    2. Trova i nostri progetti aperti sul portale o sulle nostre pagine Instagram e Facebook.
    3. Candidati con una breve lettera motivazionale in inglese. Domande? Scrivici quando vuoi.

    ### I nostri progetti passati
    - **The Evergreen Project, eco-community kick start** — sei volontari hanno vissuto con noi per 21 settimane, da aprile a settembre 2024, per avviare l’ecocomunità.
    - **Agroforestry and fire protection fundamentals** — un progetto di volontariato di gruppo di due settimane, a settembre 2024, dedicato alla cura del bosco e alla sua protezione dagli incendi.
  faq:
    - q: Serve esperienza?
      a: No. Impariamo facendo, insieme. Conta la tua motivazione e il tuo rispetto per la natura e per gli altri.
    - q: Devo parlare greco?
      a: No — i progetti si svolgono in inglese e basta un livello di base.
    - q: Ho più di 30 anni o non posso partecipare al CES. Posso venire lo stesso?
      a: Sì! Dai un’occhiata a [Stai con noi](/it/activities/stay-with-us/) — puoi unirti alla vita della comunità a qualsiasi età.
    - q: Dove dormirò?
      a: In grandi tende a campana con veri materassi nei mesi caldi, e in casa nella parte più fredda dell’anno.
    - q: Quando sono i prossimi progetti?
      a: I progetti CES hanno date fisse. Annunciamo ogni chiamata nel nostro [calendario](/it/calendar/), su Instagram e Facebook e sul Portale europeo per i giovani.
ru:
  link: https://youth.europa.eu/volunteering/organisation/82546_en
  title: Волонтёрство с Европейским корпусом солидарности
  summary: Живите, учитесь и стройте вместе с нами несколько недель или месяцев — полностью оплачивается для молодёжи 18–30 лет.
  linkLabel: Наша страница на Европейском молодёжном портале
  facts:
    - label: Для кого
      value: Молодёжь 18–30 лет
    - label: Длительность
      value: От 2 недель (командные проекты) до нескольких месяцев
    - label: Язык
      value: Английский (достаточно базового уровня)
    - label: Оплачивается
      value: Питание, проживание, дорога, карманные деньги, страховка
    - label: Сертификат
      value: Youthpass
  body: |-
    **Европейский корпус солидарности (ESC)** — программа Европейского союза, которая даёт молодым людям возможность участвовать волонтёрами в проектах на благо сообществ и окружающей среды. The Evergreen Project имеет **знак качества ESC** как принимающая и координирующая организация (действует до 31.12.2027), поэтому мы можем принимать волонтёров со всей Европы.

    ### Чем вы будете заниматься
    Наши волонтёры участвуют в повседневной жизни и помогают проекту расти:

    - органическое садоводство по принципам **пермакультуры**
    - **природное строительство** из земли, глины (cob) и дерева, работа с деревом
    - **лесоводство, агролесоводство и защита леса от пожаров**
    - устойчивое **управление водой и отходами**
    - готовка, уход за общими пространствами и встреча гостей
    - практики **йоги и осознанной жизни**, круги и мастерские

    Предыдущий опыт не нужен: мотивация, любознательность и уважение к природе и к людям из разных культур гораздо важнее.

    ### Что оплачивает программа
    - проживание на участке — в шатрах-колоколах в тёплые месяцы и в домах в остальное время
    - вегетарианское питание, которое мы готовим вместе из местных продуктов
    - дорогу в Грецию и обратно — компенсация по тарифам ESC в зависимости от расстояния
    - карманные деньги по правилам ESC
    - полную страховку на время проекта
    - сертификат **Youthpass**, подтверждающий то, чему вы научились

    ### Как подать заявку
    1. Создайте бесплатный аккаунт на [Европейском молодёжном портале](https://youth.europa.eu/solidarity_en) и зарегистрируйтесь в Европейском корпусе солидарности.
    2. Найдите наши открытые проекты на портале или на наших страницах в Instagram и Facebook.
    3. Подайте заявку с коротким мотивационным письмом на английском. Есть вопросы? Пишите нам в любое время.

    ### Наши прошлые проекты
    - **The Evergreen Project, eco-community kick start** — шесть волонтёров жили с нами 21 неделю, с апреля по сентябрь 2024 года, чтобы запустить экосообщество.
    - **Agroforestry and fire protection fundamentals** — двухнедельный командный волонтёрский проект в сентябре 2024 года о заботе о лесе и его защите от пожаров.
  faq:
    - q: Нужен ли опыт?
      a: Нет. Мы учимся на практике, вместе. Важны ваша мотивация и уважение к природе и другим людям.
    - q: Нужно ли говорить по-гречески?
      a: Нет — проекты проходят на английском, достаточно базового уровня.
    - q: Мне больше 30 или я не могу участвовать в ESC. Можно ли всё равно приехать?
      a: Да! Посмотрите раздел [Поживите у нас](/ru/activities/stay-with-us/) — присоединиться к жизни сообщества можно в любом возрасте.
    - q: Где я буду жить?
      a: В тёплые месяцы — в больших шатрах-колоколах с настоящими матрасами, в холодное время года — в домах.
    - q: Когда следующие проекты?
      a: У проектов ESC фиксированные даты. Мы объявляем каждый набор в нашем [календаре](/ru/calendar/), в Instagram и Facebook, а также на Европейском молодёжном портале.
de:
  link: https://youth.europa.eu/volunteering/organisation/82546_de
  title: Freiwilligendienst im Europäischen Solidaritätskorps
  summary: Lebe, lerne und baue mit uns für einige Wochen oder mehrere Monate — voll finanziert für junge Menschen zwischen 18 und 30.
  linkLabel: Unsere Seite im Europäischen Jugendportal
  facts:
    - label: Für wen
      value: Junge Menschen von 18 bis 30
    - label: Dauer
      value: Von 2 Wochen (Teamprojekte) bis zu mehreren Monaten
    - label: Sprache
      value: Englisch (Grundkenntnisse reichen)
    - label: Abgedeckt
      value: Verpflegung, Unterkunft, Reise, Taschengeld, Versicherung
    - label: Zertifikat
      value: Youthpass
  body: |-
    Das **Europäische Solidaritätskorps (ESK)** ist das Programm der Europäischen Union, mit dem sich junge Menschen in Projekten für Gemeinschaften und Umwelt engagieren können. The Evergreen Project besitzt das **ESK-Qualitätssiegel** als Aufnahme- und koordinierende Organisation (gültig bis 31.12.2027) — wir können also Freiwillige aus ganz Europa aufnehmen.

    ### Was du tun wirst
    Unsere Freiwilligen nehmen am Alltag teil und helfen dem Projekt zu wachsen:

    - biologischer Gartenbau nach **Permakultur**-Prinzipien
    - **Naturbau** mit Erde, Cob und Holz sowie Holzarbeit
    - **Forstwirtschaft, Agroforst und Brandschutz** im Wald
    - nachhaltiges **Wasser- und Abfallmanagement**
    - Kochen, Pflege der Gemeinschaftsräume und Empfang von Gästen
    - **Yoga und achtsames Leben**, Kreise und Workshops

    Vorerfahrung ist nicht nötig: Motivation, Neugier und Respekt vor der Natur und vor Menschen aus anderen Kulturen zählen viel mehr.

    ### Was das Programm abdeckt
    - Unterkunft auf dem Gelände — in den warmen Monaten in Glockenzelten, den Rest des Jahres in Häusern
    - vegetarische Mahlzeiten, gemeinsam mit regionalen Zutaten gekocht
    - deine Hin- und Rückreise nach Griechenland, erstattet nach den Entfernungsstufen des ESK
    - Taschengeld nach den Regeln des ESK
    - umfassende Versicherung während des Projekts
    - ein **Youthpass**-Zertifikat, das dein Gelerntes anerkennt

    ### So bewirbst du dich
    1. Lege ein kostenloses Konto im [Europäischen Jugendportal](https://youth.europa.eu/solidarity_de) an und registriere dich für das Europäische Solidaritätskorps.
    2. Finde unsere offenen Projekte im Portal oder auf unseren Instagram- und Facebook-Seiten.
    3. Bewirb dich mit einem kurzen Motivationsschreiben auf Englisch. Fragen? Schreib uns jederzeit.

    ### Unsere bisherigen Projekte
    - **The Evergreen Project, eco-community kick start** — sechs Freiwillige lebten 21 Wochen bei uns, von April bis September 2024, um die Ökogemeinschaft auf den Weg zu bringen.
    - **Agroforestry and fire protection fundamentals** — ein zweiwöchiges Team-Freiwilligenprojekt im September 2024 über die Pflege des Waldes und seinen Schutz vor Bränden.
  faq:
    - q: Brauche ich Erfahrung?
      a: Nein. Wir lernen durch Tun, gemeinsam. Wichtig sind deine Motivation und dein Respekt vor der Natur und den anderen.
    - q: Muss ich Griechisch sprechen?
      a: Nein — die Projekte laufen auf Englisch, Grundkenntnisse reichen.
    - q: Ich bin über 30 oder nicht für das ESK berechtigt. Kann ich trotzdem kommen?
      a: Ja! Schau dir [Bleib bei uns](/de/activities/stay-with-us/) an — am Gemeinschaftsleben kannst du in jedem Alter teilnehmen.
    - q: Wo werde ich schlafen?
      a: In den warmen Monaten in großen Glockenzelten mit richtigen Matratzen, in der kälteren Jahreszeit in Häusern.
    - q: Wann sind die nächsten Projekte?
      a: ESK-Projekte haben feste Termine. Wir kündigen jeden Aufruf in unserem [Kalender](/de/calendar/), auf Instagram und Facebook sowie im Europäischen Jugendportal an.
pt:
  link: https://youth.europa.eu/volunteering/organisation/82546_pt
  title: Voluntariado com o Corpo Europeu de Solidariedade
  summary: Viva, aprenda e construa connosco durante algumas semanas ou vários meses — totalmente financiado para jovens dos 18 aos 30 anos.
  linkLabel: A nossa página no Portal Europeu da Juventude
  facts:
    - label: Para quem
      value: Jovens dos 18 aos 30 anos
    - label: Duração
      value: De 2 semanas (projetos de equipa) a vários meses
    - label: Língua
      value: Inglês (basta um nível básico)
    - label: Coberto
      value: Alimentação, alojamento, viagem, dinheiro de bolso, seguro
    - label: Certificado
      value: Youthpass
  body: |-
    O **Corpo Europeu de Solidariedade (CES)** é o programa da União Europeia que permite aos jovens fazer voluntariado em projetos que beneficiam as comunidades e o ambiente. The Evergreen Project tem o **Selo de Qualidade do CES** como organização de acolhimento e coordenadora (válido até 31/12/2027), por isso podemos receber voluntários de toda a Europa.

    ### O que vai fazer
    Os nossos voluntários participam na vida quotidiana e ajudam o projeto a crescer:

    - horta biológica segundo os princípios da **permacultura**
    - **bioconstrução** com terra, cob e madeira, e carpintaria
    - **silvicultura, agrofloresta e proteção da floresta contra incêndios**
    - **gestão sustentável da água e dos resíduos**
    - cozinha, cuidado dos espaços comuns e acolhimento de visitantes
    - práticas de **yoga e vida consciente**, círculos e workshops

    Não é preciso experiência prévia: a motivação, a curiosidade e o respeito pela natureza e por pessoas de outras culturas contam muito mais.

    ### O que o programa cobre
    - alojamento no terreno — em tendas sino nos meses quentes e em casas no resto do ano
    - refeições vegetarianas, cozinhadas em conjunto com ingredientes locais
    - a sua viagem de ida e volta à Grécia, reembolsada segundo os escalões de distância do CES
    - dinheiro de bolso, segundo as regras do CES
    - seguro completo durante o projeto
    - um certificado **Youthpass** que reconhece o que aprendeu

    ### Como se candidatar
    1. Crie uma conta gratuita no [Portal Europeu da Juventude](https://youth.europa.eu/solidarity_pt) e registe-se no Corpo Europeu de Solidariedade.
    2. Encontre os nossos projetos abertos no portal ou nas nossas páginas de Instagram e Facebook.
    3. Candidate-se com uma breve carta de motivação em inglês. Dúvidas? Escreva-nos quando quiser.

    ### Os nossos projetos anteriores
    - **The Evergreen Project, eco-community kick start** — seis voluntários viveram connosco durante 21 semanas, de abril a setembro de 2024, para lançar a ecocomunidade.
    - **Agroforestry and fire protection fundamentals** — um projeto de voluntariado em equipa de duas semanas, em setembro de 2024, sobre o cuidado da floresta e a sua proteção contra incêndios.
  faq:
    - q: Preciso de experiência?
      a: Não. Aprendemos fazendo, juntos. O que conta é a sua motivação e o seu respeito pela natureza e pelos outros.
    - q: Tenho de falar grego?
      a: Não — os projetos decorrem em inglês e basta um nível básico.
    - q: Tenho mais de 30 anos ou não sou elegível para o CES. Posso ir na mesma?
      a: Sim! Veja [Fique connosco](/pt/activities/stay-with-us/) — pode juntar-se à vida comunitária em qualquer idade.
    - q: Onde vou dormir?
      a: Em grandes tendas sino com colchões a sério nos meses quentes, e em casas na parte mais fria do ano.
    - q: Quando são os próximos projetos?
      a: Os projetos do CES têm datas fixas. Anunciamos cada chamada no nosso [calendário](/pt/calendar/), no Instagram e no Facebook, e no Portal Europeu da Juventude.
