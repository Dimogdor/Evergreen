  title: Εθελοντισμός με το Ευρωπαϊκό Σώμα Αλληλεγγύης
  summary: Ζήστε, μάθετε και χτίστε μαζί μας για λίγες εβδομάδες ή αρκετούς μήνες — πλήρως χρηματοδοτούμενα για νέους 18–30 ετών.
  linkLabel: Η σελίδα μας στην Ευρωπαϊκή Πύλη για τη Νεολαία
  facts:
  - label: Για ποιους
    value: 18–30 ετών, με νόμιμη διαμονή στην ΕΕ
  - label: Διάρκεια
    value: 25 μέρες (ESC Teams) έως 3–6 μήνες
  - label: Γλώσσα
    value: Αγγλικά (αρκεί βασικό επίπεδο)
  - label: Καλύπτονται
    value: Διατροφή, διαμονή, ταξίδι, χαρτζιλίκι, ασφάλιση
  - label: Πιστοποιητικό
    value: Youthpass
  body: |-
    Το **Ευρωπαϊκό Σώμα Αλληλεγγύης (ESC)** είναι το πρόγραμμα της Ευρωπαϊκής Ένωσης που επιτρέπει σε νέους να συμμετέχουν εθελοντικά σε πρότζεκτ που ωφελούν τις κοινότητες και το περιβάλλον. Το Evergreen Project διαθέτει **Σήμα Ποιότητας ESC** ως φορέας υποδοχής και συντονισμού (έως 31/12/2027) και υποδέχεται εθελοντές από όλη την Ευρώπη αρκετές φορές τον χρόνο, με την υποστήριξη του ΙΝΕΔΙΒΙΜ.

    ### Τα προγράμματα του 2026
    - **ESC Teams — Build with Earth & Wood** (15 Οκτωβρίου – 8 Νοεμβρίου 2026): 25 μέρες φυσικής δόμησης με ξύλο, πηλό και χώμα για τη νέα χειμερινή μας σάλα — και κλείσιμο της καλοκαιρινής σεζόν όλοι μαζί.
    - **Ατομικός εθελοντισμός** (4 Σεπτεμβρίου – 13 Δεκεμβρίου 2026): τρεις εθελοντές ζουν μαζί μας για τουλάχιστον τρεις μήνες.

    ### Τι θα κάνετε
    - φυσική δόμηση με χώμα, ξύλο και άχυρο, και βασική ξυλουργική
    - κηπουρική, αγροδασοπονία και αναγεννητικές πρακτικές γης, φροντίδα των μονοπατιών του Καλλιδρόμου
    - υποστήριξη ρητρίτ γιόγκα, εκπαιδεύσεων δασκάλων και γιορτών της κοινότητας
    - φυτική μαγειρική, κοινές ευθύνες και αυτοοργάνωση
    - γιόγκα, ενσυνειδητότητα και κύκλοι μοιράσματος

    Ο ρυθμός είναι 30–38 ώρες την εβδομάδα, ευέλικτος και εποχικός, συν 2 ρεπό τον μήνα. Δεν χρειάζεται εμπειρία — και ενθαρρύνουμε ιδιαίτερα νέους με λιγότερες ευκαιρίες να κάνουν αίτηση: θα υπάρξει υποστήριξη.

    ### Πού θα μείνετε
    Στο δάσος — στο σπίτι μας από πηλό, σε σκηνές bell tent ή σε κοινόχρηστους οικολογικούς χώρους. Το χωριό Ανάβρα απέχει 15 λεπτά με τα πόδια και εκεί υπάρχει ένα μεγάλο κοινοτικό σπίτι όπου ζούμε τον χειμώνα.

    ### Τι καλύπτει το πρόγραμμα
    - διαμονή και χορτοφαγικά γεύματα
    - χαρτζιλίκι
    - το ταξίδι προς και από την Ελλάδα, σύμφωνα με τους κανόνες του ESC
    - πλήρη ασφάλιση
    - καθοδήγηση (mentoring) και εκπαίδευση σε όλη τη διάρκεια
    - μαθήματα γιόγκα και μικρά σεμινάρια ταϊλανδέζικου μασάζ
    - πιστοποιητικό **Youthpass**

    ### Πώς να κάνετε αίτηση
    Δημοσιεύουμε κάθε κάλεσμα, μαζί με τη φόρμα αίτησης, στο [ημερολόγιό μας](/el/calendar/), στο Instagram και στο Facebook. Πρέπει να είστε 18–30 ετών και να διαμένετε νόμιμα σε χώρα της ΕΕ. Ερωτήσεις; Γράψτε μας όποτε θέλετε.

    ### Τα προγράμματά μας μέχρι σήμερα
    - **Eco-community kick start** (Απρίλιος–Σεπτέμβριος 2024) — έξι εθελοντές για 21 εβδομάδες
    - **Agroforestry and fire protection fundamentals** (Σεπτέμβριος 2024) — ομαδικό πρόγραμμα δύο εβδομάδων
    - **Together with Nature – Daily Acts of Sustainability** (2025) — οκτώ εθελοντές έζησαν και έχτισαν μαζί μας
    - **Ατομικός εθελοντισμός** (2026) — οι εθελόντριές μας από την Τσεχία και την Ιταλία έμειναν πέντε και έξι μήνες… και αγάπησαν τόσο την κοινότητα που μετακόμισαν στην Αθήνα για να μείνουν κοντά της
    - **Build with Earth & Wood** (φθινόπωρο 2026) — ESC Teams
  faq:
  - q: Χρειάζομαι εμπειρία;
    a: Όχι. Μαθαίνουμε κάνοντας, όλοι μαζί. Αυτό που μετράει είναι το κίνητρό σας και ο σεβασμός σας για τη φύση και τους άλλους.
  - q: Ποιος είναι ο ρυθμός δουλειάς;
    a: 30–38 ώρες την εβδομάδα, ευέλικτα και εποχικά, συν 2 ρεπό τον μήνα.
  - q: Πρέπει να μιλάω ελληνικά;
    a: Όχι — τα προγράμματα γίνονται στα αγγλικά και αρκεί βασικό επίπεδο.
  - q: Είμαι πάνω από 30 ή δεν δικαιούμαι ESC. Μπορώ να έρθω;
    a: Ναι! Δείτε το [Μείνετε μαζί μας](/el/activities/stay-with-us/) — μπορείτε να συμμετάσχετε στην κοινοτική ζωή σε οποιαδήποτε ηλικία.
  - q: Πού θα κοιμάμαι;
    a: Σε μεγάλες σκηνές bell tent με κανονικά στρώματα τους ζεστούς μήνες, και σε σπίτια την πιο κρύα περίοδο του χρόνου.
  - q: Πότε είναι τα επόμενα προγράμματα;
    a: Τα προγράμματα ESC έχουν συγκεκριμένες ημερομηνίες. Ανακοινώνουμε κάθε κάλεσμα στο [ημερολόγιό μας](/el/calendar/), στο Instagram και στο Facebook, καθώς και στην Ευρωπαϊκή Πύλη για τη Νεολαία.
en:
  link: https://youth.europa.eu/volunteering/organisation/82546_en
  title: Volunteering with the European Solidarity Corps
  summary: Live, learn and build with us for a few weeks or several months — fully funded for young people aged 18–30.
  linkLabel: Our page on the European Youth Portal
  facts:
  - label: Who
    value: 18–30, legally residing in the EU
  - label: Duration
    value: 25 days (ESC Teams) to 3–6 months
  - label: Language
    value: English (a basic level is enough)
  - label: Covered
    value: Food, accommodation, travel, pocket money, insurance
  - label: Certificate
    value: Youthpass
  body: |-
    The **European Solidarity Corps (ESC)** is the European Union programme that lets young people volunteer in projects that benefit communities and the environment. The Evergreen Project holds an **ESC Quality Label** as a hosting and lead organisation (valid until 31/12/2027) and welcomes volunteers from all over Europe several times a year, with the support of INEDIVIM, the Greek national agency.

    ### Projects in 2026
    - **ESC Teams — Build with Earth & Wood** (15 October – 8 November 2026): 25 days of natural building with wood, cob and earth to create our new winter shala — and closing the summer season together.
    - **Individual volunteering** (4 September – 13 December 2026): three volunteers living with us for at least three months.

    ### What you will do
    - natural building with earth, wood and straw, and basic woodworking
    - gardening, agroforestry and regenerative land practices, caring for the trails of Kallidromo
    - supporting yoga retreats, teacher trainings and community gatherings
    - plant-based cooking, shared responsibilities and self-organisation
    - yoga, mindfulness and sharing circles

    The rhythm is 30–38 hours a week, flexible and seasonal, plus 2 days off per month. No previous experience is needed — and we especially encourage young people with fewer opportunities to apply: support will be provided.

    ### Where you will live
    In the forest — in our cob house, in bell tents or in shared eco-living spaces. The village of Anavra is a 15-minute walk away, with a large community house where we live in winter.

    ### What the programme covers
    - accommodation and vegetarian meals
    - pocket money
    - travel to Greece and back, reimbursed according to ESC rules
    - full insurance
    - mentoring and training throughout the project
    - yoga classes and Thai massage mini-courses
    - a **Youthpass** certificate

    ### How to apply
    We publish every call, with its application form, on our [calendar](/en/calendar/) and on Instagram and Facebook. You must be 18–30 and legally residing in an EU country. Questions? Write to us at any time.

    ### Our projects so far
    - **Eco-community kick start** (April–September 2024) — six volunteers for 21 weeks
    - **Agroforestry and fire protection fundamentals** (September 2024) — a two-week team project
    - **Together with Nature – Daily Acts of Sustainability** (2025) — eight volunteers living and building with us
    - **Individual volunteering** (2026) — our volunteers from Czechia and Italy stayed five and six months… and loved the community so much that they moved to Athens to stay close to it
    - **Build with Earth & Wood** (autumn 2026) — ESC Teams
  faq:
  - q: Do I need experience?
    a: No. We learn by doing, together. What matters is your motivation and your respect for nature and for others.
  - q: What is the working rhythm?
    a: 30–38 hours a week, flexible and seasonal, plus 2 days off per month.
  - q: Do I need to speak Greek?
    a: No — projects run in English, and a basic level is enough.
  - q: I am over 30 or not eligible for ESC. Can I still come?
    a: Yes! Have a look at [Stay with us](/en/activities/stay-with-us/) — you can join community life at any age.
  - q: Where will I sleep?
    a: In large bell tents with real mattresses during the warmer months, and in houses during the colder part of the year.
  - q: When are the next projects?
    a: ESC projects have fixed dates. We announce every call on our [calendar](/en/calendar/), on Instagram and Facebook, and on the European Youth Portal.
fr:
  link: https://youth.europa.eu/volunteering/organisation/82546_fr
  title: Volontariat avec le Corps européen de solidarité
  summary: Vivez, apprenez et construisez avec nous pendant quelques semaines ou plusieurs mois — entièrement financé pour les 18–30 ans.
  linkLabel: Notre page sur le Portail européen de la jeunesse
  facts:
  - label: Pour qui
    value: 18–30 ans, résidant légalement dans l’UE
  - label: Durée
    value: 25 jours (ESC Teams) à 3–6 mois
  - label: Langue
    value: Anglais (un niveau de base suffit)
  - label: Pris en charge
    value: Repas, logement, voyage, argent de poche, assurance
  - label: Certificat
    value: Youthpass
  body: |-
    Le **Corps européen de solidarité (CES)** est le programme de l’Union européenne qui permet aux jeunes de s’engager comme volontaires dans des projets utiles aux communautés et à l’environnement. The Evergreen Project détient un **label de qualité CES** comme organisation d’accueil et coordinatrice (valable jusqu’au 31/12/2027) et accueille des volontaires de toute l’Europe plusieurs fois par an, avec le soutien de l’INEDIVIM, l’agence nationale grecque.

    ### Les projets 2026
    - **ESC Teams — Build with Earth & Wood** (15 octobre – 8 novembre 2026) : 25 jours de construction naturelle en bois, bauge et terre pour créer notre nouvelle shala d’hiver — et clôturer ensemble la saison d’été.
    - **Volontariat individuel** (4 septembre – 13 décembre 2026) : trois volontaires vivent avec nous pendant au moins trois mois.

    ### Ce que vous ferez
    - construction naturelle en terre, bois et paille, et travail du bois de base
    - jardinage, agroforesterie et pratiques régénératives, entretien des sentiers du Kallidromo
    - soutien aux retraites de yoga, formations de professeurs et rassemblements
    - cuisine végétale, responsabilités partagées et auto-organisation
    - yoga, pleine conscience et cercles de partage

    Le rythme est de 30 à 38 heures par semaine, souple et saisonnier, plus 2 jours de congé par mois. Aucune expérience n’est requise — et nous encourageons particulièrement les jeunes ayant moins d’opportunités à postuler : un accompagnement est prévu.

    ### Où vous vivrez
    Dans la forêt — dans notre maison en bauge, sous tente cloche ou dans des espaces de vie écologiques partagés. Le village d’Anavra est à 15 minutes à pied, avec une grande maison communautaire où nous vivons l’hiver.

    ### Ce que couvre le programme
    - le logement et les repas végétariens
    - l’argent de poche
    - le voyage aller-retour vers la Grèce, remboursé selon les règles du CES
    - une assurance complète
    - un mentorat et des formations tout au long du projet
    - des cours de yoga et des mini-formations de massage thaï
    - un certificat **Youthpass**

    ### Comment candidater
    Nous publions chaque appel, avec son formulaire, dans notre [calendrier](/fr/calendar/) et sur Instagram et Facebook. Il faut avoir 18 à 30 ans et résider légalement dans un pays de l’UE. Des questions ? Écrivez-nous à tout moment.

    ### Nos projets jusqu’ici
    - **Eco-community kick start** (avril–septembre 2024) — six volontaires pendant 21 semaines
    - **Agroforestry and fire protection fundamentals** (septembre 2024) — un projet d’équipe de deux semaines
    - **Together with Nature – Daily Acts of Sustainability** (2025) — huit volontaires ont vécu et construit avec nous
    - **Volontariat individuel** (2026) — nos volontaires venues de Tchéquie et d’Italie sont restées cinq et six mois… et ont tellement aimé la communauté qu’elles ont déménagé à Athènes pour rester proches d’elle
    - **Build with Earth & Wood** (automne 2026) — ESC Teams
  faq:
  - q: Faut-il de l’expérience ?
    a: Non. Nous apprenons en faisant, ensemble. Ce qui compte, c’est votre motivation et votre respect de la nature et des autres.
  - q: Quel est le rythme de travail ?
    a: 30 à 38 heures par semaine, de façon souple et saisonnière, plus 2 jours de congé par mois.
  - q: Faut-il parler grec ?
    a: Non — les projets se déroulent en anglais, et un niveau de base suffit.
  - q: J’ai plus de 30 ans ou je ne suis pas éligible au CES. Puis-je venir quand même ?
    a: Oui ! Découvrez [Séjourner chez nous](/fr/activities/stay-with-us/) — vous pouvez rejoindre la vie communautaire à tout âge.
  - q: Où vais-je dormir ?
    a: Dans de grandes tentes cloches avec de vrais matelas pendant les mois chauds, et en maison pendant la partie la plus froide de l’année.
  - q: Quand ont lieu les prochains projets ?
    a: Les projets CES ont des dates fixes. Nous annonçons chaque appel dans notre [calendrier](/fr/calendar/), sur Instagram et Facebook, ainsi que sur le Portail européen de la jeunesse.
es:
  link: https://youth.europa.eu/volunteering/organisation/82546_es
  title: Voluntariado con el Cuerpo Europeo de Solidaridad
  summary: Vive, aprende y construye con nosotros durante unas semanas o varios meses — totalmente financiado para jóvenes de 18 a 30 años.
  linkLabel: Nuestra página en el Portal Europeo de la Juventud
  facts:
  - label: Para quién
    value: 18–30 años, residentes legales en la UE
  - label: Duración
    value: 25 días (ESC Teams) a 3–6 meses
  - label: Idioma
    value: Inglés (basta un nivel básico)
  - label: Cubierto
    value: Comida, alojamiento, viaje, dinero de bolsillo, seguro
  - label: Certificado
    value: Youthpass
  body: |-
    El **Cuerpo Europeo de Solidaridad (CES)** es el programa de la Unión Europea que permite a los jóvenes hacer voluntariado en proyectos que benefician a las comunidades y al medio ambiente. The Evergreen Project cuenta con el **Sello de Calidad del CES** como organización de acogida y coordinadora (válido hasta el 31/12/2027) y recibe voluntarios de toda Europa varias veces al año, con el apoyo del INEDIVIM, la agencia nacional griega.

    ### Proyectos en 2026
    - **ESC Teams — Build with Earth & Wood** (15 de octubre – 8 de noviembre de 2026): 25 días de bioconstrucción con madera, cob y tierra para crear nuestra nueva shala de invierno — y cerrar juntos la temporada de verano.
    - **Voluntariado individual** (4 de septiembre – 13 de diciembre de 2026): tres voluntarios viven con nosotros al menos tres meses.

    ### Qué harás
    - bioconstrucción con tierra, madera y paja, y carpintería básica
    - huerta, agroforestería y prácticas regenerativas, cuidado de los senderos del Kallidromo
    - apoyo a retiros de yoga, formaciones de profesores y encuentros comunitarios
    - cocina vegetal, responsabilidades compartidas y autoorganización
    - yoga, mindfulness y círculos para compartir

    El ritmo es de 30–38 horas semanales, flexible y estacional, más 2 días libres al mes. No se necesita experiencia — y animamos especialmente a jóvenes con menos oportunidades a inscribirse: habrá apoyo.

    ### Dónde vivirás
    En el bosque — en nuestra casa de cob, en tiendas campana o en espacios ecológicos compartidos. El pueblo de Anavra está a 15 minutos a pie, con una gran casa comunitaria donde vivimos en invierno.

    ### Qué cubre el programa
    - alojamiento y comidas vegetarianas
    - dinero de bolsillo
    - el viaje de ida y vuelta a Grecia, reembolsado según las normas del CES
    - seguro completo
    - mentoría y formación durante todo el proyecto
    - clases de yoga y minicursos de masaje tailandés
    - un certificado **Youthpass**

    ### Cómo inscribirte
    Publicamos cada convocatoria, con su formulario, en nuestro [calendario](/es/calendar/) y en Instagram y Facebook. Debes tener entre 18 y 30 años y residir legalmente en un país de la UE. ¿Dudas? Escríbenos cuando quieras.

    ### Nuestros proyectos hasta ahora
    - **Eco-community kick start** (abril–septiembre de 2024) — seis voluntarios durante 21 semanas
    - **Agroforestry and fire protection fundamentals** (septiembre de 2024) — un proyecto de equipo de dos semanas
    - **Together with Nature – Daily Acts of Sustainability** (2025) — ocho voluntarios vivieron y construyeron con nosotros
    - **Voluntariado individual** (2026) — nuestras voluntarias de Chequia e Italia se quedaron cinco y seis meses… y les gustó tanto la comunidad que se mudaron a Atenas para seguir cerca
    - **Build with Earth & Wood** (otoño de 2026) — ESC Teams
  faq:
  - q: ¿Necesito experiencia?
    a: No. Aprendemos haciendo, juntos. Lo que importa es tu motivación y tu respeto por la naturaleza y por los demás.
  - q: ¿Cuál es el ritmo de trabajo?
    a: 30–38 horas a la semana, de forma flexible y estacional, más 2 días libres al mes.
  - q: ¿Tengo que hablar griego?
    a: No — los proyectos son en inglés y basta con un nivel básico.
  - q: Tengo más de 30 años o no puedo participar en el CES. ¿Puedo ir igualmente?
    a: ¡Sí! Echa un vistazo a [Quédate con nosotros](/es/activities/stay-with-us/) — puedes unirte a la vida comunitaria a cualquier edad.
  - q: ¿Dónde dormiré?
    a: En grandes tiendas campana con colchones de verdad durante los meses cálidos, y en casas durante la parte más fría del año.
  - q: ¿Cuándo son los próximos proyectos?
    a: Los proyectos del CES tienen fechas fijas. Anunciamos cada convocatoria en nuestro [calendario](/es/calendar/), en Instagram y Facebook, y en el Portal Europeo de la Juventud.
it:
  link: https://youth.europa.eu/volunteering/organisation/82546_it
  title: Volontariato con il Corpo europeo di solidarietà
  summary: Vivi, impara e costruisci con noi per qualche settimana o per diversi mesi — completamente finanziato per i giovani tra i 18 e i 30 anni.
  linkLabel: La nostra pagina sul Portale europeo per i giovani
  facts:
  - label: Per chi
    value: 18–30 anni, residenti legalmente nell’UE
  - label: Durata
    value: Da 25 giorni (ESC Teams) a 3–6 mesi
  - label: Lingua
    value: Inglese (basta un livello di base)
  - label: Coperto
    value: Vitto, alloggio, viaggio, pocket money, assicurazione
  - label: Certificato
    value: Youthpass
  body: |-
    Il **Corpo europeo di solidarietà (CES)** è il programma dell’Unione europea che permette ai giovani di fare volontariato in progetti utili alle comunità e all’ambiente. The Evergreen Project ha il **Marchio di qualità CES** come organizzazione ospitante e capofila (valido fino al 31/12/2027) e accoglie volontari da tutta Europa più volte all’anno, con il sostegno dell’INEDIVIM, l’agenzia nazionale greca.

    ### I progetti del 2026
    - **ESC Teams — Build with Earth & Wood** (15 ottobre – 8 novembre 2026): 25 giorni di bioedilizia con legno, cob e terra per creare la nostra nuova shala invernale — e chiudere insieme la stagione estiva.
    - **Volontariato individuale** (4 settembre – 13 dicembre 2026): tre volontari vivono con noi per almeno tre mesi.

    ### Cosa farai
    - bioedilizia con terra, legno e paglia, e falegnameria di base
    - orto, agroforestazione e pratiche rigenerative, cura dei sentieri del Kallidromo
    - supporto a ritiri di yoga, formazioni insegnanti e incontri di comunità
    - cucina vegetale, responsabilità condivise e auto-organizzazione
    - yoga, mindfulness e cerchi di condivisione

    Il ritmo è di 30–38 ore a settimana, flessibile e stagionale, più 2 giorni liberi al mese. Non serve esperienza — e incoraggiamo in particolare i giovani con minori opportunità a candidarsi: sarà previsto un supporto.

    ### Dove vivrai
    Nel bosco — nella nostra casa in cob, in tende a campana o in spazi abitativi ecologici condivisi. Il villaggio di Anavra è a 15 minuti a piedi, con una grande casa comunitaria dove viviamo d’inverno.

    ### Cosa copre il programma
    - alloggio e pasti vegetariani
    - pocket money
    - il viaggio di andata e ritorno in Grecia, rimborsato secondo le regole del CES
    - assicurazione completa
    - mentoring e formazione per tutta la durata del progetto
    - lezioni di yoga e mini-corsi di massaggio thailandese
    - un certificato **Youthpass**

    ### Come candidarsi
    Pubblichiamo ogni chiamata, con il suo modulo, nel nostro [calendario](/it/calendar/) e su Instagram e Facebook. Bisogna avere tra i 18 e i 30 anni e risiedere legalmente in un paese dell’UE. Domande? Scrivici quando vuoi.

    ### I nostri progetti finora
    - **Eco-community kick start** (aprile–settembre 2024) — sei volontari per 21 settimane
    - **Agroforestry and fire protection fundamentals** (settembre 2024) — un progetto di gruppo di due settimane
    - **Together with Nature – Daily Acts of Sustainability** (2025) — otto volontari hanno vissuto e costruito con noi
    - **Volontariato individuale** (2026) — le nostre volontarie da Cechia e Italia sono rimaste cinque e sei mesi… e hanno amato così tanto la comunità da trasferirsi ad Atene per restarle vicine
    - **Build with Earth & Wood** (autunno 2026) — ESC Teams
  faq:
  - q: Serve esperienza?
    a: No. Impariamo facendo, insieme. Conta la tua motivazione e il tuo rispetto per la natura e per gli altri.
  - q: Qual è il ritmo di lavoro?
    a: 30–38 ore a settimana, in modo flessibile e stagionale, più 2 giorni liberi al mese.
  - q: Devo parlare greco?
    a: No — i progetti si svolgono in inglese e basta un livello di base.
  - q: Ho più di 30 anni o non posso partecipare al CES. Posso venire lo stesso?
    a: Sì! Dai un’occhiata a [Stai con noi](/it/activities/stay-with-us/) — puoi unirti alla vita della comunità a qualsiasi età.
  - q: Dove dormirò?
    a: In grandi tende a campana con veri materassi nei mesi caldi, e in casa nella parte più fredda dell’anno.
  - q: Quando sono i prossimi progetti?
    a: I progetti CES hanno date fisse. Annunciamo ogni chiamata nel nostro [calendario](/it/calendar/), su Instagram e Facebook e sul Portale europeo per i giovani.
ru:
  link: https://youth.europa.eu/volunteering/organisation/82546_en
  title: Волонтёрство с Европейским корпусом солидарности
  summary: Живите, учитесь и стройте вместе с нами несколько недель или месяцев — полностью оплачивается для молодёжи 18–30 лет.
  linkLabel: Наша страница на Европейском молодёжном портале
  facts:
  - label: Для кого
    value: 18–30 лет, легально проживающие в ЕС
  - label: Длительность
    value: От 25 дней (ESC Teams) до 3–6 месяцев
  - label: Язык
    value: Английский (достаточно базового уровня)
  - label: Оплачивается
    value: Питание, проживание, дорога, карманные деньги, страховка
  - label: Сертификат
    value: Youthpass
  body: |-
    **Европейский корпус солидарности (ESC)** — программа Европейского союза, которая даёт молодёжи возможность участвовать волонтёрами в проектах на благо сообществ и природы. The Evergreen Project имеет **знак качества ESC** как принимающая и координирующая организация (до 31.12.2027) и несколько раз в год принимает волонтёров со всей Европы при поддержке INEDIVIM — национального агентства Греции.

    ### Проекты 2026 года
    - **ESC Teams — Build with Earth & Wood** (15 октября – 8 ноября 2026): 25 дней природного строительства из дерева, глины и земли — строим нашу новую зимнюю шалу и вместе закрываем летний сезон.
    - **Индивидуальное волонтёрство** (4 сентября – 13 декабря 2026): трое волонтёров живут с нами не менее трёх месяцев.

    ### Чем вы будете заниматься
    - природное строительство из земли, дерева и соломы, базовая работа с деревом
    - огород, агролесоводство и регенеративные практики, уход за тропами Каллидромо
    - помощь на йога-ретритах, обучении преподавателей и встречах сообщества
    - растительная кухня, общие обязанности и самоорганизация
    - йога, осознанность и круги

    Ритм — 30–38 часов в неделю, гибкий и сезонный, плюс 2 выходных дня в месяц. Опыт не нужен — и мы особенно приглашаем молодых людей с меньшими возможностями: поддержка будет.

    ### Где вы будете жить
    В лесу — в нашем глиняном доме, в шатрах-колоколах или в общих эко-пространствах. До деревни Анавра 15 минут пешком; там есть большой общинный дом, где мы живём зимой.

    ### Что оплачивает программа
    - проживание и вегетарианское питание
    - карманные деньги
    - дорогу в Грецию и обратно по правилам ESC
    - полную страховку
    - менторство и обучение на протяжении всего проекта
    - занятия йогой и мини-курсы тайского массажа
    - сертификат **Youthpass**

    ### Как подать заявку
    Каждый набор с анкетой мы публикуем в нашем [календаре](/ru/calendar/), в Instagram и Facebook. Вам должно быть 18–30 лет, и вы должны легально проживать в стране ЕС. Есть вопросы? Пишите в любое время.

    ### Наши проекты
    - **Eco-community kick start** (апрель–сентябрь 2024) — шесть волонтёров на 21 неделю
    - **Agroforestry and fire protection fundamentals** (сентябрь 2024) — двухнедельный командный проект
    - **Together with Nature – Daily Acts of Sustainability** (2025) — восемь волонтёров жили и строили вместе с нами
    - **Индивидуальное волонтёрство** (2026) — наши волонтёрки из Чехии и Италии пробыли у нас пять и шесть месяцев… и так полюбили сообщество, что переехали в Афины, чтобы оставаться рядом
    - **Build with Earth & Wood** (осень 2026) — ESC Teams
  faq:
  - q: Нужен ли опыт?
    a: Нет. Мы учимся на практике, вместе. Важны ваша мотивация и уважение к природе и другим людям.
  - q: Какой режим работы?
    a: 30–38 часов в неделю, гибко и по сезону, плюс 2 выходных дня в месяц.
  - q: Нужно ли говорить по-гречески?
    a: Нет — проекты проходят на английском, достаточно базового уровня.
  - q: Мне больше 30 или я не могу участвовать в ESC. Можно ли всё равно приехать?
    a: Да! Посмотрите раздел [Поживите у нас](/ru/activities/stay-with-us/) — присоединиться к жизни сообщества можно в любом возрасте.
  - q: Где я буду жить?
    a: В тёплые месяцы — в больших шатрах-колоколах с настоящими матрасами, в холодное время года — в домах.
  - q: Когда следующие проекты?
    a: У проектов ESC фиксированные даты. Мы объявляем каждый набор в нашем [календаре](/ru/calendar/), в Instagram и Facebook, а также на Европейском молодёжном портале.
de:
  link: https://youth.europa.eu/volunteering/organisation/82546_de
  title: Freiwilligendienst im Europäischen Solidaritätskorps
  summary: Lebe, lerne und baue mit uns für einige Wochen oder mehrere Monate — voll finanziert für junge Menschen zwischen 18 und 30.
  linkLabel: Unsere Seite im Europäischen Jugendportal
  facts:
  - label: Für wen
    value: 18–30, mit rechtmäßigem Wohnsitz in der EU
  - label: Dauer
    value: 25 Tage (ESC Teams) bis 3–6 Monate
  - label: Sprache
    value: Englisch (Grundkenntnisse reichen)
  - label: Abgedeckt
    value: Verpflegung, Unterkunft, Reise, Taschengeld, Versicherung
  - label: Zertifikat
    value: Youthpass
  body: |-
    Das **Europäische Solidaritätskorps (ESK)** ist das Programm der Europäischen Union, mit dem sich junge Menschen in Projekten für Gemeinschaften und Umwelt engagieren können. The Evergreen Project besitzt das **ESK-Qualitätssiegel** als Aufnahme- und koordinierende Organisation (gültig bis 31.12.2027) und nimmt mehrmals im Jahr Freiwillige aus ganz Europa auf — mit Unterstützung von INEDIVIM, der griechischen Nationalagentur.

    ### Projekte 2026
    - **ESC Teams — Build with Earth & Wood** (15. Oktober – 8. November 2026): 25 Tage Naturbau mit Holz, Cob und Erde für unsere neue Winter-Shala — und gemeinsamer Abschluss der Sommersaison.
    - **Individueller Freiwilligendienst** (4. September – 13. Dezember 2026): drei Freiwillige leben mindestens drei Monate bei uns.

    ### Was du tun wirst
    - Naturbau mit Erde, Holz und Stroh sowie einfache Holzarbeit
    - Garten, Agroforst und regenerative Landpraxis, Pflege der Wanderwege des Kallidromo
    - Unterstützung von Yoga-Retreats, Lehrerausbildungen und Gemeinschaftstreffen
    - pflanzliche Küche, geteilte Verantwortung und Selbstorganisation
    - Yoga, Achtsamkeit und Austauschkreise

    Der Rhythmus beträgt 30–38 Stunden pro Woche, flexibel und saisonal, plus 2 freie Tage im Monat. Erfahrung ist nicht nötig — und wir ermutigen besonders junge Menschen mit geringeren Chancen, sich zu bewerben: Unterstützung ist vorgesehen.

    ### Wo du wohnst
    Im Wald — in unserem Lehmhaus, in Glockenzelten oder in gemeinsamen Öko-Wohnräumen. Das Dorf Anavra ist 15 Gehminuten entfernt; dort gibt es ein großes Gemeinschaftshaus, in dem wir im Winter leben.

    ### Was das Programm abdeckt
    - Unterkunft und vegetarische Mahlzeiten
    - Taschengeld
    - Hin- und Rückreise nach Griechenland, erstattet nach ESK-Regeln
    - umfassende Versicherung
    - Mentoring und Schulungen während des gesamten Projekts
    - Yogastunden und Thai-Massage-Minikurse
    - ein **Youthpass**-Zertifikat

    ### So bewirbst du dich
    Jeden Aufruf mit Bewerbungsformular veröffentlichen wir in unserem [Kalender](/de/calendar/) sowie auf Instagram und Facebook. Du musst 18–30 Jahre alt sein und rechtmäßig in einem EU-Land wohnen. Fragen? Schreib uns jederzeit.

    ### Unsere bisherigen Projekte
    - **Eco-community kick start** (April–September 2024) — sechs Freiwillige für 21 Wochen
    - **Agroforestry and fire protection fundamentals** (September 2024) — ein zweiwöchiges Teamprojekt
    - **Together with Nature – Daily Acts of Sustainability** (2025) — acht Freiwillige lebten und bauten mit uns
    - **Individueller Freiwilligendienst** (2026) — unsere Freiwilligen aus Tschechien und Italien blieben fünf und sechs Monate … und mochten die Gemeinschaft so sehr, dass sie nach Athen gezogen sind, um in ihrer Nähe zu bleiben
    - **Build with Earth & Wood** (Herbst 2026) — ESC Teams
  faq:
  - q: Brauche ich Erfahrung?
    a: Nein. Wir lernen durch Tun, gemeinsam. Wichtig sind deine Motivation und dein Respekt vor der Natur und den anderen.
  - q: Wie ist der Arbeitsrhythmus?
    a: 30–38 Stunden pro Woche, flexibel und saisonal, plus 2 freie Tage im Monat.
  - q: Muss ich Griechisch sprechen?
    a: Nein — die Projekte laufen auf Englisch, Grundkenntnisse reichen.
  - q: Ich bin über 30 oder nicht für das ESK berechtigt. Kann ich trotzdem kommen?
    a: Ja! Schau dir [Bleib bei uns](/de/activities/stay-with-us/) an — am Gemeinschaftsleben kannst du in jedem Alter teilnehmen.
  - q: Wo werde ich schlafen?
    a: In den warmen Monaten in großen Glockenzelten mit richtigen Matratzen, in der kälteren Jahreszeit in Häusern.
  - q: Wann sind die nächsten Projekte?
    a: ESK-Projekte haben feste Termine. Wir kündigen jeden Aufruf in unserem [Kalender](/de/calendar/), auf Instagram und Facebook sowie im Europäischen Jugendportal an.
pt:
  link: https://youth.europa.eu/volunteering/organisation/82546_pt
  title: Voluntariado com o Corpo Europeu de Solidariedade
  summary: Viva, aprenda e construa connosco durante algumas semanas ou vários meses — totalmente financiado para jovens dos 18 aos 30 anos.
  linkLabel: A nossa página no Portal Europeu da Juventude
  facts:
  - label: Para quem
    value: 18–30 anos, residentes legais na UE
  - label: Duração
    value: 25 dias (ESC Teams) a 3–6 meses
  - label: Língua
    value: Inglês (basta um nível básico)
  - label: Coberto
    value: Alimentação, alojamento, viagem, dinheiro de bolso, seguro
  - label: Certificado
    value: Youthpass
  body: |-
    O **Corpo Europeu de Solidariedade (CES)** é o programa da União Europeia que permite aos jovens fazer voluntariado em projetos que beneficiam as comunidades e o ambiente. The Evergreen Project tem o **Selo de Qualidade do CES** como organização de acolhimento e coordenadora (válido até 31/12/2027) e recebe voluntários de toda a Europa várias vezes por ano, com o apoio do INEDIVIM, a agência nacional grega.

    ### Projetos em 2026
    - **ESC Teams — Build with Earth & Wood** (15 de outubro – 8 de novembro de 2026): 25 dias de bioconstrução com madeira, cob e terra para criar a nossa nova shala de inverno — e fechar juntos a temporada de verão.
    - **Voluntariado individual** (4 de setembro – 13 de dezembro de 2026): três voluntários vivem connosco durante pelo menos três meses.

    ### O que vai fazer
    - bioconstrução com terra, madeira e palha, e carpintaria básica
    - horta, agrofloresta e práticas regenerativas, cuidado dos trilhos do Kallidromo
    - apoio a retiros de yoga, formações de professores e encontros da comunidade
    - cozinha vegetal, responsabilidades partilhadas e auto-organização
    - yoga, mindfulness e círculos de partilha

    O ritmo é de 30–38 horas por semana, flexível e sazonal, mais 2 dias de folga por mês. Não é preciso experiência — e incentivamos especialmente jovens com menos oportunidades a candidatarem-se: haverá apoio.

    ### Onde vai viver
    Na floresta — na nossa casa de cob, em tendas sino ou em espaços ecológicos partilhados. A aldeia de Anavra fica a 15 minutos a pé, com uma grande casa comunitária onde vivemos no inverno.

    ### O que o programa cobre
    - alojamento e refeições vegetarianas
    - dinheiro de bolso
    - a viagem de ida e volta à Grécia, reembolsada segundo as regras do CES
    - seguro completo
    - mentoria e formação durante todo o projeto
    - aulas de yoga e minicursos de massagem tailandesa
    - um certificado **Youthpass**

    ### Como se candidatar
    Publicamos cada chamada, com o respetivo formulário, no nosso [calendário](/pt/calendar/) e no Instagram e Facebook. É preciso ter entre 18 e 30 anos e residir legalmente num país da UE. Dúvidas? Escreva-nos quando quiser.

    ### Os nossos projetos até agora
    - **Eco-community kick start** (abril–setembro de 2024) — seis voluntários durante 21 semanas
    - **Agroforestry and fire protection fundamentals** (setembro de 2024) — um projeto de equipa de duas semanas
    - **Together with Nature – Daily Acts of Sustainability** (2025) — oito voluntários viveram e construíram connosco
    - **Voluntariado individual** (2026) — as nossas voluntárias da Chéquia e de Itália ficaram cinco e seis meses… e gostaram tanto da comunidade que se mudaram para Atenas para ficarem perto
    - **Build with Earth & Wood** (outono de 2026) — ESC Teams
  faq:
  - q: Preciso de experiência?
    a: Não. Aprendemos fazendo, juntos. O que conta é a sua motivação e o seu respeito pela natureza e pelos outros.
  - q: Qual é o ritmo de trabalho?
    a: 30–38 horas por semana, de forma flexível e sazonal, mais 2 dias de folga por mês.
  - q: Tenho de falar grego?
    a: Não — os projetos decorrem em inglês e basta um nível básico.
  - q: Tenho mais de 30 anos ou não sou elegível para o CES. Posso ir na mesma?
    a: Sim! Veja [Fique connosco](/pt/activities/stay-with-us/) — pode juntar-se à vida comunitária em qualquer idade.
  - q: Onde vou dormir?
    a: Em grandes tendas sino com colchões a sério nos meses quentes, e em casas na parte mais fria do ano.
  - q: Quando são os próximos projetos?
    a: Os projetos do CES têm datas fixas. Anunciamos cada chamada no nosso [calendário](/pt/calendar/), no Instagram e no Facebook, e no Portal Europeu da Juventude.
