pt:
  title: Bem-estar e trabalho interior
  summary: Yoga, meditação, ecoterapia, dramaterapia e processo de grupo — para se ligar às suas emoções e à natureza.
  facts:
  - label: Abordagens
    value: Yoga, meditação, ecoterapia, dramaterapia, psicoterapia de processo de grupo
  body: |-
    No coração do projeto está uma intenção simples: **curar e capacitar as pessoas**, ajudando-as a ligar-se às suas emoções e a aprofundar o autoconhecimento.

    Fazemo-lo através de práticas que unem bem-estar e natureza:

    - **Yoga e meditação** na shala, para todos os níveis
    - **Ecoterapia**: caminhar, descansar e trabalhar na natureza como caminho para o equilíbrio
    - **Dramaterapia e movimento**, para exprimir o que as palavras não dizem
    - **Psicoterapia de processo de grupo** e círculos de partilha
    - **Alimentação saudável** e cozinha vegetariana

    Estas práticas fazem parte dos nossos projetos de voluntariado e retiros, e podem ser oferecidas a grupos mediante pedido.

    ### Na nossa floresta adoramos sentar-nos em círculo
    Círculos de **abertura**, para nos acolhermos e chegarmos por inteiro. Círculos de **partilha**, onde histórias e sentimentos nos aproximam. Círculos de **encerramento**, para honrar o que vivemos juntos. E círculos de **processo**, onde os membros mais permanentes se abrem, encontram clareza e se apoiam nos desafios. Porque num círculo todos são vistos — todos pertencem.
  image: /src/assets/uploads/practice-together.webp
