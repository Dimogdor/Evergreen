de:
  title: Wohlbefinden & innere Arbeit
  summary: Yoga, Meditation, Ökotherapie, Dramatherapie und Gruppenprozess — um mit den eigenen Gefühlen und der Natur in Kontakt zu kommen.
  facts:
  - label: Ansätze
    value: Yoga, Meditation, Ökotherapie, Dramatherapie, Gruppenprozess-Psychotherapie
  body: |-
    Im Herzen des Projekts steht eine einfache Absicht: **Menschen zu heilen und zu stärken**, indem wir ihnen helfen, mit ihren Gefühlen in Kontakt zu kommen und sich selbst besser kennenzulernen.

    Dafür verbinden wir Wohlbefinden und Natur:

    - **Yoga und Meditation** in der Shala, für alle Niveaus
    - **Ökotherapie**: Gehen, Ruhen und Arbeiten in der Natur als Weg zum Gleichgewicht
    - **Dramatherapie und Bewegung**, um auszudrücken, wofür Worte fehlen
    - **Gruppenprozess-Psychotherapie** und Austauschkreise
    - **Gesunde Ernährung** und vegetarische Küche

    Diese Praktiken sind Teil unserer Freiwilligenprojekte und Retreats und können auf Anfrage auch für Gruppen angeboten werden.

    ### In unserem Wald sitzen wir gern im Kreis
    Kreise des **Ankommens**, um einander willkommen zu heißen. Kreise des **Teilens**, in denen Geschichten und Gefühle uns näher zusammenbringen. Kreise des **Abschlusses**, um das gemeinsam Erlebte zu würdigen. Und **Prozess**-Kreise, in denen die festen Mitglieder sich öffnen, Klarheit finden und sich durch Herausforderungen tragen. Denn im Kreis wird jede·r gesehen — alle gehören dazu.
  image: /src/assets/uploads/practice-together.webp
  featured: false
  gallery:
