es:
  title: Talleres de bioconstrucción
  summary: Aprende a construir con tierra, cob, madera y materiales naturales — y a convivir mientras lo haces.
  facts:
  - label: Técnicas
    value: Tierra, cob, madera, materiales naturales
  - label: Incluye
    value: Alojamiento, comidas vegetarianas, vida comunitaria, todas las actividades
  - label: Espíritu
    value: Aprender · Construir · Vivir juntos
  body: |-
    Casi todo lo que hay en nuestro terreno se construyó a mano, con muchas manos. La bioconstrucción es nuestra forma de crecer — y una de las mejores maneras de unirte a nosotros: tomamos tierra del campo, la mezclamos con arena, paja y agua y damos forma a «panes» de tierra que se convierten en las paredes de nuestras construcciones de cob. Una manera lenta y arraigada de construir **con** la tierra, no sobre ella.

    ### Lo que hemos construido juntos
    - **Un refugio de tierra y madera** — dos fines de semana de taller en la primavera de 2025
    - **Una plataforma de madera sostenida por árboles vivos** — un espacio flotante para yoga y descanso entre las hojas (mayo de 2025)
    - **La casa del baile** — construida con mucho trabajo, muchas manos y bastante baile entremedias (verano de 2025)
    - **La casa de cob** — nuestro hogar de tierra, listo para acoger también en invierno (otoño de 2025)
    - **Un almacén de cob** (2026) y, ahora mismo, **nuestra nueva shala de invierno**

    ### Hands on Earth — 15 de octubre – 8 de noviembre de 2026
    Durante 25 días, Evergreen Project se convierte en un taller vivo en el bosque del monte Kallidromo: tierra, cob, madera y materiales naturales, aprendiendo del proceso y creando codo con codo. **Ven aunque sea 3 días — o quédate todo el viaje.** Incluye alojamiento, comidas vegetarianas, todas las actividades y la vida comunitaria. No hace falta experiencia — solo curiosidad y ganas de mancharte un poco. Para fechas e inscripción, envíanos un mensaje.
