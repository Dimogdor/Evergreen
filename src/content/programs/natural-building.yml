fr:
  title: Ateliers de construction naturelle
  summary: Apprenez à construire avec la terre, la bauge, le bois et les matériaux naturels — en vivant ensemble pendant le chantier.
  facts:
  - label: Techniques
    value: Terre, bauge (cob), bois, matériaux naturels
  - label: Inclus
    value: Hébergement, repas végétariens, vie communautaire, toutes les activités
  - label: Esprit
    value: Apprendre · Construire · Vivre ensemble
  body: |-
    Presque tout ce qui se trouve sur notre terrain a été construit à la main, par beaucoup de mains. La construction naturelle est notre façon de grandir — et l’une des meilleures manières de nous rejoindre : nous prenons la terre du champ, la mélangeons avec du sable, de la paille et de l’eau, et façonnons des « pains » de terre qui deviennent les murs de nos constructions en bauge. Une manière lente et ancrée de construire **avec** la terre, pas sur elle.

    ### Ce que nous avons construit ensemble
    - **Un abri en terre et bois** — deux week-ends d’atelier au printemps 2025
    - **Une plateforme en bois portée par des arbres vivants** — un espace suspendu pour le yoga et le repos au milieu des feuilles (mai 2025)
    - **La maison de la danse** — construite avec beaucoup de travail, beaucoup de mains et pas mal de danse entre les deux (été 2025)
    - **La maison en bauge** — notre maison de terre, prête à accueillir aussi en hiver (automne 2025)
    - **Un abri de rangement en bauge** (2026) et, en ce moment, **notre nouvelle shala d’hiver**

    ### Hands on Earth — 15 octobre – 8 novembre 2026
    Pendant 25 jours, Evergreen Project devient un atelier vivant dans la forêt du mont Kallidromo : terre, bauge, bois et matériaux naturels, en apprenant du processus et en créant côte à côte. **Venez pour 3 jours seulement — ou restez tout le voyage.** Hébergement, repas végétariens, toutes les activités et la vie communautaire sont inclus. Aucune expérience requise — juste de la curiosité et l’envie de se salir un peu. Pour les dates et l’inscription, envoyez-nous un message.
