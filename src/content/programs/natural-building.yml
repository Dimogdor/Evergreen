ru:
  title: Мастерские природного строительства
  summary: Научитесь строить из земли, глины (cob), дерева и природных материалов — и жить вместе, пока строите.
  facts:
  - label: Техники
    value: Земля, cob, дерево, природные материалы
  - label: Включено
    value: Проживание, вегетарианское питание, жизнь в сообществе, все занятия
  - label: Принцип
    value: Учимся · Строим · Живём вместе
  body: |-
    Почти всё на нашем участке построено руками — множеством рук. Природное строительство — это то, как мы растём, и один из лучших способов присоединиться к нам: мы берём землю с поля, смешиваем её с песком, соломой и водой и лепим земляные «буханки», из которых встают стены наших глиняных построек. Медленный, заземляющий способ строить **вместе** с землёй, а не на ней.

    ### Что мы построили вместе
    - **Укрытие из земли и дерева** — два выходных мастерских весной 2025 года
    - **Деревянный настил на живых деревьях** — парящая платформа для йоги и отдыха среди листвы (май 2025)
    - **Дом для танцев** — построенный большим трудом, многими руками и с танцами в перерывах (лето 2025)
    - **Глиняный дом** — наш земляной дом, готовый принимать гостей и зимой (осень 2025)
    - **Глиняная кладовая** (2026) и прямо сейчас — **наша новая зимняя шала**

    ### Hands on Earth — 15 октября – 8 ноября 2026
    На 25 дней Evergreen Project превращается в живую мастерскую в лесу горы Каллидромо: земля, глина, дерево и природные материалы, учимся у самого процесса и создаём бок о бок. **Можно приехать всего на 3 дня — или остаться на всё путешествие.** Проживание, вегетарианское питание, все занятия и жизнь в сообществе включены. Опыт не нужен — только любопытство и готовность немного испачкаться. О датах и участии — пишите нам.
