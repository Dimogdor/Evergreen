de:
  title: Naturbau-Workshops
  summary: Lerne, mit Erde, Cob, Holz und natürlichen Materialien zu bauen — und lebe dabei in Gemeinschaft.
  facts:
  - label: Techniken
    value: Erde, Cob, Holz, natürliche Materialien
  - label: Inklusive
    value: Unterkunft, vegetarische Mahlzeiten, Gemeinschaftsleben, alle Aktivitäten
  - label: Motto
    value: Lernen · Bauen · Zusammenleben
  body: |-
    Fast alles auf unserem Gelände wurde von Hand gebaut, von vielen Händen. Naturbau ist unsere Art zu wachsen — und eine der besten Möglichkeiten, bei uns mitzumachen: Wir nehmen Erde vom Feld, mischen sie mit Sand, Stroh und Wasser und formen Lehm-„Brote“, die zu den Wänden unserer Cob-Bauten werden. Eine langsame, erdende Art, **mit** der Erde zu bauen, nicht auf ihr.

    ### Was wir gemeinsam gebaut haben
    - **Ein Unterstand aus Erde und Holz** — zwei Workshop-Wochenenden im Frühjahr 2025
    - **Ein Holzdeck, getragen von lebenden Bäumen** — eine schwebende Plattform für Yoga und Ruhe zwischen den Blättern (Mai 2025)
    - **Das Tanzhaus** — gebaut mit viel Arbeit, vielen Händen und reichlich Tanz zwischendurch (Sommer 2025)
    - **Das Lehmhaus** — unser Erdhaus, bereit, auch im Winter Gäste zu empfangen (Herbst 2025)
    - **Ein Lagerraum aus Cob** (2026) und gerade jetzt **unsere neue Winter-Shala**

    ### Hands on Earth — 15. Oktober – 8. November 2026
    25 Tage lang wird das Evergreen Project zu einer lebendigen Werkstatt im Wald des Kallidromo: Erde, Cob, Holz und natürliche Materialien — vom Prozess lernen und Seite an Seite gestalten. **Komm schon für 3 Tage — oder bleib die ganze Reise.** Unterkunft, vegetarische Mahlzeiten, alle Aktivitäten und Gemeinschaftsleben sind inklusive. Erfahrung ist nicht nötig — nur Neugier und die Bereitschaft, ein bisschen schmutzig zu werden. Für Termine und Teilnahme schreib uns eine Nachricht.
