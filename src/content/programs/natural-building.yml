  title: Εργαστήρια φυσικής δόμησης
  summary: Μάθετε να χτίζετε με χώμα, πηλό, ξύλο και φυσικά υλικά — ζώντας μαζί όσο χτίζετε.
  facts:
  - label: Τεχνικές
    value: Χώμα, cob, ξύλο, φυσικά υλικά
  - label: Περιλαμβάνονται
    value: Διαμονή, χορτοφαγικά γεύματα, κοινοτική ζωή, όλες οι δραστηριότητες
  - label: Φιλοσοφία
    value: Μαθαίνουμε · Χτίζουμε · Ζούμε μαζί
  body: |-
    Σχεδόν ό,τι υπάρχει στον χώρο μας χτίστηκε με τα χέρια — με πολλά χέρια. Η φυσική δόμηση είναι ο τρόπος που μεγαλώνουμε — και ένας από τους καλύτερους τρόπους να έρθετε κοντά μας: παίρνουμε χώμα από το χωράφι, το ανακατεύουμε με άμμο, άχυρο και νερό και πλάθουμε χωμάτινα «καρβέλια» που γίνονται οι τοίχοι των κατασκευών μας από πηλό. Ένας αργός, γειωτικός τρόπος να χτίζουμε **με** τη γη, όχι πάνω της.

    ### Όσα έχουμε χτίσει μαζί
    - **Ένα καταφύγιο από χώμα και ξύλο** — δύο Σαββατοκύριακα εργαστηρίων την άνοιξη του 2025
    - **Μια ξύλινη εξέδρα πάνω σε ζωντανά δέντρα** — μια αιωρούμενη πλατφόρμα για γιόγκα και ξεκούραση ανάμεσα στα φύλλα (Μάιος 2025)
    - **Το σπιτάκι του χορού** — χτισμένο με πολλή δουλειά, πολλά χέρια και άφθονο χορό ενδιάμεσα (καλοκαίρι 2025)
    - **Το σπίτι από πηλό** — το χωμάτινο σπίτι μας, έτοιμο να φιλοξενεί και τον χειμώνα (φθινόπωρο 2025)
    - **Μια αποθήκη από πηλό** (2026) και, αυτή τη στιγμή, **η νέα χειμερινή μας σάλα**

    ### Hands on Earth — 15 Οκτωβρίου – 8 Νοεμβρίου 2026
    Για 25 μέρες το Evergreen Project γίνεται ένα ζωντανό εργαστήρι στο δάσος του Καλλιδρόμου: χώμα, πηλός, ξύλο και φυσικά υλικά, μαθαίνοντας από τη διαδικασία και δημιουργώντας δίπλα δίπλα. **Μπορείτε να έρθετε ακόμα και για 3 μέρες — ή να μείνετε για όλο το ταξίδι.** Περιλαμβάνονται διαμονή, χορτοφαγικά γεύματα, όλες οι δραστηριότητες και η κοινοτική ζωή. Δεν χρειάζεται εμπειρία — μόνο περιέργεια και διάθεση να λασπωθείτε λίγο. Για ημερομηνίες και συμμετοχή, στείλτε μας μήνυμα.
en:
  title: Natural building workshops
  summary: Learn to build with earth, cob, wood and natural materials — and live together while you do.
  facts:
  - label: Techniques
    value: Earth, cob, wood, natural materials
  - label: Included
    value: Accommodation, vegetarian meals, community living, all activities
  - label: Spirit
    value: Learn · Build · Live together
  body: |-
    Almost everything on our land was built by hand, by many hands. Natural building is how we grow — and one of the best ways to join us: we take soil from the field, mix it with sand, straw and water, and shape earthen loaves that become the walls of our cob creations. A slow, grounding way of building **with** the earth, not on it.

    ### What we have built together
    - **An eco-shelter of earth and wood** — two workshop weekends in spring 2025
    - **A wooden deck held by living trees** — a floating platform for yoga and rest among the leaves (May 2025)
    - **The dance house** — built with a lot of work, many hands and plenty of dancing in between (summer 2025)
    - **The cob house** — our earthen home, ready to welcome guests through the winter (autumn 2025)
    - **A cob storage space** (2026) and, right now, **our new winter shala**

    ### Hands on Earth — 15 October – 8 November 2026
    For 25 days the Evergreen Project becomes a living workshop in the forest of Mt. Kallidromo: earth, cob, wood and natural materials, learning from the process and creating side by side. **Join for as little as 3 days — or stay for the whole journey.** Accommodation, vegetarian meals, all activities and community living are included. No experience needed — just curiosity and the will to get a little muddy. For dates and participation, send us a message.
