it:
  title: Workshop di bioedilizia
  summary: Impara a costruire con terra, cob, legno e materiali naturali — vivendo insieme mentre costruisci.
  facts:
  - label: Tecniche
    value: Terra, cob, legno, materiali naturali
  - label: Incluso
    value: Alloggio, pasti vegetariani, vita di comunità, tutte le attività
  - label: Spirito
    value: Imparare · Costruire · Vivere insieme
  body: |-
    Quasi tutto ciò che c’è sul nostro terreno è stato costruito a mano, da tante mani. La bioedilizia è il nostro modo di crescere — e uno dei modi migliori per unirti a noi: prendiamo la terra del campo, la mescoliamo con sabbia, paglia e acqua e modelliamo «pagnotte» di terra che diventano i muri delle nostre costruzioni in cob. Un modo lento e radicato di costruire **con** la terra, non sopra di essa.

    ### Cosa abbiamo costruito insieme
    - **Un rifugio in terra e legno** — due weekend di workshop nella primavera 2025
    - **Una piattaforma in legno sorretta da alberi vivi** — uno spazio sospeso per yoga e riposo tra le foglie (maggio 2025)
    - **La casa della danza** — costruita con tanto lavoro, tante mani e parecchia danza nel mezzo (estate 2025)
    - **La casa in cob** — la nostra casa di terra, pronta ad accogliere anche d’inverno (autunno 2025)
    - **Un deposito in cob** (2026) e, proprio ora, **la nostra nuova shala invernale**

    ### Hands on Earth — 15 ottobre – 8 novembre 2026
    Per 25 giorni Evergreen Project diventa un laboratorio vivente nel bosco del monte Kallidromo: terra, cob, legno e materiali naturali, imparando dal processo e creando fianco a fianco. **Puoi venire anche solo per 3 giorni — o restare per tutto il viaggio.** Alloggio, pasti vegetariani, tutte le attività e la vita di comunità sono inclusi. Non serve esperienza — solo curiosità e voglia di sporcarsi un po’. Per date e partecipazione, scrivici.
