pt:
  title: Workshops de bioconstrução
  summary: Aprenda a construir com terra, cob, madeira e materiais naturais — e a viver em comunidade enquanto constrói.
  facts:
  - label: Técnicas
    value: Terra, cob, madeira, materiais naturais
  - label: Incluído
    value: Alojamento, refeições vegetarianas, vida comunitária, todas as atividades
  - label: Espírito
    value: Aprender · Construir · Viver juntos
  body: |-
    Quase tudo no nosso terreno foi construído à mão, por muitas mãos. A bioconstrução é a nossa forma de crescer — e uma das melhores maneiras de se juntar a nós: tiramos terra do campo, misturamo-la com areia, palha e água e moldamos «pães» de terra que se tornam as paredes das nossas construções de cob. Uma forma lenta e enraizada de construir **com** a terra, e não sobre ela.

    ### O que construímos juntos
    - **Um abrigo de terra e madeira** — dois fins de semana de workshop na primavera de 2025
    - **Uma plataforma de madeira sustentada por árvores vivas** — um espaço suspenso para yoga e descanso entre as folhas (maio de 2025)
    - **A casa da dança** — construída com muito trabalho, muitas mãos e bastante dança pelo meio (verão de 2025)
    - **A casa de cob** — a nossa casa de terra, pronta para acolher também no inverno (outono de 2025)
    - **Um armazém de cob** (2026) e, neste momento, **a nossa nova shala de inverno**

    ### Hands on Earth — 15 de outubro – 8 de novembro de 2026
    Durante 25 dias, o Evergreen Project torna-se uma oficina viva na floresta do monte Kallidromo: terra, cob, madeira e materiais naturais, aprendendo com o processo e criando lado a lado. **Venha nem que seja por 3 dias — ou fique a viagem toda.** Alojamento, refeições vegetarianas, todas as atividades e a vida comunitária estão incluídos. Não é preciso experiência — só curiosidade e vontade de se sujar um pouco. Para datas e participação, envie-nos uma mensagem.
