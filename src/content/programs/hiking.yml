es:
  title: Senderismo y naturaleza
  summary: Senderos desde nuestra puerta hasta los abetales, las mesetas y los lagos del monte Kallidromo.
  facts:
  - label: Dificultad
    value: Fácil a moderada
  - label: Trae
    value: Buen calzado, agua, gorra
  body: |-
    El monte Kallidromo es nuestro patio de juegos. Salimos a menudo de **excursión** juntos: por el bosque, hasta las praderas altas donde pastan caballos en libertad, al **lago Nevropolis** en la meseta o a miradores sobre el golfo Maliaco al atardecer.

    En los días libres, voluntarios y huéspedes disfrutan también de una **excursión en barco a las islas Lichadonisia** desde Kamena Vourla, un baño en el mar o una visita a las históricas Termópilas y sus aguas termales.

    ### Cuidar los senderos — y una nueva zona de escalada
    En 2025, con el apoyo de la Unión Europea y del INEDIVIM, organizamos acciones abiertas para **limpiar, marcar y señalizar los senderos del Kallidromo**, con paneles educativos de conciencia ecológica. Y desde el verano de 2026 estamos abriendo una **nueva zona de escalada en el monte Kallidromo** — otra forma de conectar con la montaña que nos rodea. Tras una larga caminata, nada como las **aguas termales** cercanas.
  image: /src/assets/uploads/meadow-freedom.webp
  featured: false
  gallery:
