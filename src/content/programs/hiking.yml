de:
  title: Wandern & Natur
  summary: Wege von unserer Tür bis zu den Tannenwäldern, Hochebenen und Seen des Kallidromo.
  facts:
  - label: Schwierigkeit
    value: Leicht bis mittel
  - label: Mitbringen
    value: Gute Schuhe, Wasser, Hut
  body: |-
    Das Kallidromo-Gebirge ist unser Spielplatz. Wir gehen regelmäßig gemeinsam **wandern**: durch den Wald, hinauf zu den Hochwiesen, auf denen Pferde frei weiden, zum **Nevropolis-See** auf der Hochebene oder zu Aussichtspunkten über dem Malischen Golf bei Sonnenuntergang.

    An freien Tagen lieben Freiwillige und Gäste auch einen **Bootsausflug zu den Lichadonisia-Inseln** ab Kamena Vourla, ein Bad im Meer oder einen Besuch der historischen Thermopylen und ihrer heißen Quellen.

    ### Die Wege pflegen — und ein neues Klettergebiet
    2025 haben wir mit Unterstützung der Europäischen Union und von INEDIVIM offene Aktionen organisiert, um **die Wanderwege des Kallidromo freizuschneiden, zu markieren und zu beschildern** — mit Lerntafeln für ökologisches Bewusstsein. Und seit Sommer 2026 erschließen wir ein **neues Klettergebiet im Kallidromo** — eine weitere Art, sich mit dem Berg zu verbinden, der uns umgibt. Nach einer langen Wanderung geht nichts über die nahen **heißen Quellen**.
  image: /src/assets/uploads/meadow-freedom.webp
  featured: false
  gallery:
