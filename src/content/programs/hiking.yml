it:
  title: Escursioni e natura
  summary: Sentieri dalla nostra porta fino alle abetaie, agli altopiani e ai laghi del monte Kallidromo.
  facts:
  - label: Difficoltà
    value: Da facile a media
  - label: Da portare
    value: Scarpe buone, acqua, cappello
  body: |-
    Il monte Kallidromo è il nostro parco giochi. Facciamo spesso **escursioni** insieme: nel bosco, fino ai prati alti dove pascolano cavalli in libertà, al **lago di Nevropolis** sull’altopiano o verso i belvedere sul golfo Maliaco al tramonto.

    Nei giorni liberi, volontari e ospiti amano anche una **gita in barca alle isole Lichadonisia** da Kamena Vourla, un bagno al mare o una visita alle storiche Termopili e alle loro sorgenti termali.

    ### Prendersi cura dei sentieri — e una nuova falesia
    Nel 2025, con il sostegno dell’Unione europea e dell’INEDIVIM, abbiamo organizzato azioni aperte per **pulire, segnare e segnalare i sentieri del Kallidromo**, con cartelli educativi di sensibilizzazione ecologica. E dall’estate 2026 stiamo aprendo una **nuova falesia di arrampicata sul monte Kallidromo** — un altro modo per entrare in contatto con la montagna che ci circonda. Dopo una lunga camminata, niente di meglio delle vicine **sorgenti termali**.
  image: /src/assets/uploads/meadow-freedom.webp
  featured: false
  gallery:
